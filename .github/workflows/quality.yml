name: Quality

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.2

jobs:
  changed-areas:
    name: Detect required quality areas
    runs-on: ubuntu-22.04
    outputs:
      android: ${{ steps.detect.outputs.android }}
      coverage: ${{ steps.detect.outputs.coverage }}
      ios: ${{ steps.detect.outputs.ios }}
      js: ${{ steps.detect.outputs.js }}
      mutation: ${{ steps.detect.outputs.mutation }}
      rust: ${{ steps.detect.outputs.rust }}
      security: ${{ steps.detect.outputs.security }}
      swift: ${{ steps.detect.outputs.swift }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Detect required quality areas
        id: detect
        run: node scripts/quality/changed-areas.mjs

  static:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate workflow syntax and expressions
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check formatting of changed files
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: pnpm exec biome format --changed --since="origin/$BASE_REF" --no-errors-on-unmatched
      - name: Install Lychee 0.24.2
        run: |
          mkdir -p "$RUNNER_TEMP/docs-qa"
          cd "$RUNNER_TEMP/docs-qa"
          curl --fail --location --retry 3 -o lychee.tar.gz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz
          sha256sum --check <<'CHECKSUMS'
          73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5  lychee.tar.gz
          CHECKSUMS
          tar -xzf lychee.tar.gz --strip-components=1
          sudo install -m 755 lychee /usr/local/bin/
      - run: pnpm qa
      - name: Raw ESLint report
        if: always()
        run: pnpm lint:report
      - name: Unused code report
        if: always()
        run: |
          mkdir -p reports
          pnpm exec knip --reporter json > reports/knip.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-quality-reports
          path: reports/
          retention-days: 14

  ios-dependencies:
    needs: changed-areas
    if: needs.changed-areas.outputs.ios == 'true'
    name: iOS dependencies (no cache)
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install cocoapods -v 1.16.2 --no-document
      - name: Install Readium from official sources without caches
        run: ruby scripts/quality/readium-ios-dependencies.rb

  unit:
    needs: changed-areas
    if: needs.changed-areas.outputs.js == 'true'
    name: Unit tests / ${{ matrix.package }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: "@my-reader/fonts"
            command: test
          - package: "@my-reader/i18n"
            command: test
          - package: "@my-reader/tools"
            command: test
          - package: my-reader
            command: test:unit
          - package: my-reader-mobile
            command: test:ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter '${{ matrix.package }}' '${{ matrix.command }}'

  coverage:
    needs: changed-areas
    if: needs.changed-areas.outputs.js == 'true'
    name: Coverage / ${{ matrix.package }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: "@my-reader/fonts"
            command: test:coverage
            directory: packages/fonts
          - package: "@my-reader/i18n"
            command: test:coverage
            directory: packages/i18n
          - package: "@my-reader/tools"
            command: test:coverage
            directory: packages/tools
          - package: my-reader
            command: test:unit:coverage
            directory: my-reader
          - package: my-reader-mobile
            command: test:coverage
            directory: my-reader-mobile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Collect Vitest coverage without a percentage gate
        if: matrix.package != 'my-reader-mobile'
        run: >-
          pnpm --filter '${{ matrix.package }}' '${{ matrix.command }}'
          --coverage.thresholds.lines=0 --coverage.thresholds.statements=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0
      - name: Collect Jest coverage without a percentage gate
        if: matrix.package == 'my-reader-mobile'
        run: pnpm --filter '${{ matrix.package }}' '${{ matrix.command }}' --coverageThreshold='{}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ strategy.job-index }}
          path: ${{ matrix.directory }}/coverage/
          if-no-files-found: error
          retention-days: 14

  mutation:
    needs: changed-areas
    if: needs.changed-areas.outputs.mutation == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm qa:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  rust:
    needs: changed-areas
    if: needs.changed-areas.outputs.rust == 'true'
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings -D clippy::cognitive_complexity
      - run: cargo test --locked --workspace --no-fail-fast

  rust-coverage:
    needs: changed-areas
    if: needs.changed-areas.outputs.rust == 'true'
    name: Rust coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: mkdir -p reports/rust
        if: always()
      - run: pnpm qa:rust:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-coverage-report
          path: reports/rust/
          if-no-files-found: error
          retention-days: 14

  rust-desktop-coverage:
    needs: changed-areas
    if: needs.changed-areas.outputs.rust == 'true'
    name: Rust desktop coverage / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-coverage
          workspaces: . -> target/llvm-cov-target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Collect desktop compiler coverage
        shell: bash
        run: |
          mkdir -p reports/rust-desktop
          coverage_packages=(-p my-reader)
          # Collect Core's Apple-only proxy tests on macOS.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            coverage_packages+=(-p my-reader-core)
          fi
          cargo llvm-cov --locked "${coverage_packages[@]}" --lcov --output-path reports/rust-desktop/lcov.info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-desktop-coverage-${{ matrix.os }}
          path: reports/rust-desktop/
          if-no-files-found: error
          retention-days: 14

  security:
    needs: changed-areas
    if: needs.changed-areas.outputs.security == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: mkdir -p reports
      - name: npm production dependency audit
        if: always()
        timeout-minutes: 5
        run: pnpm audit --prod --audit-level moderate --json > reports/npm-audit.json
      - name: Cargo dependency audit
        if: always()
        timeout-minutes: 5
        run: cargo audit --json > reports/cargo-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: reports/
          retention-days: 14

  android-coverage:
    needs: changed-areas
    if: needs.changed-areas.outputs.android == 'true'
    name: Android native coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter my-reader-mobile exec expo prebuild --platform android --no-install
      - name: Enable KVM for Android device tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download emulator dependencies
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes) > /dev/null
          for attempt in 1 2 3; do
            if "$sdkmanager" --verbose --install emulator 'system-images;android-35;default;x86_64'; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          working-directory: my-reader-mobile/android
          script: ./gradlew -I ../tests/native-sharing/android.init.gradle -I ../../scripts/quality/android-coverage.init.gradle :my-reader-readium:createDebugUnitTestCoverageReport :expo-sharing:createDebugUnitTestCoverageReport :my-reader-readium:createDebugAndroidTestCoverageReport -PreactNativeArchitectures=x86_64 --console=plain
      - name: Export Android compiler coverage
        run: |
          python3 scripts/quality/native-coverage.py jacoco my-reader-mobile/modules/readium/android/build/reports/coverage/test/debug/report.xml reports/native/android/readium-unit.info my-reader-mobile/modules/readium/android/src/main/java
          python3 scripts/quality/native-coverage.py jacoco my-reader-mobile/modules/readium/android/build/reports/coverage/androidTest/debug/connected/report.xml reports/native/android/readium-device.info my-reader-mobile/modules/readium/android/src/main/java
          python3 scripts/quality/native-coverage.py jacoco my-reader-mobile/node_modules/expo-sharing/android/build/reports/coverage/test/debug/report.xml reports/native/android/sharing.info my-reader-mobile/node_modules/expo-sharing/android/src/main/java
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-coverage-report
          path: reports/native/android/
          if-no-files-found: error
          retention-days: 14

  swift-coverage:
    needs: changed-areas
    if: needs.changed-areas.outputs.swift == 'true'
    name: Swift native coverage
    runs-on: macos-26
    timeout-minutes: 60
    env:
      USE_CCACHE: "1"
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi
          ccache --version
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ccache"
      - run: gem install cocoapods -v 1.16.2 --no-document
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter my-reader-mobile exec expo prebuild --platform ios --no-install
      - name: Identify the native toolchain and dependencies
        id: native-cache
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('my-reader-mobile/package.json', 'my-reader-mobile/app.json', 'my-reader-mobile/app.config.*', 'my-reader-mobile/ios/Podfile*', 'my-reader-mobile/modules/**/package.json', 'my-reader-mobile/modules/**/expo-module.config.json', 'my-reader-mobile/modules/**/*.podspec', 'my-reader-mobile/modules/**/*.rb', 'my-reader-mobile/plugins/**', 'patches/**', 'pnpm-lock.yaml') }}
        run: |
          xcodebuild -version
          xcode_version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)
          echo "key=${{ runner.os }}-${{ runner.arch }}-$xcode_version-$DEPENDENCIES_HASH" >> "$GITHUB_OUTPUT"
      - name: Restore compiler cache
        id: ccache-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: swift-ccache-v1-${{ steps.native-cache.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            swift-ccache-v1-${{ steps.native-cache.outputs.key }}-
      - name: Restore CocoaPods installation
        id: pods-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/ReactNative
            my-reader-mobile/ios/Pods
            my-reader-mobile/ios/MyReader.xcworkspace
            my-reader-mobile/ios/Podfile.lock
          key: swift-pods-v2-${{ steps.native-cache.outputs.key }}
      - name: Install CocoaPods dependencies
        working-directory: my-reader-mobile/ios
        # Refresh source membership and codegen even when dependencies are cached.
        run: pod install
      - name: Save CocoaPods installation
        if: steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/ReactNative
            my-reader-mobile/ios/Pods
            my-reader-mobile/ios/MyReader.xcworkspace
            my-reader-mobile/ios/Podfile.lock
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}
      - run: python3 scripts/quality/native-coverage.py prepare-swift
      - name: Restore Xcode derived data
        id: xcode-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/myreader-native
          key: swift-derived-data-v2-${{ steps.native-cache.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            swift-derived-data-v2-${{ steps.native-cache.outputs.key }}-
      - name: Run the full native test scheme with compiler coverage
        id: native-tests
        run: |
          READER_SIMULATOR=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')
          XCODE_JOBS=$(sysctl -n hw.ncpu)
          # CocoaPods test hosts lack PODS_ROOT, which RN's ccache wrappers otherwise rely on.
          READER_REACT_NATIVE_PATH=$(node --print "require('path').dirname(require.resolve('react-native/package.json', { paths: ['./my-reader-mobile'] }))")
          # Start the cold simulator while xcodebuild compiles the test host.
          xcrun simctl boot "$READER_SIMULATOR"
          ccache --zero-stats
          # Compilation may be reused, but coverage must come from this run.
          rm -rf "$RUNNER_TEMP/myreader-native/Build/ProfileData"
          mkdir -p reports/native/swift
          xcodebuild test -quiet -showBuildTimingSummary -jobs "$XCODE_JOBS" -workspace my-reader-mobile/ios/MyReader.xcworkspace -scheme Reader-Coverage -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$READER_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/myreader-native" -resultBundlePath reports/native/swift/Reader.xcresult -only-testing:Readium-Unit-Tests REACT_NATIVE_PATH="$READER_REACT_NATIVE_PATH" ONLY_ACTIVE_ARCH=YES ARCHS="$(uname -m)" ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
          python3 scripts/quality/native-coverage.py swift-llvm "$RUNNER_TEMP/myreader-native" "$READER_SIMULATOR" reports/native/swift/lcov.info
      - name: Show compiler cache statistics
        if: always() && steps.native-tests.outcome != 'skipped'
        run: ccache --show-stats
      - name: Save compiler cache
        if: >-
          always() && steps.ccache-cache.outcome == 'success' &&
          steps.ccache-cache.outputs.cache-hit != 'true' &&
          steps.native-tests.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}
      - name: Save Xcode derived data
        if: >-
          always() && steps.xcode-cache.outcome == 'success' &&
          steps.xcode-cache.outputs.cache-hit != 'true' &&
          steps.native-tests.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/myreader-native
          key: ${{ steps.xcode-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-coverage-report
          path: reports/native/swift/
          if-no-files-found: error
          retention-days: 14

  coverage-report:
    name: Coverage report
    if: always() && needs.changed-areas.outputs.coverage == 'true'
    needs: [changed-areas, coverage, rust-coverage, rust-desktop-coverage, android-coverage, swift-coverage]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: '*coverage*'
          path: reports/coverage-input
      - name: Determine active coverage reports
        run: |
          groups=()
          [ '${{ needs.changed-areas.outputs.js }}' = true ] && groups+=(js)
          [ '${{ needs.changed-areas.outputs.rust }}' = true ] && groups+=(rust)
          [ '${{ needs.changed-areas.outputs.swift }}' = true ] && groups+=(swift)
          [ '${{ needs.changed-areas.outputs.android }}' = true ] && groups+=(android)
          (IFS=,; echo "COVERAGE_GROUPS=${groups[*]}") >> "$GITHUB_ENV"
      - name: Validate and normalize all compiler reports
        id: normalize
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/quality/coverage-reports.mjs
          echo "COVERAGE_REPORT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: JS and TypeScript coverage
        if: ${{ !cancelled() && steps.normalize.outcome == 'success' && needs.changed-areas.outputs.js == 'true' }}
        uses: getsentry/coverage-action@18b70839c6f742d77e2341f9d3f13a25d91b9f61
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: reports/coverage/js.info
          coverage-format: lcov
          disable-search: true
          enable-tests: false
          name: js
          status-key: js
          title: JS / TS coverage
          fail-ci-if-error: true
          fail-on-error: true
      - name: Rust Core, FFI and Tauri coverage
        if: ${{ !cancelled() && steps.normalize.outcome == 'success' && needs.changed-areas.outputs.rust == 'true' }}
        uses: getsentry/coverage-action@18b70839c6f742d77e2341f9d3f13a25d91b9f61
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: reports/coverage/rust.info
          coverage-format: lcov
          disable-search: true
          enable-tests: false
          name: rust
          status-key: rust
          title: Rust Core / FFI / Tauri coverage
          fail-ci-if-error: true
          fail-on-error: true
      - name: Swift coverage
        if: ${{ !cancelled() && steps.normalize.outcome == 'success' && needs.changed-areas.outputs.swift == 'true' }}
        uses: getsentry/coverage-action@18b70839c6f742d77e2341f9d3f13a25d91b9f61
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: reports/coverage/swift.info
          coverage-format: lcov
          disable-search: true
          enable-tests: false
          name: swift
          status-key: swift
          title: Swift Readium / sharing coverage
          fail-ci-if-error: true
          fail-on-error: true
      - name: Android Java and Kotlin coverage
        if: ${{ !cancelled() && steps.normalize.outcome == 'success' && needs.changed-areas.outputs.android == 'true' }}
        uses: getsentry/coverage-action@18b70839c6f742d77e2341f9d3f13a25d91b9f61
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: reports/coverage/android.info
          coverage-format: lcov
          disable-search: true
          enable-tests: false
          name: android
          status-key: android
          title: Android Readium / sharing coverage
          fail-ci-if-error: true
          fail-on-error: true
      - name: Verify stored baselines and update one PR summary
        if: ${{ !cancelled() && steps.normalize.outcome == 'success' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { publishCoverage } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/quality/publish-coverage.mjs`);
            await publishCoverage({ github, context, core });
      - name: Enforce 80% changed-line coverage independently per language
        if: ${{ !cancelled() && steps.normalize.outcome == 'success' }}
        run: >-
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          import { parseCoverageGroups, requireChangedCoverage } from "./scripts/quality/coverage-reports.mjs";
          requireChangedCoverage(JSON.parse(readFileSync("reports/coverage/summary.json", "utf8")), parseCoverageGroups());'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normalized-coverage-reports
          path: reports/coverage/
          if-no-files-found: error
          retention-days: 14

  changed-coverage-gate:
    name: ${{ github.event_name == 'pull_request' && 'Changed-line coverage' || 'Coverage report integrity' }}
    if: always()
    needs: [changed-areas, coverage-report]
    runs-on: ubuntu-22.04
    steps:
      - name: Require all language thresholds and reports to pass
        run: |
          test '${{ needs.changed-areas.result }}' = success
          if [ '${{ needs.changed-areas.outputs.coverage }}' = true ]; then
            test '${{ needs.coverage-report.result }}' = success
          else
            test '${{ needs.coverage-report.result }}' = skipped
          fi

  qa-gate:
    name: QA
    if: always()
    needs: [changed-areas, static, ios-dependencies, mutation, rust, security]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every QA job to succeed
        run: |
          test '${{ needs.changed-areas.result }}' = success
          test '${{ needs.static.result }}' = success
          if [ '${{ needs.changed-areas.outputs.ios }}' = true ]; then test '${{ needs.ios-dependencies.result }}' = success; else test '${{ needs.ios-dependencies.result }}' = skipped; fi
          if [ '${{ needs.changed-areas.outputs.mutation }}' = true ]; then test '${{ needs.mutation.result }}' = success; else test '${{ needs.mutation.result }}' = skipped; fi
          if [ '${{ needs.changed-areas.outputs.rust }}' = true ]; then test '${{ needs.rust.result }}' = success; else test '${{ needs.rust.result }}' = skipped; fi
          if [ '${{ needs.changed-areas.outputs.security }}' = true ]; then test '${{ needs.security.result }}' = success; else test '${{ needs.security.result }}' = skipped; fi

  unit-gate:
    name: Unit tests
    if: always()
    needs: [changed-areas, unit, coverage, rust, rust-coverage, rust-desktop-coverage, android-coverage, swift-coverage, coverage-report]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every unit test job to succeed
        run: |
          test '${{ needs.changed-areas.result }}' = success
          if [ '${{ needs.changed-areas.outputs.js }}' = true ]; then
            test '${{ needs.unit.result }}' = success
            test '${{ needs.coverage.result }}' = success
          else
            test '${{ needs.unit.result }}' = skipped
            test '${{ needs.coverage.result }}' = skipped
          fi
          if [ '${{ needs.changed-areas.outputs.rust }}' = true ]; then test '${{ needs.rust.result }}' = success; else test '${{ needs.rust.result }}' = skipped; fi
          if [ '${{ needs.changed-areas.outputs.rust }}' = true ]; then
            test '${{ needs.rust-coverage.result }}' = success
            test '${{ needs.rust-desktop-coverage.result }}' = success
          else
            test '${{ needs.rust-coverage.result }}' = skipped
            test '${{ needs.rust-desktop-coverage.result }}' = skipped
          fi
          if [ '${{ needs.changed-areas.outputs.android }}' = true ]; then test '${{ needs.android-coverage.result }}' = success; else test '${{ needs.android-coverage.result }}' = skipped; fi
          if [ '${{ needs.changed-areas.outputs.swift }}' = true ]; then test '${{ needs.swift-coverage.result }}' = success; else test '${{ needs.swift-coverage.result }}' = skipped; fi
          if [ '${{ needs.changed-areas.outputs.coverage }}' = true ]; then test '${{ needs.coverage-report.result }}' = success; else test '${{ needs.coverage-report.result }}' = skipped; fi
