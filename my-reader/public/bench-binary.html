<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyReader paginator benchmark</title>
  </head>
  <body>
    <div id="status">running</div>
    <script type="module">
      /**
       * @returns {{ bodyHtml: string, cssText: string }}
       */
      function resolvePayload() {
        const payload = window.__BENCH_PAYLOAD;
        if (payload?.bodyHtml) {
          return {
            bodyHtml: payload.bodyHtml,
            cssText: payload.cssText ?? "",
          };
        }
        return {
          bodyHtml: "<p>Benchmark payload missing.</p>",
          cssText: "p { margin: 0 0 0.8em 0; }",
        };
      }

      /**
       * @returns {Promise<"binary" | "progressive">}
       */
      function resolveImpl() {
        const impl = window.__BENCH_IMPL ?? "binary";
        return impl === "progressive" ? "progressive" : "binary";
      }

      /**
       * @returns {Promise<void>}
       */
      async function run() {
        const impl = await resolveImpl();
        const mod =
          impl === "progressive"
            ? await import("/node_modules/@my-reader/tools/src/rendition/pagination/ProgressivePaginator.ts")
            : await import("/node_modules/@my-reader/tools/src/rendition/pagination/BinarySearchPaginator.ts");

        const PaginatorClass =
          impl === "progressive"
            ? mod.ProgressivePaginator
            : mod.BinarySearchPaginator;
        const { layoutTextChapterAtMeasureHost } = mod;

        const measureHost = document.createElement("div");
        document.body.appendChild(measureHost);

        const payload = resolvePayload();
        const chapter = {
          index: 0,
          title: "Bench Chapter",
          href: "bench.xhtml",
          type: "text",
          bodyHtml: payload.bodyHtml,
          cssText: payload.cssText,
          text: "",
        };

        const config = {
          fontFamily: "Georgia, serif",
          fontSize: 20,
          lineHeight: 1.7,
          viewPortHeight: 820,
          viewPortWidth: 640,
          paddingX: 1.2,
        };

        const paginator = new PaginatorClass();

        const tLayout1 = performance.now();
        const first = await layoutTextChapterAtMeasureHost(
          chapter,
          config,
          measureHost,
          paginator,
        );
        const firstLayoutMs = performance.now() - tLayout1;

        const tForward = performance.now();
        let forwardCount = 0;
        while (paginator.nextPage) {
          const prev = paginator.curPage?.index ?? -1;
          await paginator.gotoNextPage();
          const now = paginator.curPage?.index ?? -1;
          if (now <= prev) break;
          forwardCount += 1;
        }
        const forwardMs = performance.now() - tForward;

        const tBackward = performance.now();
        let backwardCount = 0;
        while (paginator.prevPage) {
          const prev = paginator.curPage?.index ?? -1;
          await paginator.gotoPrevPage();
          const now = paginator.curPage?.index ?? -1;
          if (now >= prev) break;
          backwardCount += 1;
        }
        const backwardMs = performance.now() - tBackward;

        const reflowConfig = { ...config, fontSize: 24, lineHeight: 1.8 };
        const tLayout2 = performance.now();
        const second = await layoutTextChapterAtMeasureHost(
          chapter,
          reflowConfig,
          measureHost,
          paginator,
        );
        const reflowMs = performance.now() - tLayout2;

        window.__benchResult = {
          impl: `myreader-${impl}`,
          pageCountBefore: first.pageCount,
          pageCountAfter: second.pageCount,
          firstLayoutMs,
          forwardCount,
          forwardMs,
          backwardCount,
          backwardMs,
          reflowMs,
        };

        document.getElementById("status").textContent = "done";
      }

      run().catch((error) => {
        window.__benchResult = { error: String(error) };
        document.getElementById("status").textContent = "error";
      });
    </script>
  </body>
</html>
