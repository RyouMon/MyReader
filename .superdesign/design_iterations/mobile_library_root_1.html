<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyReader · 书库根界面</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="mobile_library_root_theme_1.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Noto Sans SC", "DM Sans", "system-ui", "sans-serif"],
            serif: ["Noto Serif SC", "Lora", "serif"]
          }
        }
      }
    }
  </script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    .phone-frame { width: 100%; max-width: 960px; height: 100dvh; margin: 0 auto; position: relative; overflow: hidden; }
    .content-scroll { height: calc(100dvh - 86px); overflow-y: auto; padding: calc(env(safe-area-inset-top) + 16px) 16px 24px; }
    .touch-target { min-height: 48px; }
    .page-enter { animation: pageEnter 260ms ease-out both; }
    .icon-press { transition: transform 140ms ease-out, background-color 140ms ease-out; }
    .icon-press:active { transform: scale(0.96); }
    .search-focus { transition: box-shadow 160ms ease-out, border-color 160ms ease-out; }
    .search-focus:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 18%, transparent); border-color: color-mix(in srgb, var(--ring) 48%, var(--border)); }
    .library-row { transition: transform 160ms ease-out, background-color 160ms ease-out; }
    .library-row:active { transform: scale(0.995); background: color-mix(in srgb, var(--accent) 28%, var(--card)); }
    .refresh-icon.spin { animation: spinOnce 180ms ease-out; }
    @keyframes pageEnter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spinOnce { from { transform: rotate(0deg); } to { transform: rotate(120deg); } }
    @media (prefers-reduced-motion: reduce) {
      .page-enter { animation: fadeIn 180ms ease-out both; }
      .icon-press, .search-focus, .library-row { transition: opacity 120ms ease-out, background-color 120ms ease-out, border-color 120ms ease-out; }
      .icon-press:active, .library-row:active { transform: none; }
      .refresh-icon.spin { animation: none; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    }
    @media (min-width: 768px) {
      .content-scroll { padding: calc(env(safe-area-inset-top) + 24px) 24px 28px; }
    }
  </style>
</head>
<body>
  <main class="mobile-shell phone-frame page-enter">
    <div class="content-scroll">
      <header class="mb-4 flex items-center justify-between gap-3">
        <h1 class="text-[1.78rem] font-semibold leading-none">书库</h1>
        <div class="flex items-center gap-2">
          <button id="refresh-trigger" class="toolbar-button icon-press touch-target" type="button" aria-label="刷新书库">
            <i data-lucide="refresh-cw" class="refresh-icon size-5"></i>
          </button>
          <button class="toolbar-button icon-press touch-target" type="button" aria-label="添加书库">
            <i data-lucide="plus" class="size-5"></i>
          </button>
        </div>
      </header>

      <label class="mobile-search search-focus mb-4 flex items-center gap-3 rounded-[1.1rem] px-4 py-3 shadow-sm">
        <i data-lucide="search" class="size-4 meta-subtle"></i>
        <input class="w-full border-none bg-transparent text-[15px] outline-none" placeholder="搜索书库名称" />
      </label>

      <section class="library-list">
        <a href="mobile_library_5.html?library=%E5%B0%8F%E8%AF%B4%E6%80%BB%E5%BA%93" class="library-row touch-target">
          <div class="library-icon">
            <i data-lucide="library" class="size-5"></i>
          </div>
          <div class="library-copy">
            <div class="library-name">小说总库</div>
            <div class="library-meta">3,284 本</div>
          </div>
          <i data-lucide="chevron-right" class="library-chevron size-5"></i>
        </a>

        <a href="mobile_library_5.html?library=%E5%A4%96%E6%96%87%E9%A6%86%E8%97%8F" class="library-row touch-target">
          <div class="library-icon">
            <i data-lucide="books" class="size-5"></i>
          </div>
          <div class="library-copy">
            <div class="library-name">外文馆藏</div>
            <div class="library-meta">842 本</div>
          </div>
          <i data-lucide="chevron-right" class="library-chevron size-5"></i>
        </a>

        <a href="mobile_library_5.html?library=%E5%8E%86%E5%8F%B2%E6%96%87%E7%8C%AE" class="library-row touch-target">
          <div class="library-icon">
            <i data-lucide="book-open-text" class="size-5"></i>
          </div>
          <div class="library-copy">
            <div class="library-name">历史文献</div>
            <div class="library-meta">516 本</div>
          </div>
          <i data-lucide="chevron-right" class="library-chevron size-5"></i>
        </a>

        <a href="mobile_library_5.html?library=%E8%AE%BE%E8%AE%A1%E5%8F%82%E8%80%83%E5%BA%93" class="library-row touch-target">
          <div class="library-icon">
            <i data-lucide="book-copy" class="size-5"></i>
          </div>
          <div class="library-copy">
            <div class="library-name">设计参考库</div>
            <div class="library-meta">126 本</div>
          </div>
          <i data-lucide="chevron-right" class="library-chevron size-5"></i>
        </a>
      </section>
    </div>

    <nav class="mobile-tabbar absolute inset-x-0 bottom-0 flex items-center justify-around px-2 pb-[max(8px,env(safe-area-inset-bottom))] pt-2">
      <a href="mobile_home_5.html" class="mobile-tab--idle flex min-w-[5.5rem] flex-col items-center gap-1 rounded-2xl px-4 py-2 text-sm font-semibold no-underline">
        <i data-lucide="house" class="size-5"></i>
        <span>主页</span>
      </a>
      <a href="mobile_library_root_1.html" class="mobile-tab--active flex min-w-[5.5rem] flex-col items-center gap-1 rounded-2xl px-4 py-2 text-sm font-semibold no-underline">
        <i data-lucide="library" class="size-5"></i>
        <span>书库</span>
      </a>
      <a href="mobile_settings_5.html" class="mobile-tab--idle flex min-w-[5.5rem] flex-col items-center gap-1 rounded-2xl px-4 py-2 text-sm font-semibold no-underline">
        <i data-lucide="settings-2" class="size-5"></i>
        <span>设置</span>
      </a>
    </nav>
  </main>

  <script>
    const themeKey = 'myreader-theme-preview';
    const storedTheme = localStorage.getItem(themeKey) || 'system';
    const root = document.documentElement;

    function applyTheme(mode) {
      root.classList.remove('dark', 'light');
      if (mode === 'dark') {
        root.classList.add('dark');
        return;
      }
      if (mode === 'light') {
        root.classList.add('light');
      }
    }

    applyTheme(storedTheme);
    lucide.createIcons();

    const refreshTrigger = document.getElementById('refresh-trigger');
    const refreshIcon = refreshTrigger?.querySelector('.refresh-icon');

    refreshTrigger?.addEventListener('click', () => {
      refreshIcon?.classList.remove('spin');
      requestAnimationFrame(() => refreshIcon?.classList.add('spin'));
      window.setTimeout(() => refreshIcon?.classList.remove('spin'), 220);
    });
  </script>
</body>
</html>
