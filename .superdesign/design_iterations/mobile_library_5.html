<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyReader · 书库变体 A 精简版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="mobile_library_theme_5.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ["Noto Sans SC", "DM Sans", "system-ui", "sans-serif"], serif: ["Noto Serif SC", "Lora", "serif"] } } } }
  </script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    .phone-frame { width: 100%; max-width: 960px; height: 100dvh; margin: 0 auto; position: relative; overflow: hidden; }
    .content-scroll { height: calc(100dvh - 86px); overflow-y: auto; padding: calc(env(safe-area-inset-top) + 16px) 16px 24px; }
    .touch-target { min-height: 48px; }
    .book-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .page-enter { animation: pageEnter 260ms ease-out both; }
    @keyframes pageEnter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (min-width: 768px) {
      .content-scroll { padding: calc(env(safe-area-inset-top) + 24px) 24px 28px; }
      .book-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    }
  </style>
</head>
<body>
  <main class="mobile-shell phone-frame page-enter">
    <div class="content-scroll">
      <header class="mb-4 flex items-start justify-between gap-3">
        <div>
          <button class="touch-target flex items-center gap-2 px-1 py-1 text-left" type="button">
            <h1 class="text-[1.72rem] font-semibold leading-none">小说总库</h1>
            <i data-lucide="chevron-down" class="size-5 meta-subtle"></i>
          </button>
        </div>
        <button id="view-settings-trigger" class="mobile-surface touch-target flex size-12 items-center justify-center rounded-2xl" type="button" aria-label="排序与视图">
          <i data-lucide="sliders-horizontal" class="size-5"></i>
        </button>
      </header>

      <label class="mobile-search mb-4 flex items-center gap-3 rounded-[1.1rem] px-4 py-3 shadow-sm">
        <i data-lucide="search" class="size-4 meta-subtle"></i>
        <input class="w-full border-none bg-transparent text-[15px] outline-none" placeholder="搜索书名、作者、标签" />
      </label>

      <div class="mb-4 flex gap-2 overflow-x-auto pb-1">
        <button class="mobile-chip--active mobile-chip touch-target shrink-0 rounded-full px-4 py-2 text-sm font-semibold" type="button">全部</button>
        <button class="mobile-chip touch-target shrink-0 rounded-full px-4 py-2 text-sm font-semibold" type="button">未读</button>
        <button class="mobile-chip touch-target shrink-0 rounded-full px-4 py-2 text-sm font-semibold" type="button">阅读中</button>
        <button class="mobile-chip touch-target shrink-0 rounded-full px-4 py-2 text-sm font-semibold" type="button">已收藏</button>
      </div>

      <section class="mb-4 flex items-end justify-between px-1">
        <div>
          <h2 class="text-xl font-semibold">全部书籍</h2>
          <p class="meta-subtle mt-1 text-sm">3,284 本</p>
        </div>
      </section>

      <section class="book-grid">
        <article class="book-card rounded-[1.2rem] p-3">
          <div class="book-cover-frame rounded-[0.95rem]"><img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&w=500&q=80" alt="book" class="aspect-[2/3] w-full object-cover" /></div>
          <h3 class="mt-3 line-clamp-2 text-[15px] font-semibold">黑暗的左手</h3>
          <p class="meta-subtle mt-1 text-sm">Ursula K. Le Guin</p>
        </article>
        <article class="book-card rounded-[1.2rem] p-3">
          <div class="book-cover-frame rounded-[0.95rem]"><img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=500&q=80" alt="book" class="aspect-[2/3] w-full object-cover" /></div>
          <h3 class="mt-3 line-clamp-2 text-[15px] font-semibold">玫瑰之名</h3>
          <p class="meta-subtle mt-1 text-sm">Umberto Eco</p>
        </article>
        <article class="book-card rounded-[1.2rem] p-3">
          <div class="book-cover-frame rounded-[0.95rem]"><img src="https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=500&q=80" alt="book" class="aspect-[2/3] w-full object-cover" /></div>
          <h3 class="mt-3 line-clamp-2 text-[15px] font-semibold">大师与玛格丽特</h3>
          <p class="meta-subtle mt-1 text-sm">Mikhail Bulgakov</p>
        </article>
        <article class="book-card rounded-[1.2rem] p-3">
          <div class="book-cover-frame rounded-[0.95rem]"><img src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d?auto=format&fit=crop&w=500&q=80" alt="book" class="aspect-[2/3] w-full object-cover" /></div>
          <h3 class="mt-3 line-clamp-2 text-[15px] font-semibold">一无所有</h3>
          <p class="meta-subtle mt-1 text-sm">Ursula K. Le Guin</p>
        </article>
        <article class="book-card rounded-[1.2rem] p-3">
          <div class="book-cover-frame rounded-[0.95rem]"><img src="https://images.unsplash.com/photo-1519682337058-a94d519337bc?auto=format&fit=crop&w=500&q=80" alt="book" class="aspect-[2/3] w-full object-cover" /></div>
          <h3 class="mt-3 line-clamp-2 text-[15px] font-semibold">云图</h3>
          <p class="meta-subtle mt-1 text-sm">David Mitchell</p>
        </article>
        <article class="book-card rounded-[1.2rem] p-3">
          <div class="book-cover-frame rounded-[0.95rem]"><img src="https://images.unsplash.com/photo-1511108690759-009324a90311?auto=format&fit=crop&w=500&q=80" alt="book" class="aspect-[2/3] w-full object-cover" /></div>
          <h3 class="mt-3 line-clamp-2 text-[15px] font-semibold">你一生的故事</h3>
          <p class="meta-subtle mt-1 text-sm">Ted Chiang</p>
        </article>
      </section>
    </div>

    <div id="overlay" class="overlay"></div>

    <section id="settings-popover" class="popover-menu">
      <div class="menu-group">
        <p class="meta-subtle mb-2 px-1 text-xs font-semibold">排序方式</p>
        <div class="flex flex-col gap-1">
          <button class="menu-option active" type="button">最近添加</button>
          <button class="menu-option" type="button">书名</button>
          <button class="menu-option" type="button">作者</button>
          <button class="menu-option" type="button">阅读进度</button>
        </div>
      </div>
      <div class="menu-group">
        <p class="meta-subtle mb-2 px-1 text-xs font-semibold">视图方式</p>
        <div class="flex flex-col gap-1">
          <button class="menu-option active" type="button">网格视图</button>
          <button class="menu-option" type="button">列表视图</button>
        </div>
      </div>
    </section>

    <nav class="mobile-tabbar absolute inset-x-0 bottom-0 flex items-center justify-around px-2 pb-[max(8px,env(safe-area-inset-bottom))] pt-2">
      <a href="mobile_home_5.html" class="mobile-tab--idle flex min-w-[5.5rem] flex-col items-center gap-1 rounded-2xl px-4 py-2 text-sm font-semibold no-underline">
        <i data-lucide="house" class="size-5"></i>
        <span>主页</span>
      </a>
      <a href="mobile_library_5.html" class="mobile-tab--active flex min-w-[5.5rem] flex-col items-center gap-1 rounded-2xl px-4 py-2 text-sm font-semibold no-underline">
        <i data-lucide="library" class="size-5"></i>
        <span>书库</span>
      </a>
      <a href="mobile_settings_5.html" class="mobile-tab--idle flex min-w-[5.5rem] flex-col items-center gap-1 rounded-2xl px-4 py-2 text-sm font-semibold no-underline">
        <i data-lucide="settings-2" class="size-5"></i>
        <span>设置</span>
      </a>
    </nav>
  </main>

  <script>
    const themeKey = 'myreader-theme-preview';
    const storedTheme = localStorage.getItem(themeKey) || 'system';
    const root = document.documentElement;

    function applyTheme(mode) {
      root.classList.remove('dark', 'light');
      if (mode === 'dark') {
        root.classList.add('dark');
        return;
      }
      if (mode === 'light') {
        root.classList.add('light');
      }
    }

    applyTheme(storedTheme);
    lucide.createIcons();
    const overlay = document.getElementById('overlay');
    const popover = document.getElementById('settings-popover');
    const trigger = document.getElementById('view-settings-trigger');

    function closeMenus() {
      overlay.classList.remove('open');
      popover.classList.remove('open');
    }

    trigger.addEventListener('click', () => {
      const open = popover.classList.contains('open');
      if (open) {
        closeMenus();
        return;
      }
      overlay.classList.add('open');
      popover.classList.add('open');
    });

    overlay.addEventListener('click', closeMenus);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeMenus();
    });
  </script>
</body>
</html>
