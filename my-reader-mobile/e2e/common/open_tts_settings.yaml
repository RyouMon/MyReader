appId: ${APP_ID}
name: Open narration settings through the Settings list
---
- runFlow: open_settings.yaml
- scrollUntilVisible:
    element:
      id: settings-tts-row
    direction: DOWN
    centerElement: true
- tapOn:
    id: settings-tts-row
- extendedWaitUntil:
    visible: "朗读配置|Narration settings"
    timeout: 10000
