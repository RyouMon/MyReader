<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-ui); background: var(--bg); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }

/* Progress bar */
.progress-row { display: flex; align-items: center; gap: 10px; }
.progress-bar { flex: 1; height: 4px; background: #EDE8DF; border-radius: 9999px; overflow: hidden; }
.progress-fill { height: 100%; background: #C4622D; border-radius: 9999px; transition: width 340ms cubic-bezier(0.25,0.1,0.25,1); }
.progress-label { font-size: 12px; color: var(--ink-3); width: 32px; text-align: right; }

/* Sync status chips */
.sync-row { display: flex; gap: 8px; flex-wrap: wrap; }
.sync-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; border: 1px solid; }
.sync-ok      { background: #E3F2EB; color: #3A7D5A; border-color: #C0E0D0; }
.sync-pending { background: #F5EDD8; color: #C4922D; border-color: #E0D0A0; }
.sync-error   { background: #F5E2E0; color: #B53A2F; border-color: #E0C0BC; }
.sync-offline { background: #F0EBE1; color: #9C9089; border-color: #DDD8CF; }

/* Sync dot animation */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1.2s linear infinite; }

/* Reader toolbar mockup */
.reader-toolbar { background: rgba(247,243,236,0.92); backdrop-filter: blur(12px); border-top: 1px solid rgba(28,23,20,.08); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; border-radius: 0 0 10px 10px; }
.toolbar-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--ink-2,#5C5349); cursor: pointer; }
.toolbar-icon:hover { background: var(--surface-2,#F5F1EA); }
.toolbar-progress { flex: 1; margin: 0 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.toolbar-pct { font-size: 11px; color: var(--ink-3); }
</style>
</head>
<body>
  <div>
    <div class="section-label">Reading Progress</div>
    <div style="display:flex;flex-direction:column;gap:8px;max-width:340px">
      <div class="progress-row">
        <span style="font-size:12px;color:var(--ink-2);width:100px;font-family:'Lora',serif;font-style:italic">The Name of the Rose</span>
        <div class="progress-bar"><div class="progress-fill" style="width:62%"></div></div>
        <span class="progress-label">62%</span>
      </div>
      <div class="progress-row">
        <span style="font-size:12px;color:var(--ink-2);width:100px">百年孤独</span>
        <div class="progress-bar"><div class="progress-fill" style="width:28%"></div></div>
        <span class="progress-label">28%</span>
      </div>
      <div class="progress-row">
        <span style="font-size:12px;color:var(--ink-2);width:100px">Dune</span>
        <div class="progress-bar"><div class="progress-fill" style="width:8%"></div></div>
        <span class="progress-label">8%</span>
      </div>
    </div>
  </div>

  <div>
    <div class="section-label">Sync Status</div>
    <div class="sync-row">
      <div class="sync-chip sync-ok">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        已同步 · 刚刚
      </div>
      <div class="sync-chip sync-pending">
        <svg class="spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
        同步中…
      </div>
      <div class="sync-chip sync-error">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        同步失败
      </div>
      <div class="sync-chip sync-offline">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a16 16 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        离线
      </div>
    </div>
  </div>

  <div>
    <div class="section-label">Reader Toolbar</div>
    <div class="reader-toolbar" style="max-width:400px">
      <div class="toolbar-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <div class="toolbar-progress">
        <div class="progress-bar" style="width:200px"><div class="progress-fill" style="width:62%"></div></div>
        <div class="toolbar-pct">第 234 页 · 62%</div>
      </div>
      <div style="display:flex;gap:4px">
        <div class="toolbar-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/></svg>
        </div>
        <div class="toolbar-icon" style="color:#C4622D">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
