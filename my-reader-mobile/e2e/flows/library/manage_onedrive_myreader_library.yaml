appId: ${APP_ID}
name: Manage a OneDrive MyReader library across upload restart and on-demand download
tags:
  - external-library
  - ios
---
# Required env:
#   E2E_ROOT_FOLDER, ONEDRIVE_SOURCE_NAME, ONEDRIVE_PARENT_FOLDER,
#   ONEDRIVE_LIBRARY_NAME, REMOTE_IMPORT_FILE_NAME, REMOTE_BOOK_TITLE.
# Use an EPUB of at least 128 MB so restart happens before upload completes.
- runFlow: ../../common/launch_preserving_data.yaml

# Scenario: create and activate an empty MyReader library on OneDrive.
- tapOn:
    id: "tab-settings"
- runFlow: ../../common/open_add_library.yaml
- tapOn:
    id: "add-library-create"
- tapOn: ${ONEDRIVE_SOURCE_NAME}
- extendedWaitUntil:
    visible: ${ONEDRIVE_PARENT_FOLDER}
    timeout: 30000
- tapOn: ${ONEDRIVE_PARENT_FOLDER}
- tapOn: "继续|Continue"
- tapOn:
    id: "new-library-name"
- eraseText
- inputText: ${ONEDRIVE_LIBRARY_NAME}
- tapOn: "^创建$|^Create$"
- extendedWaitUntil:
    visible: "成功添加书库：${ONEDRIVE_LIBRARY_NAME}|Library added: ${ONEDRIVE_LIBRARY_NAME}"
    timeout: 60000
- runFlow:
    file: ../../common/activate_library.yaml
    env:
      LIBRARY_NAME: ${ONEDRIVE_LIBRARY_NAME}

# Scenario: import appears immediately; explicit sync does not wait for upload.
- tapOn: "导入图书|Import Book"
- runFlow:
    file: ../../common/select_ios_e2e_fixture.yaml
    env:
      E2E_ROOT_FOLDER: ${E2E_ROOT_FOLDER}
      IMPORT_FILE_NAME: ${REMOTE_IMPORT_FILE_NAME}
- extendedWaitUntil:
    visible: ${REMOTE_BOOK_TITLE}
    timeout: 120000
- takeScreenshot: onedrive-import-local-cover
- extendedWaitUntil:
    visible:
      id: "transfer-arrow-up"
    timeout: 30000
- tapOn: "More"
- tapOn: "同步当前书库|Sync Current Library"
- extendedWaitUntil:
    visible: "书库已更新|Library updated"
    timeout: 30000
- assertVisible:
    id: "transfer-arrow-up"

# Scenario: a pending OneDrive upload survives process termination and resumes.
- stopApp
- launchApp
- tapOn:
    id: "tab-library"
- extendedWaitUntil:
    visible: ${REMOTE_BOOK_TITLE}
    timeout: 60000
- assertVisible:
    id: "transfer-arrow-up"

# Scenario: the local-first copy remains readable while upload is still active.
- tapOn: '打开《${REMOTE_BOOK_TITLE}》|Open "${REMOTE_BOOK_TITLE}"'
- extendedWaitUntil:
    visible:
      id: "reader-screen"
    timeout: 30000
- runFlow: ../../common/close_reader.yaml

# Scenario: cloud confirmation automatically enables local-file eviction.
- extendedWaitUntil:
    notVisible:
      id: "transfer-arrow-up"
    timeout: 1200000
- tapOn: "更多操作：${REMOTE_BOOK_TITLE}|More actions: ${REMOTE_BOOK_TITLE}"
- tapOn: "删除下载文件|Delete Downloaded File"
- assertVisible: "确定要删除《${REMOTE_BOOK_TITLE}》的本地下载文件吗？|Delete the local downloaded file.*${REMOTE_BOOK_TITLE}"
- tapOn: "删除|Delete"

# Scenario: unregistering leaves OneDrive untouched, and opening the same folder
# restores its catalog with the book in remote-only state.
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element: "管理书库：${ONEDRIVE_LIBRARY_NAME}|Manage library: ${ONEDRIVE_LIBRARY_NAME}"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: "管理书库：${ONEDRIVE_LIBRARY_NAME}|Manage library: ${ONEDRIVE_LIBRARY_NAME}"
- tapOn: "移除书库|Remove Library"
- assertVisible: "仅从应用中移除，文件不会删除。|Only remove it from the app. Files will not be deleted."
- tapOn: "移除|Remove"
- runFlow: ../../common/open_add_library.yaml
- tapOn:
    id: "add-library-open"
- tapOn: ${ONEDRIVE_SOURCE_NAME}
- tapOn: ${ONEDRIVE_PARENT_FOLDER}
- extendedWaitUntil:
    visible: ${ONEDRIVE_LIBRARY_NAME}
    timeout: 30000
- tapOn: ${ONEDRIVE_LIBRARY_NAME}
- tapOn: "打开|Open"
- extendedWaitUntil:
    visible: "成功添加书库：${ONEDRIVE_LIBRARY_NAME}|Library added: ${ONEDRIVE_LIBRARY_NAME}"
    timeout: 90000
- runFlow:
    file: ../../common/activate_library.yaml
    env:
      LIBRARY_NAME: ${ONEDRIVE_LIBRARY_NAME}
- extendedWaitUntil:
    visible: ${REMOTE_BOOK_TITLE}
    timeout: 60000
- tapOn: "更多操作：${REMOTE_BOOK_TITLE}|More actions: ${REMOTE_BOOK_TITLE}"
- assertVisible: "下载（EPUB）|Download .*EPUB.*"
- assertNotVisible: "删除下载文件|Delete Downloaded File"
- tapOn: "加入收藏|Add to Favorites"

# Scenario: one tap downloads through the Graph pre-authenticated URL and opens
# the reader automatically; no second tap or manual sync is needed.
- tapOn: '打开《${REMOTE_BOOK_TITLE}》|Open "${REMOTE_BOOK_TITLE}"'
- extendedWaitUntil:
    visible:
      id: "reader-screen"
    timeout: 600000
- runFlow: ../../common/close_reader.yaml

# Scenario: delete the remote book and synchronize its catalog tombstone/file.
- tapOn: "更多操作：${REMOTE_BOOK_TITLE}|More actions: ${REMOTE_BOOK_TITLE}"
- tapOn: "删除图书|Delete Book"
- tapOn: "删除|Delete"
- extendedWaitUntil:
    visible: "书库为空|Library is empty"
    timeout: 30000
- tapOn: "More"
- tapOn: "同步当前书库|Sync Current Library"
- extendedWaitUntil:
    visible: "书库已更新|Library updated"
    timeout: 90000
