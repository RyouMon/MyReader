appId: ${APP_ID}
name: Select a supported book fixture from the prepared iOS E2E folder
tags:
  - skip
---
# Required env: E2E_ROOT_FOLDER, IMPORT_FILE_NAME.
# Optional iPad fallback env: IOS_FILE_PICKER_USE_COORDINATES, IOS_FILE_POINT.
- extendedWaitUntil:
    visible: "Cancel|取消"
    timeout: 30000
- runFlow:
    when:
      true: ${IOS_FILE_PICKER_USE_COORDINATES == "true"}
    commands:
      # iOS 26 can hide the system picker contents from XCTest on iPad.
      # Reset to My iPad, then open Downloads / root / Fixtures / target file.
      - tapOn:
          point: "22%,46%"
      - waitForAnimationToEnd
      - tapOn:
          point: "52%,36%"
      - waitForAnimationToEnd
      - tapOn:
          point: "52%,36%"
      - waitForAnimationToEnd
      - tapOn:
          point: "52%,36%"
      - waitForAnimationToEnd
      - tapOn:
          point: "${IOS_FILE_POINT}"
- runFlow:
    when:
      true: ${IOS_FILE_PICKER_USE_COORDINATES != "true"}
    commands:
      - runFlow:
          when:
            notVisible:
              id: "${IMPORT_FILE_NAME}, (epub|pdf|cbz)"
          commands:
            - runFlow:
                when:
                  visible: "浏览|Browse"
                commands:
                  - tapOn: "浏览|Browse"
            - repeat:
                times: 8
                while:
                  visible:
                    id: "BackButton"
                commands:
                  - tapOn:
                      id: "BackButton"
                  - waitForAnimationToEnd
            - runFlow:
                when:
                  visible:
                    id: "DOC.sidebar.item.我的(iPhone|iPad)|DOC.sidebar.item.On My (iPhone|iPad)"
                commands:
                  - tapOn:
                      id: "DOC.sidebar.item.我的(iPhone|iPad)|DOC.sidebar.item.On My (iPhone|iPad)"
                  - waitForAnimationToEnd
            - tapOn:
                id: "DOC.sidebar.item.下载|DOC.sidebar.item.Downloads|下载|Downloads"
                point: "50%,25%"
            - waitForAnimationToEnd
            - scrollUntilVisible:
                element:
                  id: "${E2E_ROOT_FOLDER}, Folder"
                direction: DOWN
                timeout: 15000
            - tapOn:
                id: "${E2E_ROOT_FOLDER}, Folder"
                point: "50%,25%"
            - waitForAnimationToEnd
            - scrollUntilVisible:
                element:
                  id: "Fixtures, Folder"
                direction: DOWN
                timeout: 15000
            - tapOn:
                id: "Fixtures, Folder"
                point: "50%,25%"
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "${IMPORT_FILE_NAME}, (epub|pdf|cbz)"
          timeout: 30000
      - tapOn:
          id: "${IMPORT_FILE_NAME}, (epub|pdf|cbz)"
          point: "50%,25%"
