appId: ${APP_ID}
name: Register the isolated local WebDAV source
---
- openLink: myreadermobile://settings/webdav/add
- runFlow: confirm_deep_link.yaml
- tapOn:
    id: webdav-server-url
- inputText: ${WEBDAV_URL}
- tapOn:
    id: webdav-username
- inputText: maestro
- tapOn:
    id: webdav-password
- inputText: fixture-webdav-key
- tapOn: "完成|Complete"
- extendedWaitUntil:
    notVisible:
      id: webdav-server-url
    timeout: 30000
- openLink: myreadermobile://settings/webdav
- runFlow: confirm_deep_link.yaml
- runFlow:
    when:
      platform: iOS
      visible: "保存密码.*|Save Password.*"
    commands:
      - tapOn: "以后|Not Now"
- extendedWaitUntil:
    visible: ${WEBDAV_HOST}
    timeout: 30000
