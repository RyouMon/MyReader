appId: ${APP_ID}
name: Provider form returns through the native sheet stack
---
- runFlow: ../../common/launch_and_prepare.yaml
- openLink: myreadermobile://settings/tts
- runFlow: ../../common/confirm_deep_link.yaml
- scrollUntilVisible:
    element: "添加 TTS 供应商|Add TTS provider"
    direction: DOWN
- tapOn: "添加 TTS 供应商|Add TTS provider"
- tapOn: "OpenAI 兼容|OpenAI-compatible"
- assertVisible:
    id: tts-provider-name
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "1%,45%"
          end: "90%,45%"
          duration: 600
- runFlow:
    when:
      platform: Android
    commands:
      - back
- assertVisible: "OpenAI 兼容|OpenAI-compatible"
- assertNotVisible:
    id: tts-provider-name
- tapOn: "取消|Cancel"
- assertVisible: "添加 TTS 供应商|Add TTS provider"
