[package]
name = "my-reader-core"
version = "0.12.0"
edition.workspace = true

[features]
test-support = []

[[example]]
name = "executor_baseline"
required-features = ["test-support"]

[dependencies]
automerge.workspace = true
chrono.workspace = true
dunce.workspace = true
eventsource-stream = "0.2.3"
ferrous-opencc = { version = "0.4.0", default-features = false, features = ["t2s-conversion"] }
futures-util = { version = "0.3", features = ["sink"] }
http = "1"
hayro = "0.7.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
opendal.workspace = true
opendal-http-transport-reqwest = { version = "0.58.2", default-features = false, features = ["rustls-no-provider"] }
quick-xml = { version = "0.41", features = ["serialize"] }
reqwest.workspace = true
rbook = { version = "0.7.12", default-features = false }
ring.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1"
sha2.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
# Core supplies its own Rustls connector and root store for every WSS connection.
tokio-tungstenite = { version = "0.28", features = ["__rustls-tls"] }
tracing.workspace = true
unicode-normalization = "0.1.25"
unicode-script = "0.5.8"
url.workspace = true
uuid.workspace = true
webpki-roots = "1.0.10"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2-cf-network = { version = "0.3.2", default-features = false, features = ["std", "CFProxySupport"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString", "CFURL"] }

[dev-dependencies]
futures = "0.3"
tokio = { workspace = true, features = ["test-util"] }
