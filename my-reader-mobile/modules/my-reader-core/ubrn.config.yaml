rust:
  directory: ../../..
  manifestPath: my-reader-mobile/modules/my-reader-core/rust/Cargo.toml

bindings:
  cpp: cpp/bindings
  ts: src/generated
  uniffiToml: rust/uniffi.toml

android:
  directory: android
  targets:
    - arm64-v8a
    - armeabi-v7a
    - x86_64
  jniLibs: src/main/jniLibs
  useSharedLibrary: true

ios:
  directory: ios
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
  frameworkName: build/MyReaderCore

turboModule:
  cpp: cpp
  ts: src
  spec: NativeMyReaderCore
  entrypoint: src/index.ts
