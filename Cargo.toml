[workspace]
resolver = "2"
members = [
    "crates/myreader-rust-components",
    "crates/myreader-sync",
    "my-reader/src-tauri",
]
exclude = ["my-reader-mobile/modules/automerge-native/rust"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
automerge = "=0.10.0"
myreader-rust-components = { path = "crates/myreader-rust-components" }
myreader-sync = { path = "crates/myreader-sync" }
opendal = { version = "0.50", default-features = false, features = ["services-webdav", "services-fs", "services-onedrive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
uniffi = "=0.29.3"
uuid = { version = "1", features = ["v4"] }
rusqlite = "0.32.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
