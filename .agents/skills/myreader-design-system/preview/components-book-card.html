<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-ui); background: var(--bg); padding: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }

.book-card { width: 110px; cursor: pointer; }
.book-cover { width: 110px; height: 158px; border-radius: 10px; box-shadow: 2px 4px 16px rgba(28,23,20,.18),0 1px 3px rgba(28,23,20,.12); position: relative; overflow: hidden; transition: transform 200ms cubic-bezier(0.25,0.1,0.25,1), box-shadow 200ms; }
.book-card:hover .book-cover { transform: scale(1.02); box-shadow: 3px 6px 20px rgba(28,23,20,.24); }
.book-cover-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.book-cover-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 12px; }
.book-spine { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; border-radius: 10px 0 0 10px; }
.book-progress { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,.2); }
.book-progress-fill { height: 100%; background: rgba(255,255,255,.8); border-radius: 0 2px 2px 0; }
.book-info { margin-top: 8px; }
.book-title { font-size: 12px; font-weight: 500; color: var(--ink-1); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Lora',serif; }
.book-author { font-size: 11px; color: var(--ink-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.list-item { display: flex; gap: 12px; align-items: center; padding: 10px 12px; background: var(--surface); border: var(--border); border-radius: 8px; width: 340px; cursor: pointer; transition: background 120ms; }
.list-item:hover { background: var(--surface-2,#F5F1EA); }
.list-cover { width: 40px; height: 56px; border-radius: 5px; flex-shrink: 0; box-shadow: 1px 2px 6px rgba(28,23,20,.15); }
.list-info { flex: 1; min-width: 0; }
.list-title  { font-size: 13px; font-weight: 500; color: var(--ink-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Lora',serif; }
.list-author { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.list-meta   { font-size: 10px; color: var(--ink-3); margin-top: 4px; display: flex; gap: 6px; }
.list-badge  { font-size: 10px; background: #F5E8DF; color: #C4622D; padding: 1px 5px; border-radius: 3px; font-weight: 500; }
</style>
</head>
<body>
  <!-- Grid cards -->
  <div class="book-card">
    <div class="book-cover" style="background:linear-gradient(135deg,#4A3728,#2C1F16)">
      <div class="book-spine" style="background:rgba(0,0,0,.3)"></div>
      <div class="book-cover-placeholder">
        <div style="font-family:'Lora',serif;font-size:11px;font-weight:600;color:rgba(255,255,255,.9);text-align:center;line-height:1.3">The Name of the Rose</div>
      </div>
      <div class="book-progress"><div class="book-progress-fill" style="width:62%"></div></div>
    </div>
    <div class="book-info">
      <div class="book-title">The Name of the Rose</div>
      <div class="book-author">Umberto Eco</div>
    </div>
  </div>

  <div class="book-card">
    <div class="book-cover" style="background:linear-gradient(135deg,#1A3A4A,#0D2030)">
      <div class="book-spine" style="background:rgba(0,0,0,.3)"></div>
      <div class="book-cover-placeholder">
        <div style="font-family:'Lora',serif;font-size:11px;font-weight:600;color:rgba(255,255,255,.9);text-align:center;line-height:1.3">百年孤独</div>
      </div>
      <div class="book-progress"><div class="book-progress-fill" style="width:28%"></div></div>
    </div>
    <div class="book-info">
      <div class="book-title">百年孤独</div>
      <div class="book-author">加西亚·马尔克斯</div>
    </div>
  </div>

  <div class="book-card">
    <div class="book-cover" style="background:linear-gradient(135deg,#3A2840,#1E1428)">
      <div class="book-spine" style="background:rgba(0,0,0,.3)"></div>
      <div class="book-cover-placeholder">
        <div style="font-family:'Lora',serif;font-size:11px;font-weight:600;color:rgba(255,255,255,.9);text-align:center;line-height:1.3">Dune</div>
      </div>
    </div>
    <div class="book-info">
      <div class="book-title">Dune</div>
      <div class="book-author">Frank Herbert</div>
    </div>
  </div>

  <!-- List items -->
  <div style="display:flex;flex-direction:column;gap:6px">
    <div class="list-item">
      <div class="list-cover" style="background:linear-gradient(135deg,#4A3728,#2C1F16)"></div>
      <div class="list-info">
        <div class="list-title">The Name of the Rose</div>
        <div class="list-author">Umberto Eco</div>
        <div class="list-meta"><span class="list-badge">阅读中</span><span>62%</span><span>EPUB</span></div>
      </div>
    </div>
    <div class="list-item">
      <div class="list-cover" style="background:linear-gradient(135deg,#1A3A4A,#0D2030)"></div>
      <div class="list-info">
        <div class="list-title">百年孤独</div>
        <div class="list-author">加西亚·马尔克斯</div>
        <div class="list-meta"><span>28%</span><span>EPUB</span><span>3天前同步</span></div>
      </div>
    </div>
  </div>
</body>
</html>
