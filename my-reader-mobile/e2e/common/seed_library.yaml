appId: ${APP_ID}
name: Seed library fixture via deep link
tags:
  - skip
---
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink: myreadermobile://seed-library
      - runFlow: confirm_deep_link.yaml
      - runFlow: wait_for_home.yaml
- runFlow:
    when:
      platform: Android
    commands:
      - openLink:
          link: exp+my-reader-mobile://seed-library
          autoVerify: true
      - runFlow: wait_for_home.yaml
