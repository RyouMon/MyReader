appId: ${APP_ID}
name: Close the reader and return to the library
tags:
  - skip
---
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            notVisible: "Close reader"
          commands:
            - tapOn:
                point: "50%,50%"
      - extendedWaitUntil:
          visible: "Close reader"
          timeout: 10000
      - tapOn: "Close reader"
