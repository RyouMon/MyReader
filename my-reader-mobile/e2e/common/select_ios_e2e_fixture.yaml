appId: ${APP_ID}
name: Select a supported book fixture from the prepared iOS E2E folder
---
# Required env: E2E_ROOT_FOLDER, IMPORT_FILE_NAME.
- extendedWaitUntil:
    visible: "Cancel|取消"
    timeout: 30000
- runFlow:
    when:
      notVisible:
        id: "${IMPORT_FILE_NAME}, (epub|pdf|cbz)"
    commands:
      - runFlow:
          when:
            visible: "浏览|Browse"
          commands:
            - tapOn: "浏览|Browse"
      - repeat:
          times: 8
          while:
            visible:
              id: "BackButton"
              childOf:
                id: "Browse View \\(Picker\\)"
          commands:
            - tapOn:
                id: "BackButton"
                childOf:
                  id: "Browse View \\(Picker\\)"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              id: "DOC.sidebar.item.我的iPhone|DOC.sidebar.item.On My iPhone|DOC.sidebar.item.我的iPad|DOC.sidebar.item.On My iPad"
          commands:
            - tapOn:
                id: "DOC.sidebar.item.我的iPhone|DOC.sidebar.item.On My iPhone|DOC.sidebar.item.我的iPad|DOC.sidebar.item.On My iPad"
            - waitForAnimationToEnd
      - tapOn:
          id: "DOC.sidebar.item.下载|DOC.sidebar.item.Downloads|下载|Downloads"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            id: "${E2E_ROOT_FOLDER}, Folder"
          direction: DOWN
          timeout: 15000
      - tapOn:
          id: "${E2E_ROOT_FOLDER}, Folder"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            id: "Fixtures, Folder"
          direction: DOWN
          timeout: 15000
      - tapOn:
          id: "Fixtures, Folder"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "${IMPORT_FILE_NAME}, (epub|pdf|cbz)"
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: "${IMPORT_FILE_NAME}, (epub|pdf|cbz)"
    point: "50%,25%"
- extendedWaitUntil:
    notVisible:
      id: "Browse View \\(Picker\\)"
    timeout: 15000
