<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyReader — Mobile</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  @keyframes spin    { to { transform:rotate(360deg); } }
  @keyframes slideUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  @keyframes sheetIn { from { transform:translateY(100%); } to { transform:translateY(0); } }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body,#root { height:100%; }
  body { font-family:'DM Sans','PingFang SC',system-ui,sans-serif; background:#2A2520; display:flex; align-items:center; justify-content:center; -webkit-font-smoothing:antialiased; }
  ::-webkit-scrollbar { display:none; }
  input { font-family:inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const BOOKS = [
  { id:1, title:'The Name of the Rose', author:'Umberto Eco',     pct:62, pages:556, format:'EPUB', color:'#3A2818', color2:'#1E1208', synced:true  },
  { id:2, title:'百年孤独',             author:'加西亚·马尔克斯', pct:28, pages:417, format:'EPUB', color:'#1A3040', color2:'#0D1E28', synced:false },
  { id:3, title:'Dune',                 author:'Frank Herbert',   pct: 8, pages:688, format:'EPUB', color:'#2A1A40', color2:'#180E28', synced:true  },
  { id:4, title:'三体',                 author:'刘慈欣',           pct: 0, pages:302, format:'EPUB', color:'#0D2830', color2:'#061418', synced:true  },
  { id:5, title:'Normal People',        author:'Sally Rooney',    pct:44, pages:288, format:'EPUB', color:'#2A3A20', color2:'#161E10', synced:true  },
  { id:6, title:'海边的卡夫卡',         author:'村上春树',         pct:91, pages:505, format:'EPUB', color:'#3A2A10', color2:'#1E1408', synced:false },
];

/* ── Icon ── */
function Icon({ name, size=22, color='currentColor', spin=false }) {
  const p = { fill:'none', stroke:color, strokeWidth:'1.5', strokeLinecap:'round', strokeLinejoin:'round' };
  const icons = {
    library:  [<path {...p} key="a" d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>, <path {...p} key="b" d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>],
    settings: [<circle {...p} key="a" cx="12" cy="12" r="3"/>, <path {...p} key="b" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>],
    search:   [<circle {...p} key="a" cx="11" cy="11" r="8"/>, <path {...p} key="b" d="m21 21-4.35-4.35"/>],
    chevLeft: [<polyline {...p} key="a" points="15 18 9 12 15 6"/>],
    chevRight:[<polyline {...p} key="a" points="9 18 15 12 9 6"/>],
    sync:     [<polyline {...p} key="a" points="1 4 1 10 7 10"/>, <polyline {...p} key="b" points="23 20 23 14 17 14"/>, <path {...p} key="c" d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>],
    check:    [<polyline {...p} key="a" points="20 6 9 17 4 12"/>],
    cloud:    [<path {...p} key="a" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>],
    moon:     [<path {...p} key="a" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>],
    sun:      [<circle {...p} key="a" cx="12" cy="12" r="5"/>, <line {...p} key="b" x1="12" y1="1" x2="12" y2="3"/>, <line {...p} key="c" x1="12" y1="21" x2="12" y2="23"/>, <line {...p} key="d" x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>, <line {...p} key="e" x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>, <line {...p} key="f" x1="1" y1="12" x2="3" y2="12"/>, <line {...p} key="g" x1="21" y1="12" x2="23" y2="12"/>],
    folder:   [<path {...p} key="a" d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>],
    bookOpen: [<path {...p} key="a" d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>, <path {...p} key="b" d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>],
    trash:    [<polyline {...p} key="a" points="3 6 5 6 21 6"/>, <path {...p} key="b" d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>],
    aa:       [<path {...p} key="a" d="M4 7V4h16v3"/>, <path {...p} key="b" d="M9 20h6"/>, <path {...p} key="c" d="M12 4v16"/>],
    moreV:    [<circle {...p} key="a" cx="12" cy="5" r="1" fill={color}/>, <circle {...p} key="b" cx="12" cy="12" r="1" fill={color}/>, <circle {...p} key="c" cx="12" cy="19" r="1" fill={color}/>],
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" style={spin?{animation:'spin 1.1s linear infinite',display:'block'}:{display:'block'}}>
      {icons[name]}
    </svg>
  );
}

/* ── Book cover ── */
function BookCover({ book, width=100, onClick, onLongPress }) {
  const numericWidth = typeof width === 'number' ? width : null;
  const h = numericWidth ? Math.round(numericWidth * 1.44) : undefined;
  const [pressed, setPressed] = useState(false);
  const longPressTimer = useRef(null);

  const handleTouchStart = () => {
    setPressed(true);
    if(onLongPress) longPressTimer.current = setTimeout(()=>{ onLongPress(); setPressed(false); }, 500);
  };
  const handleTouchEnd = () => {
    setPressed(false);
    if(longPressTimer.current) clearTimeout(longPressTimer.current);
  };

  return (
    <div onClick={onClick} onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}
      onMouseDown={()=>setPressed(true)} onMouseUp={()=>setPressed(false)} onMouseLeave={()=>setPressed(false)}
      style={{ width, height:h, aspectRatio: h ? undefined : '1/1.44', borderRadius:10, cursor:'pointer', position:'relative', overflow:'hidden', flexShrink:0,
        background:`linear-gradient(145deg,${book.color},${book.color2})`,
        boxShadow:'2px 4px 14px rgba(28,23,20,.28)',
        transform:pressed?'scale(0.96)':'scale(1)', transition:'transform 120ms cubic-bezier(0.25,0.1,0.25,1)',
      }}>
      <div style={{ position:'absolute',left:0,top:0,bottom:0,width:5,background:'rgba(0,0,0,.22)',borderRadius:'10px 0 0 10px' }}/>
      <div style={{ position:'absolute',inset:0,display:'flex',flexDirection:'column',justifyContent:'flex-end',padding:8 }}>
        <div style={{ fontFamily:'Lora,serif',fontSize:10,fontWeight:600,color:'rgba(255,255,255,.9)',lineHeight:1.3 }}>{book.title}</div>
        <div style={{ fontFamily:'DM Sans,sans-serif',fontSize:9,color:'rgba(255,255,255,.5)',marginTop:2 }}>{book.author}</div>
      </div>
      {book.pct>0 && <div style={{ position:'absolute',bottom:0,left:0,right:0,height:3,background:'rgba(255,255,255,.15)' }}>
        <div style={{ height:'100%',width:`${book.pct}%`,background:'rgba(255,255,255,.75)',borderRadius:'0 2px 2px 0' }}/>
      </div>}
    </div>
  );
}

/* ── Bottom Sheet ── */
function BottomSheet({ book, onClose, dark, onOpen }) {
  const bg      = dark?'#26211D':'#FFFFFF';
  const ink1    = dark?'#F0EBE1':'#1C1714';
  const ink3    = dark?'#7A7068':'#9C9089';
  const border  = dark?'rgba(255,255,255,.07)':'rgba(28,23,20,.08)';

  const Row = ({ icon, label, color, onTap }) => (
    <div onClick={()=>{ onTap?.(); onClose(); }} style={{
      display:'flex', alignItems:'center', gap:14, padding:'0 20px', height:56, cursor:'pointer',
      transition:'background 80ms',
    }}
    onMouseDown={e=>e.currentTarget.style.background=dark?'rgba(255,255,255,.04)':'rgba(28,23,20,.03)'}
    onMouseUp={e=>e.currentTarget.style.background='transparent'}
    >
      <div style={{ width:40, height:40, borderRadius:10, background:dark?'rgba(255,255,255,.06)':'#F5E8DF', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
        <Icon name={icon} size={20} color={color||'#C4622D'}/>
      </div>
      <span style={{ fontSize:15, fontWeight:500, color:color||ink1 }}>{label}</span>
    </div>
  );

  return (
    <>
      <div onClick={onClose} style={{ position:'absolute',inset:0,background:'rgba(28,23,20,.4)',zIndex:40,animation:'fadeIn 200ms' }}/>
      <div style={{
        position:'absolute',bottom:0,left:0,right:0,zIndex:50,
        background:bg, borderRadius:'20px 20px 0 0',
        boxShadow:'0 -4px 24px rgba(28,23,20,.16)',
        animation:'sheetIn 280ms cubic-bezier(0.34,1.1,0.64,1)',
        paddingBottom:32,
      }}>
        {/* Handle */}
        <div style={{ display:'flex',justifyContent:'center',padding:'12px 0 8px' }}>
          <div style={{ width:36,height:4,borderRadius:9999,background:dark?'rgba(255,255,255,.2)':'#C4B8AE' }}/>
        </div>
        {/* Book info */}
        <div style={{ padding:'4px 20px 12px', display:'flex', gap:12, alignItems:'center', borderBottom:`1px solid ${border}`, marginBottom:4 }}>
          <BookCover book={book} width={40}/>
          <div style={{ minWidth:0 }}>
            <div style={{ fontFamily:'Lora,serif',fontSize:15,fontWeight:600,color:ink1,lineHeight:1.3 }}>{book.title}</div>
            <div style={{ fontSize:13,color:ink3,marginTop:2 }}>{book.author}</div>
          </div>
        </div>
        <Row icon="bookOpen" label="继续阅读" onTap={()=>onOpen(book)}/>
        <Row icon="sync"     label="立即同步"/>
        <Row icon="trash"    label="从书库移除" color="#B53A2F"/>
      </div>
    </>
  );
}

/* ── Library Screen ── */
function LibraryScreen({ onOpen, dark }) {
  const [tab, setTab]       = useState('all');
  const [sheet, setSheet]   = useState(null);
  const bg      = dark?'#1C1814':'#F7F3EC';
  const surface = dark?'#26211D':'#FFFFFF';
  const ink1    = dark?'#F0EBE1':'#1C1714';
  const ink2    = dark?'#B8AFA6':'#5C5349';
  const ink3    = dark?'#7A7068':'#9C9089';
  const border  = dark?'rgba(255,255,255,.07)':'rgba(28,23,20,.08)';

  const tabs = [{ id:'all',label:'全部' },{ id:'reading',label:'阅读中' },{ id:'recent',label:'最近' }];
  const shown = tab==='reading' ? BOOKS.filter(b=>b.pct>0&&b.pct<100)
              : tab==='recent'  ? BOOKS.slice(0,4)
              : BOOKS;
  const inProgress = BOOKS.filter(b=>b.pct>0&&b.pct<100);

  return (
    <div style={{ flex:1,display:'flex',flexDirection:'column',background:bg,overflow:'hidden',position:'relative' }}>
      <div style={{ flex:1, overflowY:'auto' }}>
        {/* Header */}
        <div style={{ padding:'14px 20px 0',background:bg,position:'sticky',top:0,zIndex:10 }}>
          <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14 }}>
            <h1 style={{ fontFamily:'Lora,serif',fontSize:24,fontWeight:600,color:ink1 }}>书库</h1>
            <div style={{ display:'flex',gap:8 }}>
              <div style={{ width:40,height:40,borderRadius:10,background:dark?'rgba(255,255,255,.07)':surface,border:`1px solid ${border}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer' }}>
                <Icon name="search" size={18} color={ink2}/>
              </div>
            </div>
          </div>
          {/* Tabs */}
          <div style={{ display:'flex',gap:4,background:dark?'rgba(255,255,255,.05)':'#F0EBE1',borderRadius:12,padding:3,marginBottom:2 }}>
            {tabs.map(t=>(
              <div key={t.id} onClick={()=>setTab(t.id)} style={{
                flex:1,textAlign:'center',padding:'8px 0',borderRadius:10,fontSize:14,fontWeight:500,cursor:'pointer',
                background:tab===t.id?(dark?'rgba(255,255,255,.09)':surface):'transparent',
                color:tab===t.id?ink1:ink3,
                boxShadow:tab===t.id?'0 1px 3px rgba(28,23,20,.08)':'none',
                transition:'all 120ms',
              }}>{t.label}</div>
            ))}
          </div>
        </div>

        {/* Continue reading — prominent hero card */}
        {tab==='all' && inProgress.length>0 && (
          <div style={{ padding:'16px 20px 0' }}>
            <div style={{ fontSize:11,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:ink3,marginBottom:10 }}>继续阅读</div>
            <div onClick={()=>onOpen(inProgress[0])} style={{
              background:surface,borderRadius:14,padding:16,display:'flex',gap:14,alignItems:'center',
              border:`1px solid ${border}`,cursor:'pointer',boxShadow:'0 1px 6px rgba(28,23,20,.06)',
              transition:'transform 100ms',
            }}
            onMouseDown={e=>e.currentTarget.style.transform='scale(0.98)'}
            onMouseUp={e=>e.currentTarget.style.transform='scale(1)'}
            onMouseLeave={e=>e.currentTarget.style.transform='scale(1)'}
            >
              <BookCover book={inProgress[0]} width={56}/>
              <div style={{ flex:1,minWidth:0 }}>
                <div style={{ fontFamily:'Lora,serif',fontSize:16,fontWeight:600,color:ink1,lineHeight:1.3,marginBottom:2 }}>{inProgress[0].title}</div>
                <div style={{ fontSize:13,color:ink2,marginBottom:10 }}>{inProgress[0].author}</div>
                <div style={{ display:'flex',alignItems:'center',gap:8 }}>
                  <div style={{ flex:1,height:3,background:dark?'rgba(255,255,255,.12)':'#EDE8DF',borderRadius:9999,overflow:'hidden' }}>
                    <div style={{ width:`${inProgress[0].pct}%`,height:'100%',background:'#C4622D' }}/>
                  </div>
                  <span style={{ fontSize:12,color:'#C4622D',fontWeight:500,flexShrink:0 }}>{inProgress[0].pct}%</span>
                </div>
              </div>
              <Icon name="chevRight" size={18} color={ink3}/>
            </div>
          </div>
        )}

        {/* Book grid */}
        <div style={{ padding:'16px 20px 24px' }}>
          {tab==='all'&&<div style={{ fontSize:11,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:ink3,marginBottom:12 }}>全部 {BOOKS.length} 本</div>}
          <div style={{ display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14 }}>
            {shown.map(book=>(
              <div key={book.id} style={{ display:'flex',flexDirection:'column',gap:8,animation:'slideUp 200ms ease' }}>
                <BookCover book={book} width="100%" onClick={()=>onOpen(book)} onLongPress={()=>setSheet(book)}/>
                <div style={{ minWidth:0 }}>
                  <div style={{ fontFamily:'Lora,serif',fontSize:12,fontWeight:500,color:ink1,lineHeight:1.3,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical' }}>{book.title}</div>
                  <div style={{ fontSize:11,color:ink3,marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis' }}>{book.author}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Bottom sheet */}
      {sheet && <BottomSheet book={sheet} onClose={()=>setSheet(null)} dark={dark} onOpen={(b)=>{ setSheet(null); onOpen(b); }}/>}
    </div>
  );
}

/* ── Reader Screen ── */
function ReaderScreen({ book, onBack, dark, onToggleDark }) {
  const [showUI, setShowUI] = useState(true);
  const [fontSize, setFontSize] = useState(18);
  const [showSettings, setShowSettings] = useState(false);

  const bg        = dark?'#1C1814':'#F7F3EC';
  const textColor = dark?'#E8D9BC':'#1C1714';
  const toolbarBg = dark?'rgba(26,22,18,.94)':'rgba(247,243,236,.94)';
  const border    = dark?'rgba(255,255,255,.07)':'rgba(28,23,20,.07)';
  const ink3      = dark?'#7A7068':'#9C9089';
  const surface   = dark?'#26211D':'#FFFFFF';

  const prose = [
    `Of course the end of the world was not the world's end but only that of our little world of books and scholars and proud abbots. Still it was the world we knew, and losing it left us mute.`,
    `Brother William walked ahead, his long shadow crossing the scriptorium floor. I followed, clutching my notebook. The smell of tallow candles and old vellum surrounded us like centuries of fog.`,
    `In that moment I understood: the library was not merely a place of books. It was a mind — ancient, vast, and fiercely guarded. To enter without guidance was to be lost, perhaps forever.`,
  ];

  return (
    <div style={{ flex:1,position:'relative',background:bg,display:'flex',flexDirection:'column',overflow:'hidden' }}>
      {/* Tap zones — invisible but clickable thirds */}
      <div style={{ position:'absolute',inset:0,zIndex:1,display:'flex' }}>
        <div style={{ flex:1 }} onClick={()=>setShowUI(v=>!v)}/>
        <div style={{ flex:1 }} onClick={()=>setShowUI(v=>!v)}/>
        <div style={{ flex:1 }} onClick={()=>setShowUI(v=>!v)}/>
      </div>

      {/* Top bar */}
      <div style={{
        position:'absolute',top:0,left:0,right:0,zIndex:20,
        background:toolbarBg,backdropFilter:'blur(12px)',borderBottom:`1px solid ${border}`,
        height:52,display:'flex',alignItems:'center',padding:'0 16px',gap:10,
        transform:showUI?'translateY(0)':'translateY(-100%)',transition:'transform 220ms cubic-bezier(0.25,0.1,0.25,1)',
      }}>
        <div onClick={onBack} style={{ width:40,height:40,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',borderRadius:10,flexShrink:0 }}>
          <Icon name="chevLeft" size={22} color={dark?'#B8AFA6':'#5C5349'}/>
        </div>
        <span style={{ flex:1,textAlign:'center',fontFamily:'Lora,serif',fontSize:15,fontWeight:500,color:dark?'#F0EBE1':'#1C1714',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap' }}>{book.title}</span>
        <div onClick={e=>{e.stopPropagation();setShowSettings(v=>!v);}} style={{ width:40,height:40,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',borderRadius:10,flexShrink:0 }}>
          <Icon name="aa" size={20} color={dark?'#B8AFA6':'#9C9089'}/>
        </div>
      </div>

      {/* Font-size settings panel */}
      {showSettings && (
        <div style={{
          position:'absolute',top:56,right:12,zIndex:30,background:surface,
          border:`1px solid ${border}`,borderRadius:14,padding:14,width:200,
          boxShadow:'0 4px 20px rgba(28,23,20,.18)',animation:'slideUp 150ms ease',
        }} onClick={e=>e.stopPropagation()}>
          <div style={{ fontSize:12,fontWeight:600,color:ink3,marginBottom:10,letterSpacing:'0.06em',textTransform:'uppercase' }}>字号</div>
          <div style={{ display:'flex',alignItems:'center',gap:10 }}>
            <div onClick={()=>setFontSize(s=>Math.max(14,s-1))} style={{ width:36,height:36,border:`1px solid ${border}`,borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:18,color:dark?'#F0EBE1':'#1C1714' }}>−</div>
            <div style={{ flex:1,textAlign:'center',fontSize:15,fontWeight:500,color:dark?'#F0EBE1':'#1C1714' }}>{fontSize}px</div>
            <div onClick={()=>setFontSize(s=>Math.min(26,s+1))} style={{ width:36,height:36,border:`1px solid ${border}`,borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:18,color:dark?'#F0EBE1':'#1C1714' }}>+</div>
          </div>
          <div style={{ height:1,background:border,margin:'12px 0 10px' }}/>
          <div onClick={onToggleDark} style={{ display:'flex',alignItems:'center',gap:8,padding:'6px 2px',cursor:'pointer' }}>
            <Icon name={dark?'sun':'moon'} size={16} color={ink3}/>
            <span style={{ fontSize:13,color:dark?'#F0EBE1':'#1C1714' }}>{dark?'日间模式':'夜间模式'}</span>
          </div>
        </div>
      )}

      {/* Reading content */}
      <div style={{ flex:1,overflowY:'auto',padding:'68px 0 76px',zIndex:0 }}>
        <div style={{ maxWidth:390,margin:'0 auto',padding:'0 24px' }}>
          <div style={{ fontFamily:'DM Sans,sans-serif',fontSize:11,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:ink3,marginBottom:10 }}>Chapter III</div>
          <h2 style={{ fontFamily:'Lora,serif',fontSize:20,fontWeight:600,color:textColor,marginBottom:22,lineHeight:1.35 }}>In Which the Labyrinth Is Entered</h2>
          {prose.map((para,i)=>(
            <p key={i} style={{ fontFamily:'Merriweather,serif',fontSize:fontSize,lineHeight:1.9,color:textColor,marginBottom:22 }}>{para}</p>
          ))}
        </div>
      </div>

      {/* Bottom bar */}
      <div style={{
        position:'absolute',bottom:0,left:0,right:0,zIndex:20,
        background:toolbarBg,backdropFilter:'blur(12px)',borderTop:`1px solid ${border}`,
        padding:'10px 20px 20px',display:'flex',alignItems:'center',gap:14,
        transform:showUI?'translateY(0)':'translateY(100%)',transition:'transform 220ms cubic-bezier(0.25,0.1,0.25,1)',
      }}>
        <div style={{ flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4 }}>
          <div style={{ width:'100%',height:3,background:dark?'rgba(255,255,255,.1)':'#EDE8DF',borderRadius:9999,overflow:'hidden' }}>
            <div style={{ width:`${book.pct||12}%`,height:'100%',background:'#C4622D' }}/>
          </div>
          <div style={{ fontSize:11,color:ink3 }}>第 234 页 · {book.pct||12}% · 点击任意处切换</div>
        </div>
      </div>
    </div>
  );
}

/* ── Settings Screen ── */
function SettingsScreen({ dark, onToggleDark }) {
  const bg      = dark?'#1C1814':'#F7F3EC';
  const surface = dark?'#26211D':'#FFFFFF';
  const ink1    = dark?'#F0EBE1':'#1C1714';
  const ink2    = dark?'#B8AFA6':'#5C5349';
  const ink3    = dark?'#7A7068':'#9C9089';
  const border  = dark?'rgba(255,255,255,.07)':'rgba(28,23,20,.08)';

  const [autoSync, setAutoSync] = useState(true);

  const Toggle = ({ on, onToggle }) => (
    <div onClick={onToggle} style={{ width:48,height:28,borderRadius:14,position:'relative',cursor:'pointer',background:on?'#C4622D':'#C4B8AE',transition:'background 200ms',flexShrink:0 }}>
      <div style={{ position:'absolute',top:3,left:on?21:3,width:22,height:22,background:'white',borderRadius:'50%',boxShadow:'0 1px 4px rgba(0,0,0,.2)',transition:'left 200ms cubic-bezier(0.34,1.2,0.64,1)' }}/>
    </div>
  );

  const Section = ({ title, children }) => (
    <div style={{ marginBottom:22 }}>
      <div style={{ fontSize:12,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:ink3,padding:'0 20px',marginBottom:6 }}>{title}</div>
      <div style={{ background:surface,border:`1px solid ${border}`,borderRadius:14,overflow:'hidden',margin:'0 16px' }}>
        {children}
      </div>
    </div>
  );

  const Row = ({ icon, label, value, onTap, toggle, onToggle }) => (
    <div onClick={onTap} style={{ display:'flex',alignItems:'center',gap:14,padding:'0 16px',height:56,cursor:onTap?'pointer':'default',
      transition:'background 80ms',borderBottom:`1px solid ${border}` }}
      onMouseDown={e=>{ if(onTap) e.currentTarget.style.background=dark?'rgba(255,255,255,.03)':'rgba(28,23,20,.03)'; }}
      onMouseUp={e=>e.currentTarget.style.background='transparent'}
    >
      <div style={{ width:34,height:34,borderRadius:9,background:'#F5E8DF',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0 }}>
        <Icon name={icon} size={18} color="#C4622D"/>
      </div>
      <span style={{ flex:1,fontSize:15,color:ink1 }}>{label}</span>
      {value && <span style={{ fontSize:13,color:ink3 }}>{value}</span>}
      {toggle!==undefined && <Toggle on={toggle} onToggle={onToggle}/>}
      {onTap && !toggle && <Icon name="chevRight" size={16} color={ink3}/>}
    </div>
  );

  return (
    <div style={{ flex:1,background:bg,overflowY:'auto' }}>
      <div style={{ padding:'16px 20px 18px' }}>
        <h1 style={{ fontFamily:'Lora,serif',fontSize:24,fontWeight:600,color:ink1 }}>设置</h1>
      </div>
      <Section title="书库">
        <Row icon="folder"  label="Calibre 书库路径" value="/Library/Calibre" onTap={()=>{}}/>
        <Row icon="sync"    label="同步状态"          value="已同步"/>
      </Section>
      <Section title="同步">
        <Row icon="cloud"   label="同步目标"   value="WebDAV" onTap={()=>{}}/>
        <Row icon="sync"    label="自动同步"   toggle={autoSync} onToggle={()=>setAutoSync(v=>!v)}/>
      </Section>
      <Section title="外观">
        <Row icon={dark?'sun':'moon'} label={dark?'切换到日间':'切换到夜间'} onTap={onToggleDark}/>
        <Row icon="aa"      label="字体大小"   value="标准"  onTap={()=>{}}/>
      </Section>
      <div style={{ padding:'0 20px 32px',textAlign:'center' }}>
        <div style={{ fontSize:12,color:ink3 }}>MyReader MVP · iPhone · 已连接设备：MacBook Pro</div>
      </div>
    </div>
  );
}

/* ── Tab Bar ── */
function TabBar({ tab, onTab, dark }) {
  const bg    = dark?'rgba(26,22,18,.96)':'rgba(247,243,236,.96)';
  const ink3  = dark?'#7A7068':'#9C9089';
  const tabs  = [{ id:'library',icon:'library',label:'书库' },{ id:'settings',icon:'settings',label:'设置' }];
  return (
    <div style={{ background:bg,backdropFilter:'blur(12px)',borderTop:dark?'1px solid rgba(255,255,255,.07)':'1px solid rgba(28,23,20,.08)',display:'flex',paddingBottom:20,flexShrink:0 }}>
      {tabs.map(t=>(
        <div key={t.id} onClick={()=>onTab(t.id)} style={{
          flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'10px 0',cursor:'pointer',
          color:tab===t.id?'#C4622D':ink3,transition:'color 100ms',
        }}>
          <Icon name={t.icon} size={24} color={tab===t.id?'#C4622D':ink3}/>
          <span style={{ fontSize:11,fontWeight:tab===t.id?500:400 }}>{t.label}</span>
        </div>
      ))}
    </div>
  );
}

/* ── App ── */
function App() {
  const saved   = JSON.parse(localStorage.getItem('mr_mb_v2')||'{}');
  const [tab,     setTab]   = useState(saved.tab  ||'library');
  const [reading, setRead]  = useState(null);
  const [dark,    setDark]  = useState(saved.dark ||false);

  useEffect(()=>{ localStorage.setItem('mr_mb_v2',JSON.stringify({tab,dark})); },[tab,dark]);

  return (
    <IosFrame dark={dark}>
      <div style={{ display:'flex',flexDirection:'column',height:'100%',overflow:'hidden' }}>
        {reading ? (
          <ReaderScreen book={reading} onBack={()=>setRead(null)} dark={dark} onToggleDark={()=>setDark(v=>!v)}/>
        ) : (
          <>
            {tab==='library'  && <LibraryScreen  onOpen={b=>{setRead(b);}} dark={dark}/>}
            {tab==='settings' && <SettingsScreen dark={dark} onToggleDark={()=>setDark(v=>!v)}/>}
            <TabBar tab={tab} onTab={t=>{setTab(t);setRead(null);}} dark={dark}/>
          </>
        )}
      </div>
    </IosFrame>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
