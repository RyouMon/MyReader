appId: ${APP_ID}
name: Import a prepared local fixture through the system picker
---
- runFlow:
    when:
      platform: iOS
    file: select_ios_e2e_fixture.yaml
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Show roots|显示根目录"
          timeout: 15000
      - tapOn: "Show roots|显示根目录"
      # The disabled breadcrumb behind the drawer has the same device name.
      - tapOn:
          text: ${ANDROID_STORAGE_LABEL}
          id: "android:id/title"
      - waitForAnimationToEnd
      # Folder rows and the previous location's breadcrumbs can share text.
      - tapOn:
          text: "Download"
          id: "android:id/title"
      - waitForAnimationToEnd
      - tapOn:
          text: ${E2E_ROOT_FOLDER}
          id: "android:id/title"
      - waitForAnimationToEnd
      - tapOn:
          text: "Fixtures"
          id: "android:id/title"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: ${IMPORT_FILE_NAME}
          timeout: 30000
      - tapOn: ${IMPORT_FILE_NAME}
      - runFlow:
          when:
            visible: "^Select$|^选择$"
          commands:
            - tapOn: "^Select$|^选择$"
