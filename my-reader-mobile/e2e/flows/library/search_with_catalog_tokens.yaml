appId: ${APP_ID}
name: Search plain text and add catalog tokens only by selecting suggestions
tags:
  - library
  - external-library
---
# Prerequisite: import e2e/.artifacts/MyReader-TTS.epub into the active test library.
- runFlow: ../../common/launch_preserving_data.yaml
- openLink: myreadermobile://library/catalog
- assertVisible: MyReader TTS E2E
- assertVisible: 搜索|Search
- assertNotVisible: 搜索书名、作者、标签、丛书…|Search titles, authors, tags, series…
- takeScreenshot: catalog-search-closed
- tapOn: 搜索|Search
- assertVisible: 搜索书名、作者、标签、丛书…|Search titles, authors, tags, series…
- assertNotVisible: 作者, MyReader|Authors, MyReader
- tapOn: 搜索书名、作者、标签、丛书…|Search titles, authors, tags, series…
- takeScreenshot: catalog-search-empty
- inputText: MyReader
- assertVisible: 作者, MyReader|Authors, MyReader
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: Continue|继续
          commands:
            - tapOn: Continue|继续
      - tapOn:
          id: Search
      - assertVisible:
          id: catalog-native-token-input
          text: MyReader
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: 搜索|Search
      - assertVisible: MyReader
- assertNotVisible: 作者, MyReader|Authors, MyReader
- assertNotVisible: '作者: MyReader|Authors: MyReader'
- takeScreenshot: catalog-search-plain-text
- tapOn: 搜索书名、作者、标签、丛书…|Search titles, authors, tags, series…
- assertVisible: 作者, MyReader|Authors, MyReader
- eraseText: 7
- assertVisible: 作者, MyReader|Authors, MyReader
- takeScreenshot: catalog-search-suggestions
- inputText: z
- assertVisible: 搜索无结果|No search results
- assertVisible: 搜索书名、作者、标签、丛书…|Search titles, authors, tags, series…
- assertNotVisible: 作者, MyReader|Authors, MyReader
- takeScreenshot: catalog-search-no-results
- eraseText: 1
- assertVisible: 作者, MyReader|Authors, MyReader
- assertVisible: MyReader TTS E2E
- eraseText: 1
- assertNotVisible: 作者, MyReader|Authors, MyReader
- inputText: M
- tapOn: 作者, MyReader|Authors, MyReader
- assertNotVisible: 同时满足所有条件|Match all conditions
- assertNotVisible: 作者, MyReader|Authors, MyReader
- takeScreenshot: catalog-search-token
- tapOn: 关闭|Close
- assertNotVisible: 搜索书名、作者、标签、丛书…|Search titles, authors, tags, series…
- assertVisible: MyReader TTS E2E
- tapOn: 搜索|Search
- assertNotVisible: 同时满足所有条件|Match all conditions
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: '作者: MyReader|Authors: MyReader'
      - tapOn: '作者: MyReader|Authors: MyReader'
      - assertNotVisible: 取消|Cancel
      - assertNotVisible: 作者, MyReader|Authors, MyReader
      - assertVisible: '作者: MyReader|Authors: MyReader'
      - tapOn: 移除 MyReader|Remove MyReader
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: catalog-native-token-input
      - eraseText: 2
- assertNotVisible: 同时满足所有条件|Match all conditions
- assertNotVisible: 作者, MyReader|Authors, MyReader
- takeScreenshot: catalog-search-token-removed
- tapOn: 关闭|Close
- assertVisible: MyReader TTS E2E
