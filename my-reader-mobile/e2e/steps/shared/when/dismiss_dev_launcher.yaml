appId: ${APP_ID}
name: Dismiss dev launcher (dev builds only)
---
# In dev builds, the Expo Dev Launcher may appear if no dev server is running.
# This step is a no-op in release builds (element not found = condition not met).
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - assertNotVisible: "No development servers found"
      - tapOn: "Forward"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - scrollUntilVisible:
          element: "Tools button"
      - tapOn: "1"
      - tapOn: "Close"
