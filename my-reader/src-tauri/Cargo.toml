[package]
name = "my-reader"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "my_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-mcp-bridge = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = { version = "2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = { version = "0.0.12", features = ["serde"] }
tauri-specta = { version = "2.0.0-rc.25", features = ["typescript"] }
sea-orm.workspace = true
sea-orm-migration.workspace = true
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }
thiserror = "1"
base64 = "0.22"
log = "0.4"
myreader-core.workspace = true
tauri-plugin-log = "2"
tracing = "0.1"
time = { version = "0.3", features = ["macros", "formatting", "parsing"] }
zip = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
opendal = { version = "0.50", default-features = false, features = ["services-webdav", "services-fs", "services-onedrive"] }
oauth2 = "4"
open = "5"
url = "2"
blake3 = "1"
async-trait = "0.1"
automerge = "=0.10.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
notify = "7"
futures = "0.3"
warp = "0.3"
portpicker = "0.1"
dunce = "1"
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }

[dev-dependencies]
myreader-core = { workspace = true, features = ["test-support"] }
bytes = "1"
tempfile = "3"
tauri = { version = "2", features = ["test"] }
uuid = { version = "1", features = ["v4"] }
