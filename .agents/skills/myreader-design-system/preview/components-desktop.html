<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font-ui); background:var(--bg); padding:20px; }
.platform-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; background:#F0EBE1; color:#5C5349; margin-bottom:12px; }
.section-label { font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#9C9089; margin:14px 0 8px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

/* Buttons */
.btn { display:inline-flex; align-items:center; gap:6px; border:none; cursor:pointer; font-family:var(--font-ui); font-weight:500; transition:all 120ms; }
.btn-p { background:#C4622D; color:#fff; height:32px; padding:0 14px; border-radius:6px; font-size:13px; }
.btn-p:hover { background:#B05523; }
.btn-s { background:#fff; color:#1C1714; height:32px; padding:0 14px; border-radius:6px; font-size:13px; border:1px solid rgba(28,23,20,.16); }
.btn-s:hover { background:#F5F1EA; }
.btn-g { background:transparent; color:#5C5349; height:32px; padding:0 14px; border-radius:6px; font-size:13px; }
.btn-g:hover { background:#F0EBE1; }

/* Nav sidebar row */
.nav-row { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:7px; font-size:13px; cursor:pointer; }
.nav-row.active { background:#F5E8DF; color:#C4622D; border-left:3px solid #C4622D; }
.nav-row.inactive { color:#5C5349; border-left:3px solid transparent; }
.nav-row.inactive:hover { background:#F0EBE1; }

/* Kbd shortcut */
.kbd { display:inline-flex; align-items:center; justify-content:center; height:18px; min-width:18px; padding:0 4px; background:#F0EBE1; border:1px solid rgba(28,23,20,.14); border-radius:3px; font-size:10px; font-family:var(--font-mono); color:#5C5349; }

/* Tooltip */
.tooltip { background:#1C1714; color:#FAF6F0; font-size:11px; padding:4px 8px; border-radius:5px; white-space:nowrap; }

/* Context menu */
.ctxmenu { background:#fff; border:1px solid rgba(28,23,20,.1); border-radius:8px; box-shadow:0 4px 16px rgba(28,23,20,.12); padding:4px; width:160px; }
.ctx-item { padding:6px 10px; font-size:12px; border-radius:5px; cursor:pointer; color:#1C1714; display:flex; align-items:center; gap:8px; }
.ctx-item:hover { background:#F0EBE1; }
.ctx-item.danger { color:#B53A2F; }
.ctx-item.danger:hover { background:#F5E2E0; }
.ctx-div { height:1px; background:rgba(28,23,20,.07); margin:3px 4px; }
</style>
</head>
<body>
  <div class="platform-badge">🖥 Desktop</div>

  <div class="section-label">Button Scale (compact · hover-driven)</div>
  <div class="row" style="margin-bottom:12px">
    <button class="btn btn-p">继续阅读</button>
    <button class="btn btn-s">打开书库</button>
    <button class="btn btn-g">取消</button>
    <button class="btn btn-p" style="height:26px;font-size:12px;padding:0 10px;border-radius:5px">同步</button>
    <button class="btn btn-s" style="opacity:.4;cursor:not-allowed">禁用</button>
  </div>

  <div class="section-label">Sidebar Navigation (hover + keyboard shortcut)</div>
  <div style="width:200px;background:#F0EBE1;border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:2px">
    <div class="nav-row active">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      书库
      <span style="margin-left:auto"><span class="kbd">⌘</span><span class="kbd">1</span></span>
    </div>
    <div class="nav-row inactive">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06"/></svg>
      设置
      <span style="margin-left:auto"><span class="kbd">⌘</span><span class="kbd">,</span></span>
    </div>
  </div>

  <div class="section-label">Tooltip + Context Menu</div>
  <div class="row" style="align-items:flex-start;gap:20px">
    <div class="tooltip">上次同步：2 分钟前</div>
    <div class="ctxmenu">
      <div class="ctx-item">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        继续阅读
      </div>
      <div class="ctx-item">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
        立即同步
      </div>
      <div class="ctx-div"></div>
      <div class="ctx-item danger">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        从书库移除
      </div>
    </div>
  </div>
</body>
</html>
