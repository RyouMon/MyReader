<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font-ui); background:var(--bg); padding:20px; display:flex; flex-direction:column; gap:14px; }
.section-label { font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-3); margin-bottom:6px; }
.field-row { display:flex; flex-direction:column; gap:4px; max-width:340px; }
.field { display:flex; align-items:center; gap:8px; padding:9px 12px; background:var(--surface); border:1px solid rgba(28,23,20,.14); border-radius:8px; font-size:13px; color:var(--ink-1); }
.field.focused { border-color:#C4622D; box-shadow:0 0 0 3px rgba(196,98,45,.12); }
.field-label { font-size:11px; color:var(--ink-3); font-weight:500; }
.field input { border:none; background:transparent; font:inherit; color:inherit; outline:none; flex:1; }
.field input::placeholder { color:var(--ink-4,#C4B8AE); }

/* Toggle */
.toggle-row { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--surface); border:var(--border); border-radius:8px; max-width:340px; }
.toggle-label { font-size:13px; color:var(--ink-1); }
.toggle { width:44px; height:26px; border-radius:13px; position:relative; cursor:pointer; transition:background 200ms; }
.toggle-on  { background:#C4622D; }
.toggle-off { background:#C4B8AE; }
.toggle-thumb { position:absolute; top:3px; width:20px; height:20px; background:white; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:left 200ms cubic-bezier(0.34,1.56,0.64,1); }
.toggle-on  .toggle-thumb { left:21px; }
.toggle-off .toggle-thumb { left:3px; }

/* Select */
.select { appearance:none; border:1px solid rgba(28,23,20,.14); background:var(--surface); border-radius:8px; padding:9px 32px 9px 12px; font-family:var(--font-ui); font-size:13px; color:var(--ink-1); cursor:pointer; outline:none; width:200px; }
.select:focus { border-color:#C4622D; box-shadow:0 0 0 3px rgba(196,98,45,.12); }
</style>
</head>
<body>
  <div>
    <div class="section-label">Text Inputs</div>
    <div class="field-row">
      <div class="field-label">WebDAV 地址</div>
      <div class="field">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9C9089" stroke-width="1.5" stroke-linecap="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
        <input placeholder="https://dav.example.com/books" />
      </div>
      <div class="field-label">路径</div>
      <div class="field focused">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C4622D" stroke-width="1.5" stroke-linecap="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <input value="/Library/Calibre" style="color:#1C1714" />
      </div>
    </div>
  </div>

  <div>
    <div class="section-label">Toggle Switches</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div class="toggle-row">
        <span class="toggle-label">夜间模式</span>
        <div class="toggle toggle-off"><div class="toggle-thumb"></div></div>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">自动同步</span>
        <div class="toggle toggle-on"><div class="toggle-thumb"></div></div>
      </div>
    </div>
  </div>

  <div>
    <div class="section-label">Select</div>
    <select class="select">
      <option>Merriweather（衬线）</option>
      <option>DM Sans（无衬线）</option>
      <option>系统默认</option>
    </select>
  </div>
</body>
</html>
