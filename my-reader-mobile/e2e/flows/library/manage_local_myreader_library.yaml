appId: ${APP_ID}
name: Create and reopen a library in an authorized iOS directory
---
# Required env:
#   E2E_ROOT_FOLDER, LOCAL_LIBRARY_NAME, LOCAL_IMPORT_FILE_NAME,
#   LOCAL_BOOK_TITLE.
- runFlow: ../../common/launch_and_prepare.yaml
- assertVisible:
    id: home-screen

# Scenario: create an empty library in an iOS user-selected directory.
- tapOn:
    id: "tab-settings"
- runFlow: ../../common/open_add_library.yaml
- tapOn:
    id: "add-library-create"
- tapOn:
    id: "add-library-local-storage"
- runFlow:
    file: ../../common/select_ios_local_library_parent.yaml
    env:
      E2E_ROOT_FOLDER: ${E2E_ROOT_FOLDER}
- tapOn:
    id: "new-library-name"
- eraseText
- inputText: ${LOCAL_LIBRARY_NAME}
- tapOn: "^创建$|^Create$"
- extendedWaitUntil:
    visible: "成功添加书库：${LOCAL_LIBRARY_NAME}|Library added: ${LOCAL_LIBRARY_NAME}"
    timeout: 30000
- tapOn: "切换并打开|Switch and Open"
- tapOn:
    id: library-collection-all
- assertVisible: "书库为空|Library is empty"
- assertVisible: "请先导入一本图书。|Import a book to get started."

# Scenario: import a supported file and open it immediately.
- tapOn: "导入图书|Import Book"
- runFlow:
    file: ../../common/select_ios_e2e_fixture.yaml
    env:
      E2E_ROOT_FOLDER: ${E2E_ROOT_FOLDER}
      IMPORT_FILE_NAME: ${LOCAL_IMPORT_FILE_NAME}
- extendedWaitUntil:
    visible: ${LOCAL_BOOK_TITLE}
    timeout: 30000
- tapOn: '打开《${LOCAL_BOOK_TITLE}》|Open "${LOCAL_BOOK_TITLE}"'
- extendedWaitUntil:
    visible:
      id: "reader-screen"
    timeout: 30000
- runFlow: ../../common/close_reader.yaml

# Scenario: directory access and the imported book survive a process restart.
- runFlow: ../../common/launch_preserving_data.yaml
- tapOn:
    id: "tab-settings"
- runFlow:
    file: ../../common/activate_library.yaml
    env:
      LIBRARY_NAME: ${LOCAL_LIBRARY_NAME}
- assertVisible: ${LOCAL_BOOK_TITLE}
- tapOn: '打开《${LOCAL_BOOK_TITLE}》|Open "${LOCAL_BOOK_TITLE}"'
- extendedWaitUntil:
    visible:
      id: "reader-screen"
    timeout: 30000
- runFlow: ../../common/close_reader.yaml
