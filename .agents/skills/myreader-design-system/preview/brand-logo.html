<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-ui); background: var(--bg); padding: 20px; }
.logo-row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; padding-bottom: 20px; border-bottom: var(--border); }
.logo-bg { padding: 16px 24px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; }
.mark { display: flex; align-items: center; gap: 8px; }
.mark-icon { width: 32px; height: 32px; }
.mark-word { font-family: 'Lora',serif; font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
.icon-only { width: 44px; height: 44px; background: #C4622D; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
  <div class="logo-row">
    <!-- Light bg -->
    <div class="logo-bg" style="background:#F7F3EC;border:1px solid #E8E2D8">
      <img src="../assets/logo.svg" height="36" alt="MyReader">
    </div>
    <!-- White bg -->
    <div class="logo-bg" style="background:#fff;border:1px solid #E8E2D8">
      <img src="../assets/logo.svg" height="36" alt="MyReader">
    </div>
    <!-- Dark bg -->
    <div class="logo-bg" style="background:#1C1814">
      <img src="../assets/logo-dark.svg" height="36" alt="MyReader">
    </div>
    <!-- Accent bg -->
    <div class="logo-bg" style="background:#C4622D">
      <div class="mark">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="1" y="3" width="14" height="22" rx="2" fill="rgba(255,255,255,0.3)"/>
          <rect x="3" y="3" width="12" height="22" rx="2" fill="rgba(255,255,255,0.6)"/>
          <line x1="8" y1="3" x2="8" y2="25" stroke="rgba(196,98,45,0.6)" stroke-width="1"/>
          <rect x="5" y="9" width="7" height="1" rx="0.5" fill="rgba(196,98,45,0.5)"/>
          <rect x="5" y="12" width="6" height="1" rx="0.5" fill="rgba(196,98,45,0.5)"/>
        </svg>
        <span style="font-family:'Lora',serif;font-size:20px;font-weight:600;color:white">MyReader</span>
      </div>
    </div>
  </div>

  <!-- Icon-only app icon -->
  <div style="display:flex;gap:12px;align-items:flex-end">
    <div class="icon-only" style="width:64px;height:64px;border-radius:14px">
      <svg width="36" height="36" viewBox="0 0 28 28" fill="none">
        <rect x="2" y="2" width="14" height="22" rx="2" fill="rgba(255,255,255,0.25)"/>
        <rect x="5" y="2" width="12" height="22" rx="2" fill="rgba(255,255,255,0.7)"/>
        <line x1="10" y1="2" x2="10" y2="24" stroke="#C4622D" stroke-width="1.2"/>
        <rect x="6.5" y="8" width="7" height="1.2" rx="0.6" fill="rgba(255,255,255,0.55)"/>
        <rect x="6.5" y="11.5" width="5.5" height="1.2" rx="0.6" fill="rgba(255,255,255,0.55)"/>
        <rect x="6.5" y="15" width="6.5" height="1.2" rx="0.6" fill="rgba(255,255,255,0.55)"/>
      </svg>
    </div>
    <div class="icon-only" style="width:44px;height:44px;border-radius:10px">
      <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
        <rect x="2" y="2" width="14" height="22" rx="2" fill="rgba(255,255,255,0.25)"/>
        <rect x="5" y="2" width="12" height="22" rx="2" fill="rgba(255,255,255,0.7)"/>
        <line x1="10" y1="2" x2="10" y2="24" stroke="#C4622D" stroke-width="1.2"/>
        <rect x="6.5" y="8" width="7" height="1.2" rx="0.6" fill="rgba(255,255,255,0.55)"/>
        <rect x="6.5" y="11.5" width="5.5" height="1.2" rx="0.6" fill="rgba(255,255,255,0.55)"/>
      </svg>
    </div>
    <div class="icon-only" style="width:32px;height:32px;border-radius:8px">
      <svg width="18" height="18" viewBox="0 0 28 28" fill="none">
        <rect x="5" y="2" width="12" height="22" rx="2" fill="rgba(255,255,255,0.7)"/>
        <line x1="10" y1="2" x2="10" y2="24" stroke="#C4622D" stroke-width="1.5"/>
      </svg>
    </div>
  </div>
</body>
</html>
