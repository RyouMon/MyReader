appId: ${APP_ID}
name: read_book
tags:
  - reader
---
# 统一 setup：启动应用、注入 fixture、打开第一本书进入阅读器
- runFlow: ../../common/launch_and_prepare.yaml
- runFlow: ../../common/open_reader.yaml
- runScript: ../../scripts/selectors.js

# Scenario: 沉浸阅读时点击内容显示 chrome
- assertNotVisible: ${output.selectors.reader.moreActions}
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: ${output.selectors.reader.moreActions}

# Scenario: 再次点击内容隐藏 chrome
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: ${output.selectors.reader.moreActions}

# Scenario: 点击更多操作展开目录与设置入口
- tapOn:
    point: "50%,50%"
- assertVisible: ${output.selectors.reader.moreActions}
- tapOn: ${output.selectors.reader.moreActions}
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: ${output.selectors.reader.tocButton}
- assertVisible: ${output.selectors.reader.settingsButton}

# Scenario: 点击目录打开目录面板，点击内容区域外关闭后回到 chrome
- tapOn: ${output.selectors.reader.tocButton}
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: ${output.selectors.reader.tocSheet}
- tapOn:
    point: "50%,20%"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: ${output.selectors.reader.tocSheet}
- assertVisible: ${output.selectors.reader.moreActions}
- assertNotVisible: ${output.selectors.reader.tocButton}

# Scenario: 点击设置打开设置面板，点击内容区域外关闭后回到 chrome
- tapOn: ${output.selectors.reader.moreActions}
- assertVisible: ${output.selectors.reader.settingsButton}
- tapOn: ${output.selectors.reader.settingsButton}
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: ${output.selectors.reader.settingsSheet}
- tapOn:
    point: "50%,20%"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: ${output.selectors.reader.settingsSheet}
- assertVisible: ${output.selectors.reader.moreActions}
- assertNotVisible: ${output.selectors.reader.settingsButton}

# Scenario: 隐藏 chrome 后向右下方轻扫翻到下一页
# EPUB reflow 的屏幕边缘 tap 容易触发超链接或失效；在底部安全区域做水平
# 滑动来翻页更稳定。
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: ${output.selectors.reader.moreActions}
- assertVisible: "1 / 898"
- swipe:
    start: "80%,90%"
    end: "20%,90%"
- extendedWaitUntil:
    visible: "2 / 898"
    timeout: 10000
- assertNotVisible: ${output.selectors.reader.moreActions}

# Scenario: 向左下方轻扫翻回上一页
- swipe:
    start: "20%,90%"
    end: "80%,90%"
- extendedWaitUntil:
    visible: "1 / 898"
    timeout: 10000
- assertNotVisible: ${output.selectors.reader.moreActions}
