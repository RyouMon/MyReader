appId: ${APP_ID}
name: Launch app without clearing libraries or credentials
---
# Remote-library flows must preserve the configured WebDAV and OneDrive
# credentials. Never replace this with launchApp.clearState.
- stopApp
- launchApp:
    permissions: {}
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
