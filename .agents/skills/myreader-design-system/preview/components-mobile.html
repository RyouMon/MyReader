<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font-ui); background:var(--bg); padding:20px; }
.platform-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; background:#F5E8DF; color:#C4622D; margin-bottom:12px; }
.section-label { font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#9C9089; margin:14px 0 8px; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.size-label { font-size:9px; color:var(--ink-3); text-align:center; margin-top:5px; font-family:var(--font-mono); }

/* Full-bleed mobile button */
.mb-btn-full { width:100%; height:48px; border-radius:10px; background:#C4622D; color:white; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:500; cursor:pointer; }
.mb-btn-sec  { width:100%; height:48px; border-radius:10px; background:#fff; color:#1C1714; display:flex; align-items:center; justify-content:center; font-size:15px; border:1px solid rgba(28,23,20,.14); cursor:pointer; }

/* Bottom sheet handle */
.bottom-sheet { background:#fff; border-radius:20px 20px 0 0; padding:12px 16px 20px; width:280px; box-shadow:0 -4px 20px rgba(28,23,20,.12); }
.sheet-handle { width:36px; height:4px; background:#C4B8AE; border-radius:9999px; margin:0 auto 14px; }
.sheet-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid rgba(28,23,20,.07); cursor:pointer; }
.sheet-row:last-child { border-bottom:none; }
.sheet-icon { width:36px; height:36px; background:#F5E8DF; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

/* Tab bar */
.tab-bar { background:rgba(247,243,236,.95); border-top:1px solid rgba(28,23,20,.08); display:flex; width:280px; padding-bottom:16px; }
.tab-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 0; cursor:pointer; }
.tab-item.active { color:#C4622D; }
.tab-item.inactive { color:#9C9089; }
</style>
</head>
<body>
  <div class="platform-badge">📱 Mobile</div>

  <div class="section-label">Buttons (full-width · 48px touch target)</div>
  <div style="width:260px;display:flex;flex-direction:column;gap:8px">
    <div class="mb-btn-full">继续阅读</div>
    <div class="mb-btn-sec">打开书库</div>
  </div>

  <div class="section-label">Bottom Sheet (swipe up gesture)</div>
  <div class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div style="font-family:'Lora',serif;font-size:15px;font-weight:600;color:#1C1714;margin-bottom:6px">The Name of the Rose</div>
    <div class="sheet-row">
      <div class="sheet-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4622D" stroke-width="1.5" stroke-linecap="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div>
      <span style="font-size:14px;color:#1C1714">继续阅读</span>
    </div>
    <div class="sheet-row">
      <div class="sheet-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4622D" stroke-width="1.5" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg></div>
      <span style="font-size:14px;color:#1C1714">立即同步</span>
    </div>
    <div class="sheet-row">
      <div class="sheet-icon" style="background:#F5E2E0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B53A2F" stroke-width="1.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></div>
      <span style="font-size:14px;color:#B53A2F">从书库移除</span>
    </div>
  </div>

  <div class="section-label">Tab Bar (bottom navigation)</div>
  <div class="tab-bar">
    <div class="tab-item active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span style="font-size:10px;font-weight:500">书库</span>
    </div>
    <div class="tab-item inactive">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06"/></svg>
      <span style="font-size:10px">设置</span>
    </div>
  </div>
</body>
</html>
