appId: ${APP_ID}
name: Select the prepared iOS E2E folder as a local-library parent
---
# Required env: E2E_ROOT_FOLDER.
- extendedWaitUntil:
    visible: "Cancel|取消"
    timeout: 60000
- runFlow:
    when:
      visible: "浏览|Browse"
    commands:
      - tapOn: "浏览|Browse"
- repeat:
    times: 8
    while:
      visible:
        id: "BackButton"
        childOf:
          id: "Browse View \\(Picker\\)"
    commands:
      - tapOn:
          id: "BackButton"
          childOf:
            id: "Browse View \\(Picker\\)"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "DOC.sidebar.item.我的iPhone|DOC.sidebar.item.On My iPhone|DOC.sidebar.item.我的iPad|DOC.sidebar.item.On My iPad"
    commands:
      - tapOn:
          id: "DOC.sidebar.item.我的iPhone|DOC.sidebar.item.On My iPhone|DOC.sidebar.item.我的iPad|DOC.sidebar.item.On My iPad"
      - waitForAnimationToEnd
- tapOn:
    id: "MyReader Fixtures, Container"
    point: "50%,25%"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "${E2E_ROOT_FOLDER}, Folder"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "${E2E_ROOT_FOLDER}, Folder"
    point: "50%,25%"
- waitForAnimationToEnd
- tapOn: "^打开$|^Open$"
