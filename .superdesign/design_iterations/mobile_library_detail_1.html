<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyReader · 书库详情</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="mobile_library_detail_theme_1.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg) !important; color: var(--text) !important; }
    .phone-frame { width: 100%; max-width: 900px; height: 100dvh; margin: 0 auto; position: relative; overflow: hidden; }
    .page-shell { height: 100%; overflow-y: auto; padding: calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 28px); }
    .touch-target { min-height: 48px; min-width: 48px; }
    .page-enter { animation: pageEnter 240ms ease-out both; }
    .hero-enter { animation: heroEnter 320ms ease-out both; }
    .details-enter { animation: detailsEnter 300ms ease-out both; animation-delay: 80ms; }
    .action-press { transition: transform 120ms ease, opacity 120ms ease, background-color 160ms ease; }
    .action-press:active { transform: scale(0.96); }
    .meta-divider { width: 36px; height: 1px; background: rgba(168, 106, 58, 0.22); margin: 12px auto 0; }
    .screen-dim {
      position: absolute;
      inset: 0;
      background: rgba(28, 25, 22, 0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .screen-dim.open { opacity: 1; pointer-events: auto; }
    .delete-dialog-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    .delete-dialog-wrap.open {
      opacity: 1;
      pointer-events: auto;
    }
    .delete-dialog {
      width: min(100%, 320px);
      transform: translateY(10px) scale(0.98);
      transition: transform 220ms ease-out;
    }
    .delete-dialog-wrap.open .delete-dialog {
      transform: translateY(0) scale(1);
    }
    .detail-value-stack { display: flex; flex-direction: column; gap: 2px; }
    .icon-badge {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: rgba(255, 253, 248, 0.52);
      border: 1px solid rgba(168, 106, 58, 0.18);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      box-shadow: 0 10px 22px rgba(95, 73, 48, 0.08);
    }
    :root.dark .icon-badge {
      background: rgba(37, 33, 29, 0.56);
      border-color: rgba(201, 135, 78, 0.18);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.24);
    }
    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes heroEnter {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes detailsEnter {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .page-enter, .hero-enter, .details-enter { animation: fadeOnly 140ms linear both; }
      .screen-dim, .delete-dialog-wrap, .delete-dialog, .action-press { transition-duration: 120ms !important; }
      .action-press:active { transform: none; }
      .delete-dialog { transform: none !important; }
    }
    @keyframes fadeOnly {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (min-width: 768px) {
      .page-shell { padding-left: 28px; padding-right: 28px; }
      .library-hero { width: 188px !important; height: 188px !important; }
    }
  </style>
</head>
<body>
  <main class="phone-frame library-page-shell page-enter">
    <div class="page-shell">
      <header class="mb-10 flex items-center justify-between">
        <button class="top-action-btn touch-target action-press inline-flex items-center justify-center" type="button" aria-label="返回">
          <i data-lucide="arrow-left" class="size-5"></i>
        </button>
        <button id="delete-trigger" class="top-action-btn top-action-btn--danger touch-target action-press inline-flex items-center justify-center gap-2 px-4" type="button" aria-label="删除书库">
          <i data-lucide="trash-2" class="size-4"></i>
          <span class="text-sm font-medium">删除</span>
        </button>
      </header>

      <section class="hero-enter pt-1 text-center">
        <div class="library-hero mb-7">
          <div class="icon-badge">
            <i data-lucide="library-big" class="size-9" style="color: var(--primary);"></i>
          </div>
        </div>
        <h1 class="library-title-font text-[1.95rem] font-semibold tracking-[0.01em]">小说总库</h1>
      </section>

      <section class="details-enter mx-auto mt-10 max-w-[34rem]">
        <div class="library-detail-list">
          <div class="detail-row">
            <div class="detail-label">书库类型</div>
            <div class="detail-value">Calibre 书库</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">数据源类型</div>
            <div class="detail-value">本地</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">书库路径</div>
            <div class="detail-value detail-value--path">/Books/Fiction/Main Library</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">收录图书数量</div>
            <div class="detail-value">1,942 本</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">同步时间</div>
            <div class="detail-value-stack">
              <span class="detail-value">2026 年 4 月 12 日 14:32</span>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div id="delete-overlay" class="screen-dim" aria-hidden="true"></div>

    <div id="delete-dialog-wrap" class="delete-dialog-wrap" aria-hidden="true">
      <section class="delete-dialog" role="dialog" aria-modal="true" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-desc">
        <div class="confirm-dialog text-center">
          <div class="px-6 pb-4 pt-6">
            <h2 id="delete-dialog-title" class="confirm-dialog__title text-[1.1rem] font-semibold">删除这个书库？</h2>
            <p id="delete-dialog-desc" class="confirm-dialog__desc mx-auto mt-2 max-w-[15.5rem] text-[0.94rem] leading-6">
              将从应用中移除该书库，但书库文件仍然保留在原始位置，如果不再需要这些文件，可以手工删除。
            </p>
          </div>
          <div class="confirm-dialog__actions grid grid-cols-2">
            <button id="cancel-delete" class="confirm-dialog__action action-press text-[1rem] font-medium" type="button">
              取消
            </button>
            <button class="confirm-dialog__action confirm-dialog__action--danger action-press text-[1rem]" type="button">
              删除
            </button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    lucide.createIcons();

    const deleteTrigger = document.getElementById('delete-trigger');
    const deleteOverlay = document.getElementById('delete-overlay');
    const deleteSheet = document.getElementById('delete-dialog-wrap');
    const cancelDelete = document.getElementById('cancel-delete');

    function openDeleteSheet() {
      deleteOverlay.classList.add('open');
      deleteSheet.classList.add('open');
      deleteOverlay.setAttribute('aria-hidden', 'false');
      deleteSheet.setAttribute('aria-hidden', 'false');
    }

    function closeDeleteSheet() {
      deleteOverlay.classList.remove('open');
      deleteSheet.classList.remove('open');
      deleteOverlay.setAttribute('aria-hidden', 'true');
      deleteSheet.setAttribute('aria-hidden', 'true');
    }

    deleteTrigger.addEventListener('click', openDeleteSheet);
    deleteOverlay.addEventListener('click', closeDeleteSheet);
    cancelDelete.addEventListener('click', closeDeleteSheet);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeDeleteSheet();
    });
  </script>
</body>
</html>
