name: Release
run-name: "${{ github.event.action == 'closed' && 'Finalize' || 'Candidate' }} PR #${{ github.event.number }} at ${{ github.event.pull_request.head.sha }}"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.number }}-${{ github.event.action == 'closed' && 'publish' || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.action != 'closed' && startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check the branch version, applications and changelog
        run: |
          version="${GITHUB_HEAD_REF#release/}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$(jq -er .version my-reader/src-tauri/tauri.conf.json)"
          test "$version" = "$(jq -er .expo.version my-reader-mobile/app.json)"
          grep -Fq "## [$version] -" CHANGELOG.md

  windows:
    name: Windows
    needs: verify
    uses: ./.github/workflows/desktop-build.yml

  desktop-e2e:
    name: Windows E2E
    needs: verify
    uses: ./.github/workflows/desktop-e2e.yml
    with:
      windows_only: true
      advisory: true

  report:
    needs: [verify, windows, desktop-e2e]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      E2E: ${{ needs.desktop-e2e.outputs.result }}
      WINDOWS: ${{ needs.windows.result }}
    steps:
      - name: Report Windows results on the release PR
        run: |
          result="⚠️ ${E2E:-no result reported}"
          if [[ "$E2E" == success ]]; then result="passed"; fi
          printf 'Windows installers: %s. Windows E2E: %s.\n\nCommit `%s` · [CI logs and reports](%s/%s/actions/runs/%s). E2E is advisory.\n' \
            "$WINDOWS" "$result" "$SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/report.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"

  stage:
    name: Verify merged candidate and stage public installers
    if: github.event.action == 'closed' && github.event.pull_request.merged && startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      candidate: ${{ steps.verify.outputs.candidate }}
      ipa: ${{ steps.upload.outputs.ipa }}
      public_assets: ${{ steps.upload.outputs.public_assets }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
      - name: Bind PR, merged tree, required checks and verified bytes
        id: verify
        run: node scripts/release/finalize-candidate.mjs
      - name: Stage and verify the exact public asset set
        id: upload
        env:
          TAG: ${{ steps.verify.outputs.tag }}
          IPA: ${{ steps.verify.outputs.ipa }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft,targetCommitish --jq '[.isDraft,.targetCommitish]|@tsv')" = "$(printf 'true\t%s' "$GITHUB_SHA")"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "MyReader $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" release-assets/* --clobber
          url=$(gh release view "$TAG" --json apiUrl --jq .apiUrl)
          gh api "$url" > "$RUNNER_TEMP/draft.json"
          node scripts/release/verify-upload.mjs release-assets "$RUNNER_TEMP/draft.json" "$TAG"
          echo "public_assets=$(jq -c '[.assets[] | {name,size,digest,state}]|sort_by(.name)' "$RUNNER_TEMP/draft.json")" >> "$GITHUB_OUTPUT"
          echo "ipa=$(sha256sum "$IPA" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  submit-ios:
    name: Submit the verified IPA to TestFlight
    needs: stage
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE: ${{ needs.stage.outputs.candidate }}
      EXPECTED: ${{ needs.stage.outputs.ipa }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Check for a previous submission of the same IPA
        id: prior
        run: |
          value=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '.statuses[]|select(.context=="Release TestFlight" and .state=="success")|.description')
          if [[ "$value" == "$EXPECTED" ]]; then echo "submitted=true" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.prior.outputs.submitted != 'true'
      - uses: actions/setup-node@v6
        if: steps.prior.outputs.submitted != 'true'
        with:
          node-version: '22.22.2'
          cache: pnpm
      - if: steps.prior.outputs.submitted != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Submit the same binary and record Apple's accepted submission
        if: steps.prior.outputs.submitted != 'true'
        working-directory: my-reader-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          TESTFLIGHT_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP || 'Team (Expo)' }}
        run: |
          gh release download "$CANDIDATE" --pattern '*.ipa' --dir "$RUNNER_TEMP/ipa"
          files=("$RUNNER_TEMP"/ipa/*.ipa)
          test "${#files[@]}" = 1
          test "$(sha256sum "${files[0]}" | cut -d' ' -f1)" = "$EXPECTED"
          npx --yes eas-cli@27.11.0 submit --platform ios --profile production --path "${files[0]}" --groups "$TESTFLIGHT_GROUP" --non-interactive --wait
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f context='Release TestFlight' -f state=success -f description="$EXPECTED" --silent

  publish:
    name: Publish at the merge commit
    needs: [stage, submit-ios]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED: ${{ needs.stage.outputs.public_assets }}
      TAG: ${{ needs.stage.outputs.tag }}
      CANDIDATE: ${{ needs.stage.outputs.candidate }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check staged bytes and publish the final tag
        run: |
          url=$(gh release view "$TAG" --json apiUrl --jq .apiUrl)
          gh api "$url" > "$RUNNER_TEMP/final.json"
          jq -e --arg sha "$GITHUB_SHA" --arg tag "$TAG" --argjson expected "$EXPECTED" \
            '.target_commitish==$sha and .tag_name==$tag and ([.assets[] | {name,size,digest,state}] | sort_by(.name))==$expected' "$RUNNER_TEMP/final.json"
          if jq -e .draft "$RUNNER_TEMP/final.json" >/dev/null; then
            gh release edit "$TAG" --draft=false --latest
          fi
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$GITHUB_SHA"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
      - name: Remove the promoted candidate draft
        run: |
          if gh release view "$CANDIDATE" --json isDraft --jq .isDraft | grep -qx true; then gh release delete "$CANDIDATE" --yes; fi
