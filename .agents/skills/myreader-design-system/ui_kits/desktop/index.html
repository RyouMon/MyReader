<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>MyReader — Desktop</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  @keyframes spin    { to { transform:rotate(360deg); } }
  @keyframes fadeIn  { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }
  @keyframes slideIn { from { opacity:0; transform:translateX(-4px); } to { opacity:1; transform:none; } }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body,#root { height:100%; }
  body { font-family:'DM Sans','PingFang SC',system-ui,sans-serif; -webkit-font-smoothing:antialiased; font-size:14px; }
  ::-webkit-scrollbar { width:5px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:#C4B8AE; border-radius:3px; }
  input,button,select { font-family:inherit; }
  /* Desktop-specific: always show cursor styles */
  [data-clickable] { cursor:pointer; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── Data ── */
const BOOKS = [
  { id:1, title:'The Name of the Rose', author:'Umberto Eco',     pct:62, pages:556, format:'EPUB', color:'#3A2818', color2:'#1E1208', synced:true,  tags:['小说','历史'] },
  { id:2, title:'百年孤独',              author:'加西亚·马尔克斯', pct:28, pages:417, format:'EPUB', color:'#1A3040', color2:'#0D1E28', synced:false, tags:['小说','魔幻'] },
  { id:3, title:'Dune',                  author:'Frank Herbert',   pct: 8, pages:688, format:'EPUB', color:'#2A1A40', color2:'#180E28', synced:true,  tags:['科幻'] },
  { id:4, title:'三体',                  author:'刘慈欣',           pct: 0, pages:302, format:'EPUB', color:'#0D2830', color2:'#061418', synced:true,  tags:['科幻'] },
  { id:5, title:'Normal People',         author:'Sally Rooney',   pct:44, pages:288, format:'EPUB', color:'#2A3A20', color2:'#161E10', synced:true,  tags:['小说'] },
  { id:6, title:'海边的卡夫卡',          author:'村上春树',         pct:91, pages:505, format:'EPUB', color:'#3A2A10', color2:'#1E1408', synced:false, tags:['小说'] },
  { id:7, title:'Crime and Punishment',  author:'Dostoevsky',     pct: 0, pages:671, format:'PDF',  color:'#2A1010', color2:'#180808', synced:true,  tags:['经典'] },
  { id:8, title:'东方快车谋杀案',        author:'阿加莎·克里斯蒂', pct:55, pages:248, format:'EPUB', color:'#1A2840', color2:'#0D1420', synced:true,  tags:['推理'] },
];

/* ── Icons ── */
function Icon({ name, size=16, color='currentColor', spin=false }) {
  const p = { fill:'none', stroke:color, strokeWidth:'1.5', strokeLinecap:'round', strokeLinejoin:'round' };
  const icons = {
    library:     [<path {...p} key="a" d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>, <path {...p} key="b" d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>],
    search:      [<circle {...p} key="a" cx="11" cy="11" r="8"/>, <path {...p} key="b" d="m21 21-4.35-4.35"/>],
    settings:    [<circle {...p} key="a" cx="12" cy="12" r="3"/>, <path {...p} key="b" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>],
    sync:        [<polyline {...p} key="a" points="1 4 1 10 7 10"/>, <polyline {...p} key="b" points="23 20 23 14 17 14"/>, <path {...p} key="c" d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>],
    grid:        [<rect {...p} key="a" x="3" y="3" width="7" height="7"/>, <rect {...p} key="b" x="14" y="3" width="7" height="7"/>, <rect {...p} key="c" x="3" y="14" width="7" height="7"/>, <rect {...p} key="d" x="14" y="14" width="7" height="7"/>],
    list:        [<line {...p} key="a" x1="8" y1="6" x2="21" y2="6"/>, <line {...p} key="b" x1="8" y1="12" x2="21" y2="12"/>, <line {...p} key="c" x1="8" y1="18" x2="21" y2="18"/>, <line {...p} key="d" x1="3" y1="6" x2="3.01" y2="6"/>, <line {...p} key="e" x1="3" y1="12" x2="3.01" y2="12"/>, <line {...p} key="f" x1="3" y1="18" x2="3.01" y2="18"/>],
    chevLeft:    [<polyline {...p} key="a" points="15 18 9 12 15 6"/>],
    chevRight:   [<polyline {...p} key="a" points="9 18 15 12 9 6"/>],
    moon:        [<path {...p} key="a" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>],
    sun:         [<circle {...p} key="a" cx="12" cy="12" r="5"/>, <line {...p} key="b" x1="12" y1="1" x2="12" y2="3"/>, <line {...p} key="c" x1="12" y1="21" x2="12" y2="23"/>, <line {...p} key="d" x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>, <line {...p} key="e" x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>, <line {...p} key="f" x1="1" y1="12" x2="3" y2="12"/>, <line {...p} key="g" x1="21" y1="12" x2="23" y2="12"/>],
    check:       [<polyline {...p} key="a" points="20 6 9 17 4 12"/>],
    cloud:       [<path {...p} key="a" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>],
    folder:      [<path {...p} key="a" d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>],
    bookOpen:    [<path {...p} key="a" d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>, <path {...p} key="b" d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>],
    trash:       [<polyline {...p} key="a" points="3 6 5 6 21 6"/>, <path {...p} key="b" d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>],
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" style={spin?{animation:'spin 1.1s linear infinite'}:{}}>
      {icons[name]}
    </svg>
  );
}

/* ── Kbd chip ── */
const Kbd = ({ k }) => (
  <span style={{ display:'inline-flex',alignItems:'center',justifyContent:'center',height:16,minWidth:16,padding:'0 3px',background:'rgba(28,23,20,.07)',border:'1px solid rgba(28,23,20,.14)',borderRadius:3,fontSize:10,fontFamily:'monospace',color:'#9C9089',lineHeight:1 }}>{k}</span>
);

/* ── Book cover ── */
function BookCover({ book, size=110, onClick }) {
  const h = Math.round(size * 1.44);
  const [hov, setHov] = useState(false);
  return (
    <div onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{ width:size, height:h, borderRadius:9, cursor:'pointer', position:'relative', overflow:'hidden', flexShrink:0,
        background:`linear-gradient(145deg,${book.color},${book.color2})`,
        boxShadow: hov?'3px 6px 20px rgba(28,23,20,.28)':'2px 4px 14px rgba(28,23,20,.18)',
        transform: hov?'scale(1.02)':'scale(1)', transition:'all 180ms cubic-bezier(0.25,0.1,0.25,1)',
      }}>
      <div style={{ position:'absolute',left:0,top:0,bottom:0,width:5,background:'rgba(0,0,0,.25)',borderRadius:'9px 0 0 9px' }}/>
      <div style={{ position:'absolute',inset:0,display:'flex',flexDirection:'column',justifyContent:'flex-end',padding:8 }}>
        <div style={{ fontFamily:'Lora,serif',fontSize:size<90?9:10,fontWeight:600,color:'rgba(255,255,255,.9)',lineHeight:1.3 }}>{book.title}</div>
        <div style={{ fontFamily:'DM Sans,sans-serif',fontSize:size<90?8:9,color:'rgba(255,255,255,.5)',marginTop:2 }}>{book.author}</div>
      </div>
      {book.pct>0 && <div style={{ position:'absolute',bottom:0,left:0,right:0,height:2.5,background:'rgba(255,255,255,.15)' }}>
        <div style={{ height:'100%',width:`${book.pct}%`,background:'rgba(255,255,255,.72)',borderRadius:'0 2px 2px 0' }}/>
      </div>}
    </div>
  );
}

/* ── Sidebar ── */
function Sidebar({ screen, onNav, dark, onToggleDark }) {
  const bg      = dark?'#22201B':'#EEEAE1';
  const ink1    = dark?'#F0EBE1':'#1C1714';
  const ink3    = dark?'#7A7068':'#9C9089';
  const border  = dark?'rgba(255,255,255,.06)':'rgba(28,23,20,.07)';

  const NavRow = ({ id, label, icon, kbd }) => {
    const active = screen===id;
    return (
      <div onClick={()=>onNav(id)} style={{
        display:'flex',alignItems:'center',gap:7,padding:'6px 10px',borderRadius:7,cursor:'pointer',
        marginBottom:1, fontSize:13, fontWeight:active?500:400,
        color: active?'#C4622D':ink3,
        background: active?(dark?'rgba(196,98,45,.12)':'#F5E8DF'):'transparent',
        borderLeft: `3px solid ${active?'#C4622D':'transparent'}`,
        transition:'background 100ms,color 100ms',
      }}
      onMouseEnter={e=>{ if(!active) e.currentTarget.style.background=dark?'rgba(255,255,255,.04)':'rgba(28,23,20,.05)'; }}
      onMouseLeave={e=>{ if(!active) e.currentTarget.style.background='transparent'; }}
      >
        <Icon name={icon} size={14} color={active?'#C4622D':ink3}/>
        <span style={{flex:1}}>{label}</span>
        {kbd && <span style={{display:'flex',gap:2}}>{kbd.map((k,i)=><Kbd key={i} k={k}/>)}</span>}
      </div>
    );
  };

  return (
    <div style={{ width:216,flexShrink:0,background:bg,display:'flex',flexDirection:'column',borderRight:`1px solid ${border}`,height:'100%' }}>
      {/* Logo */}
      <div style={{ padding:'16px 14px 12px',display:'flex',alignItems:'center',gap:8,borderBottom:`1px solid ${border}` }}>
        <div style={{ width:26,height:26,background:'#C4622D',borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center' }}>
          <svg width="14" height="14" viewBox="0 0 28 28" fill="none">
            <rect x="5" y="2" width="12" height="22" rx="2" fill="rgba(255,255,255,.75)"/>
            <line x1="10" y1="2" x2="10" y2="24" stroke="#C4622D" strokeWidth="1.5"/>
          </svg>
        </div>
        <span style={{ fontFamily:'Lora,serif',fontSize:15,fontWeight:600,color:ink1,letterSpacing:'-0.2px' }}>MyReader</span>
      </div>

      {/* Library mode chip */}
      <div style={{ margin:'10px 10px 6px' }}>
        <div style={{ fontSize:10,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:ink3,marginBottom:5,paddingLeft:4 }}>书库</div>
        <div style={{ background:dark?'rgba(196,98,45,.1)':'#F5E8DF',borderRadius:6,padding:'5px 10px',display:'flex',alignItems:'center',gap:6 }}>
          <div style={{ width:6,height:6,borderRadius:'50%',background:'#C4622D',flexShrink:0 }}/>
          <span style={{ fontSize:12,fontWeight:500,color:'#C4622D',flex:1 }}>Calibre 书库</span>
        </div>
      </div>

      {/* Nav */}
      <nav style={{ flex:1,padding:'4px 8px',overflow:'auto' }}>
        <NavRow id="library" label="书库" icon="library" kbd={['⌘','1']}/>
        <NavRow id="recent"  label="最近阅读" icon="bookOpen" kbd={['⌘','2']}/>
      </nav>

      {/* Bottom */}
      <div style={{ padding:'8px 8px 12px',borderTop:`1px solid ${border}`,display:'flex',flexDirection:'column',gap:1 }}>
        {/* Sync status */}
        <div style={{ display:'flex',alignItems:'center',gap:6,padding:'5px 10px',borderRadius:6,fontSize:12,color:'#3A7D5A',background:dark?'rgba(58,125,90,.1)':'#DCF0E8',marginBottom:4 }}>
          <Icon name="check" size={12} color="#3A7D5A"/>
          <span style={{flex:1}}>已同步</span>
          <span style={{ fontFamily:'monospace',fontSize:10,color:dark?'#7A7068':'#9C9089' }}>2m ago</span>
        </div>
        <div onClick={onToggleDark} style={{ display:'flex',alignItems:'center',gap:7,padding:'5px 10px',borderRadius:6,cursor:'pointer',fontSize:12,color:ink3 }}
          onMouseEnter={e=>e.currentTarget.style.background=dark?'rgba(255,255,255,.04)':'rgba(28,23,20,.05)'}
          onMouseLeave={e=>e.currentTarget.style.background='transparent'}
        >
          <Icon name={dark?'sun':'moon'} size={14} color={ink3}/>
          {dark?'日间模式':'夜间模式'}
          <span style={{marginLeft:'auto',display:'flex',gap:2}}><Kbd k="⌘"/><Kbd k="D"/></span>
        </div>
        <div style={{ display:'flex',alignItems:'center',gap:7,padding:'5px 10px',borderRadius:6,cursor:'pointer',fontSize:12,color:ink3 }}
          onMouseEnter={e=>e.currentTarget.style.background=dark?'rgba(255,255,255,.04)':'rgba(28,23,20,.05)'}
          onMouseLeave={e=>e.currentTarget.style.background='transparent'}
        >
          <Icon name="settings" size={14} color={ink3}/>
          设置
          <span style={{marginLeft:'auto',display:'flex',gap:2}}><Kbd k="⌘"/><Kbd k=","/></span>
        </div>
      </div>
    </div>
  );
}

/* ── Toolbar ── */
function Toolbar({ title, dark, viewMode, setViewMode, search, setSearch, onSync, syncing }) {
  const bg     = dark?'#26211D':'#FFFFFF';
  const ink1   = dark?'#F0EBE1':'#1C1714';
  const ink3   = dark?'#7A7068':'#9C9089';
  const border = dark?'rgba(255,255,255,.07)':'rgba(28,23,20,.08)';

  return (
    <div style={{ height:48,display:'flex',alignItems:'center',gap:10,padding:'0 20px',background:bg,borderBottom:`1px solid ${border}`,flexShrink:0 }}>
      <h1 style={{ fontFamily:'Lora,serif',fontSize:18,fontWeight:600,color:ink1,marginRight:4 }}>{title}</h1>

      {/* Search */}
      <div style={{ flex:1,maxWidth:280,display:'flex',alignItems:'center',gap:7,background:dark?'rgba(255,255,255,.06)':'#F5F1EA',border:`1px solid ${border}`,borderRadius:7,padding:'0 10px',height:32 }}>
        <Icon name="search" size={13} color={ink3}/>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜索书名、作者…"
          style={{ border:'none',background:'transparent',font:'inherit',fontSize:13,color:ink1,outline:'none',flex:1 }}/>
      </div>

      <div style={{ flex:1 }}/>

      {/* View toggle */}
      <div style={{ display:'flex',background:dark?'rgba(255,255,255,.06)':'#F0EBE1',borderRadius:7,padding:2,gap:1 }}>
        {['grid','list'].map(m=>(
          <div key={m} onClick={()=>setViewMode(m)} data-clickable style={{
            padding:'4px 8px',borderRadius:5,cursor:'pointer',
            background:viewMode===m?(dark?'rgba(255,255,255,.08)':'#fff'):'transparent',
            boxShadow:viewMode===m?'0 1px 2px rgba(28,23,20,.08)':'none',
            transition:'all 120ms',
          }}>
            <Icon name={m} size={13} color={viewMode===m?'#C4622D':ink3}/>
          </div>
        ))}
      </div>

      {/* Sync btn */}
      <button onClick={onSync} style={{
        display:'flex',alignItems:'center',gap:5,height:32,padding:'0 12px',borderRadius:7,border:'none',cursor:'pointer',
        background:dark?'rgba(255,255,255,.06)':'#F0EBE1',color:ink3,fontSize:12,fontWeight:500,
        transition:'background 120ms',
      }}
      onMouseEnter={e=>e.currentTarget.style.background=dark?'rgba(255,255,255,.1)':'#E8E2D8'}
      onMouseLeave={e=>e.currentTarget.style.background=dark?'rgba(255,255,255,.06)':'#F0EBE1'}
      >
        <Icon name="sync" size={13} color={ink3} spin={syncing}/> 同步
      </button>
    </div>
  );
}

/* ── Library grid view ── */
function GridView({ books, onOpen, dark }) {
  const ink1 = dark?'#F0EBE1':'#1C1714';
  const ink3 = dark?'#7A7068':'#9C9089';
  return (
    <div style={{ display:'flex',flexWrap:'wrap',gap:18,animation:'fadeIn 180ms ease' }}>
      {books.map(book => (
        <div key={book.id} style={{ display:'flex',flexDirection:'column',gap:7 }}>
          <BookCover book={book} size={108} onClick={()=>onOpen(book)}/>
          <div style={{ maxWidth:108 }}>
            <div style={{ fontFamily:'Lora,serif',fontSize:12,fontWeight:500,color:ink1,lineHeight:1.3,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis' }}>{book.title}</div>
            <div style={{ fontSize:11,color:ink3,marginTop:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis' }}>{book.author}</div>
            {book.pct>0 && <div style={{ display:'flex',alignItems:'center',gap:4,marginTop:4 }}>
              <div style={{ flex:1,height:2,background:dark?'rgba(255,255,255,.1)':'#EDE8DF',borderRadius:9999,overflow:'hidden' }}>
                <div style={{ width:`${book.pct}%`,height:'100%',background:'#C4622D' }}/>
              </div>
              <span style={{ fontSize:10,color:'#C4622D' }}>{book.pct}%</span>
            </div>}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ── Library list view ── */
function ListView({ books, onOpen, dark }) {
  const surface = dark?'#26211D':'#FFFFFF';
  const ink1    = dark?'#F0EBE1':'#1C1714';
  const ink2    = dark?'#B8AFA6':'#5C5349';
  const ink3    = dark?'#7A7068':'#9C9089';
  const border  = dark?'rgba(255,255,255,.06)':'rgba(28,23,20,.07)';
  const [hovId, setHovId] = useState(null);

  return (
    <div style={{ display:'flex',flexDirection:'column',gap:0,animation:'fadeIn 180ms ease' }}>
      {/* Header row */}
      <div style={{ display:'grid',gridTemplateColumns:'1fr 160px 80px 70px 60px',gap:0,padding:'0 14px',height:28,alignItems:'center',borderBottom:`1px solid ${border}`,marginBottom:2 }}>
        {['书名','作者','进度','格式','同步'].map((h,i)=>(
          <div key={i} style={{ fontSize:11,fontWeight:600,letterSpacing:'0.06em',textTransform:'uppercase',color:ink3 }}>{h}</div>
        ))}
      </div>
      {books.map(book=>(
        <div key={book.id} onClick={()=>onOpen(book)}
          onMouseEnter={()=>setHovId(book.id)} onMouseLeave={()=>setHovId(null)}
          style={{
            display:'grid',gridTemplateColumns:'1fr 160px 80px 70px 60px',gap:0,
            padding:'0 14px',height:36,alignItems:'center',cursor:'pointer',borderRadius:6,
            background:hovId===book.id?(dark?'rgba(255,255,255,.04)':'rgba(28,23,20,.04)'):'transparent',
            transition:'background 80ms',
          }}>
          <div style={{ display:'flex',alignItems:'center',gap:8,minWidth:0 }}>
            <BookCover book={book} size={20} onClick={()=>{}}/>
            <span style={{ fontFamily:'Lora,serif',fontSize:13,fontWeight:500,color:ink1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis' }}>{book.title}</span>
          </div>
          <div style={{ fontSize:12,color:ink2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis' }}>{book.author}</div>
          <div style={{ display:'flex',alignItems:'center',gap:5 }}>
            {book.pct>0
              ? <><div style={{ width:48,height:2.5,background:dark?'rgba(255,255,255,.1)':'#EDE8DF',borderRadius:9999,overflow:'hidden' }}><div style={{ width:`${book.pct}%`,height:'100%',background:'#C4622D' }}/></div><span style={{ fontSize:11,color:'#C4622D' }}>{book.pct}%</span></>
              : <span style={{ fontSize:11,color:ink3 }}>—</span>}
          </div>
          <div style={{ fontSize:11,color:ink3 }}>{book.format}</div>
          <div>
            <div style={{ width:7,height:7,borderRadius:'50%',background:book.synced?'#3A7D5A':'#C4922D' }}/>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ── Reader ── */
function ReaderScreen({ book, onBack, dark, onToggleDark }) {
  const [showUI, setShowUI] = useState(true);
  const bg        = dark?'#1C1814':'#F7F3EC';
  const textColor = dark?'#E8D9BC':'#1C1714';
  const toolbarBg = dark?'rgba(28,24,20,.92)':'rgba(247,243,236,.92)';
  const border    = dark?'rgba(255,255,255,.07)':'rgba(28,23,20,.07)';
  const ink3      = dark?'#7A7068':'#9C9089';

  // Keyboard nav
  useEffect(()=>{
    const handler = e=>{
      if(e.key==='Escape') onBack();
      if(e.key==='ArrowLeft'||e.key==='ArrowRight') setShowUI(true);
    };
    window.addEventListener('keydown',handler);
    return()=>window.removeEventListener('keydown',handler);
  },[onBack]);

  return (
    <div style={{ flex:1,position:'relative',background:bg,height:'100%',overflow:'hidden',cursor:'default' }}
      onClick={()=>setShowUI(v=>!v)}>
      {/* Top bar */}
      <div style={{
        position:'absolute',top:0,left:0,right:0,zIndex:10,
        background:toolbarBg,backdropFilter:'blur(12px)',borderBottom:`1px solid ${border}`,
        height:44,display:'flex',alignItems:'center',padding:'0 20px',gap:12,
        transform:showUI?'translateY(0)':'translateY(-100%)',transition:'transform 200ms cubic-bezier(0.25,0.1,0.25,1)',
      }}>
        <button onClick={e=>{e.stopPropagation();onBack();}} style={{
          display:'flex',alignItems:'center',gap:5,background:'transparent',border:'none',cursor:'pointer',
          fontSize:13,color:dark?'#B8AFA6':'#5C5349',padding:'4px 8px',borderRadius:6,
        }}
        onMouseEnter={e=>e.currentTarget.style.background=dark?'rgba(255,255,255,.06)':'rgba(28,23,20,.06)'}
        onMouseLeave={e=>e.currentTarget.style.background='transparent'}
        >
          <Icon name="chevLeft" size={14} color={dark?'#B8AFA6':'#5C5349'}/> 书库 <Kbd k="Esc"/>
        </button>
        <span style={{ flex:1,textAlign:'center',fontFamily:'Lora,serif',fontSize:14,fontWeight:500,color:dark?'#F0EBE1':'#1C1714' }}>{book.title}</span>
        <button onClick={e=>{e.stopPropagation();onToggleDark();}} style={{ background:'transparent',border:'none',cursor:'pointer',padding:4,borderRadius:6,color:ink3 }}>
          <Icon name={dark?'sun':'moon'} size={15} color={ink3}/>
        </button>
      </div>

      {/* Content */}
      <div style={{ height:'100%',overflow:'auto',padding:'60px 0 64px' }}>
        <div style={{ maxWidth:640,margin:'0 auto',padding:'0 48px' }}>
          <div style={{ fontFamily:'DM Sans,sans-serif',fontSize:11,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:ink3,marginBottom:10 }}>Chapter III</div>
          <h2 style={{ fontFamily:'Lora,serif',fontSize:22,fontWeight:600,color:textColor,marginBottom:26,lineHeight:1.3 }}>In Which the Labyrinth Is Entered</h2>
          {[`Of course the end of the world was not the world's end but only that of our little world of books and scholars and proud abbots. Still it was the world we knew, and losing it left us mute with grief.`,
            `Brother William walked ahead, his long shadow crossing the scriptorium floor. I followed, clutching my notebook. The smell of tallow candles and old vellum surrounded us like a fog thick with centuries.`,
            `In that moment I understood: the library was not merely a place of books. It was a mind — ancient, vast, and fiercely guarded by those who believed that knowledge, unguided, was more dangerous than ignorance.`,
          ].map((p,i)=>(
            <p key={i} style={{ fontFamily:'Merriweather,serif',fontSize:17,lineHeight:1.78,color:textColor,marginBottom:22 }}>{p}</p>
          ))}
        </div>
      </div>

      {/* Bottom bar */}
      <div style={{
        position:'absolute',bottom:0,left:0,right:0,zIndex:10,
        background:toolbarBg,backdropFilter:'blur(12px)',borderTop:`1px solid ${border}`,
        height:40,display:'flex',alignItems:'center',padding:'0 20px',gap:14,
        transform:showUI?'translateY(0)':'translateY(100%)',transition:'transform 200ms cubic-bezier(0.25,0.1,0.25,1)',
      }}>
        <div style={{ display:'flex',gap:2 }}><Kbd k="←"/><span style={{ fontSize:11,color:ink3,marginLeft:4 }}>上一页</span></div>
        <div style={{ flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3 }}>
          <div style={{ width:'100%',height:2.5,background:dark?'rgba(255,255,255,.1)':'#EDE8DF',borderRadius:9999,overflow:'hidden' }}>
            <div style={{ width:`${book.pct||12}%`,height:'100%',background:'#C4622D',borderRadius:9999 }}/>
          </div>
          <div style={{ fontSize:11,color:ink3 }}>第 234 页 · {book.pct||12}% · 点击切换工具栏</div>
        </div>
        <div style={{ display:'flex',gap:2 }}><span style={{ fontSize:11,color:ink3,marginRight:4 }}>下一页</span><Kbd k="→"/></div>
      </div>
    </div>
  );
}

/* ── App ── */
function App() {
  const saved      = JSON.parse(localStorage.getItem('mr_dt_v2')||'{}');
  const [screen, setScreen]   = useState(saved.screen||'library');
  const [reading, setReading] = useState(null);
  const [dark,    setDark]    = useState(saved.dark||false);
  const [view,    setView]    = useState(saved.view||'grid');
  const [search,  setSearch]  = useState('');
  const [syncing, setSyncing] = useState(false);

  useEffect(()=>{
    localStorage.setItem('mr_dt_v2',JSON.stringify({screen,dark,view}));
  },[screen,dark,view]);

  useEffect(()=>{
    const h = e=>{
      if(e.key==='1'&&e.metaKey){ e.preventDefault(); setScreen('library'); setReading(null); }
      if(e.key==='d'&&e.metaKey){ e.preventDefault(); setDark(v=>!v); }
    };
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[]);

  const handleSync = ()=>{ setSyncing(true); setTimeout(()=>setSyncing(false),2000); };

  const books = BOOKS.filter(b=>
    b.title.toLowerCase().includes(search.toLowerCase())||
    b.author.toLowerCase().includes(search.toLowerCase())
  );

  const bg      = dark?'#1C1814':'#F7F3EC';
  const surface = dark?'#26211D':'#FFFFFF';

  return (
    <div style={{ display:'flex',height:'100vh',background:bg,overflow:'hidden' }} data-theme={dark?'dark':undefined}>
      <Sidebar screen={reading?'':screen} onNav={s=>{setScreen(s);setReading(null);}} dark={dark} onToggleDark={()=>setDark(v=>!v)}/>
      {reading ? (
        <ReaderScreen book={reading} onBack={()=>setReading(null)} dark={dark} onToggleDark={()=>setDark(v=>!v)}/>
      ) : (
        <div style={{ flex:1,display:'flex',flexDirection:'column',overflow:'hidden',background:surface }}>
          <Toolbar title={screen==='library'?'书库':'最近阅读'} dark={dark} viewMode={view} setViewMode={setView} search={search} setSearch={setSearch} onSync={handleSync} syncing={syncing}/>
          <div style={{ flex:1,overflow:'auto',padding:'18px 20px' }}>
            {view==='grid'
              ? <GridView books={books} onOpen={setReading} dark={dark}/>
              : <ListView books={books} onOpen={setReading} dark={dark}/>}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
