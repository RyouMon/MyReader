appId: ${APP_ID}
name: Read the bundled EPUB and restore a bookmarked page
tags:
  - reader
---
# Called after importing MyReader-TTS.epub through the real library UI.
- runScript: ../../scripts/selectors.js
- extendedWaitUntil:
    visible: "TTS verification"
    timeout: 30000
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible: ${output.selectors.reader.moreActions}
    commands:
      - tapOn:
          point: "50%,50%"
- assertVisible: ${output.selectors.reader.moreActions}
- tapOn:
    point: "50%,50%"
- assertNotVisible: ${output.selectors.reader.moreActions}
- tapOn:
    point: "50%,50%"
- tapOn: ${output.selectors.reader.moreActions}
# Keep the fixture's page turns deterministic on pads.
# Native tests separately cover restoring anchors in a two-column spread.
- tapOn: ${output.selectors.reader.settingsButton}
# Start inside the scroll viewport on both phone sheets and iPad popovers.
- repeat:
    times: 6
    while:
      notVisible:
        text: "栏: 始终单栏.*|Columns: Always Single.*"
        below: ${output.selectors.reader.settingsSheet}
    commands:
      - swipe:
          from:
            id: "reader-settings-scroll"
            point: "50%,85%"
          direction: UP
          duration: 600
- tapOn:
    text: "栏: 始终单栏.*|Columns: Always Single.*"
    below: ${output.selectors.reader.settingsSheet}
- assertVisible: "栏: 始终单栏, 已选择|Columns: Always Single, Selected"
- tapOn:
    point: "50%,20%"
- extendedWaitUntil:
    notVisible: ${output.selectors.reader.settingsSheet}
    timeout: 10000
- tapOn: ${output.selectors.reader.moreActions}
- tapOn: ${output.selectors.reader.tocButton}
- extendedWaitUntil:
    visible:
      text: "Playback position authority"
      id: "reader-toc-item-.*"
    timeout: 10000
- tapOn:
    text: "Playback position authority"
    id: "reader-toc-item-.*"
- extendedWaitUntil:
    notVisible: "目录|Contents|Table of Contents"
    timeout: 10000
- extendedWaitUntil:
    visible: "Playback position first page.*"
    timeout: 10000
# Assert the visible page in the production accessibility hierarchy.
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible: "Latest narration second page.*"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: ${output.selectors.reader.moreActions}
    commands:
      - tapOn:
          point: "50%,50%"
- tapOn:
    point: "90%,50%"
- extendedWaitUntil:
    visible: "Latest narration second page.*"
    timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible: "Playback position first page.*"
- tapOn:
    point: "50%,50%"
- tapOn: "在当前位置添加书签|Add bookmark at current location"
- extendedWaitUntil:
    visible: "移除当前位置的书签|Remove bookmark at current location"
    timeout: 10000
- tapOn: ${output.selectors.reader.moreActions}
- tapOn: ${output.selectors.reader.settingsButton}
- extendedWaitUntil:
    visible: ${output.selectors.reader.settingsSheet}
    timeout: 10000
- repeat:
    times: 6
    while:
      notVisible:
        text: "字体: 衬线.*|Font: Serif.*"
        below: ${output.selectors.reader.settingsSheet}
    commands:
      - swipe:
          from:
            id: "reader-settings-scroll"
            point: "50%,20%"
          direction: DOWN
          duration: 600
- tapOn:
    text: "字体: 衬线.*|Font: Serif.*"
    below: ${output.selectors.reader.settingsSheet}
- assertVisible: "字体: 衬线, 已选择|Font: Serif, Selected"
- tapOn: "字体: 人文无衬线.*|Font: Humanist Sans.*"
- assertVisible: "字体: 人文无衬线, 已选择|Font: Humanist Sans, Selected"
- tapOn:
    point: "50%,20%"
- extendedWaitUntil:
    notVisible: ${output.selectors.reader.settingsSheet}
    timeout: 10000
- extendedWaitUntil:
    visible: "Latest narration second page.*"
    timeout: 10000
- takeScreenshot: epub-bookmarked-page
- runFlow: ../../common/close_reader.yaml
- tapOn: '打开《MyReader TTS E2E》|Open "MyReader TTS E2E"'
- extendedWaitUntil:
    visible: "Latest narration second page.*"
    timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible: "Playback position first page.*"
- runFlow:
    when:
      notVisible: ${output.selectors.reader.moreActions}
    commands:
      - tapOn:
          point: "50%,50%"
- assertVisible: "移除当前位置的书签|Remove bookmark at current location"
# Restoring a saved location starts a new history with no synthetic first page.
- assertNotVisible:
    id: "reader-history-back"
- assertNotVisible:
    id: "reader-history-forward"
- takeScreenshot: epub-restored-bookmark
