name: Release

on:
  push:
    branches:
      - codex/release-v0.12.1-workflows-ci-test
    tags:
      - "v*"
    paths:
      - .github/workflow-tests/release

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.22.0
  PNPM_VERSION: 11.7.0

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Validate release metadata
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          desktop_version="$(jq -er '.version' my-reader/src-tauri/tauri.conf.json)"
          mobile_version="$(jq -er '.expo.version' my-reader-mobile/app.json)"

          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            release_version="$desktop_version"
          fi

          if [ "$desktop_version" != "$release_version" ] || [ "$mobile_version" != "$release_version" ]; then
            echo "$GITHUB_REF_NAME does not match desktop $desktop_version and mobile $mobile_version." >&2
            exit 1
          fi

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release unit suites
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          pnpm --filter @my-reader/fonts test
          pnpm --filter @my-reader/i18n test
          pnpm --filter @my-reader/tools test
          pnpm --filter my-reader run test:unit
          pnpm --filter my-reader-mobile exec jest --runInBand
          cargo test --workspace

  desktop:
    name: Build desktop release artifacts
    needs: verify
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit

  mobile:
    name: Build mobile release artifacts
    needs: verify
    uses: ./.github/workflows/mobile-build.yml
    with:
      build_android: true
      build_ios: true
    secrets: inherit

  draft-release:
    name: Update draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop
      - mobile
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          pattern: MyReader-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          heading="## [$version]"
          awk -v heading="$heading" '
            index($0, heading) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "No CHANGELOG entry found for $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Update draft release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "$GITHUB_REF_NAME already has a published release." >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "MyReader $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "MyReader $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
