appId: ${APP_ID}
tags:
  - reader
  - wip
---
# Scenario: 沉浸阅读时点击内容显示界面
- runFlow: ../../common/launch_and_prepare.yaml
- openLink: myreadermobile://seed-library
- runFlow: ../../common/confirm_deep_link.yaml
- openLink: myreadermobile://reader/1
- runFlow: ../../common/confirm_deep_link.yaml
- assertNotVisible: "More actions"
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "More actions"

