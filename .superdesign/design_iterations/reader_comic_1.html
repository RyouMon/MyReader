<!DOCTYPE html>
<html lang="zh-CN" data-reader-theme="paper">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyReader — 漫画/PDF 阅读</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="reader_theme_1.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: 'DM Sans', 'Noto Sans SC', system-ui, sans-serif !important;
      height: 100%; overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

    /* ═══════════════════════════════════════
       READER CONTAINER
       ═══════════════════════════════════════ */
    .reader-container {
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
      background: var(--viewer-bg, #1a1a1a);
    }

    /* ═══════════════════════════════════════
       TOP BAR
       ═══════════════════════════════════════ */
    .reader-topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 50;
      height: 52px;
      display: flex; align-items: center; padding: 0 20px; gap: 12px;
      background: rgba(18, 18, 18, 0.88);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      transform: translateY(-100%); opacity: 0;
      transition: transform 300ms ease-out, opacity 300ms ease-out;
    }
    .reader-topbar.visible { transform: translateY(0); opacity: 1; }

    .topbar-back {
      display: flex; align-items: center; gap: 6px; padding: 7px 14px 7px 10px;
      border-radius: 8px; border: none; background: transparent;
      color: rgba(255,255,255,0.55); cursor: pointer;
      font-size: 13.5px; font-family: inherit; transition: all 0.18s;
    }
    .topbar-back:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.9); }
    .topbar-back:hover .back-arrow-icon { transform: translateX(-2px); }
    .back-arrow-icon { display: flex; transition: transform 0.18s; }

    .topbar-title {
      flex: 1; text-align: center;
      font-family: 'Lora', 'Noto Serif SC', serif !important;
      font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.85);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .topbar-title .page-sep { color: rgba(255,255,255,0.35); margin: 0 6px; }

    .topbar-actions { display: flex; align-items: center; gap: 2px; }
    .topbar-btn {
      width: 36px; height: 36px; border-radius: 8px; border: none;
      background: transparent; color: rgba(255,255,255,0.50);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.9); }
    .topbar-btn:active { transform: scale(0.95); }
    .topbar-btn.active { color: var(--reader-chrome-active); }

    /* ═══════════════════════════════════════
       COMIC VIEWPORT
       ═══════════════════════════════════════ */
    .comic-viewport {
      flex: 1; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: var(--viewer-bg, #1a1a1a);
      position: relative;
    }

    /* Single page mode */
    .page-container {
      display: flex; align-items: center; justify-content: center;
      gap: var(--viewer-page-gap, 16px);
      height: 100%; padding: 24px;
      transition: transform 0.25s ease-out;
    }

    .comic-page {
      max-height: calc(100vh - 48px);
      max-width: 100%;
      border-radius: var(--viewer-page-radius, 2px);
      box-shadow: var(--viewer-page-shadow, 0 4px 24px rgba(0,0,0,0.30));
      object-fit: contain;
      user-select: none; -webkit-user-drag: none;
    }

    /* Placeholder pages */
    .page-placeholder {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #f0f0f0; color: #444;
      border-radius: var(--viewer-page-radius, 2px);
      box-shadow: var(--viewer-page-shadow, 0 4px 24px rgba(0,0,0,0.30));
      font-family: 'Lora', 'Noto Serif SC', serif;
      user-select: none; position: relative; overflow: hidden;
    }
    .page-placeholder.single {
      width: auto; height: calc(100vh - 80px);
      aspect-ratio: 0.7;
    }
    .page-placeholder.spread-left,
    .page-placeholder.spread-right {
      width: auto; height: calc(100vh - 80px);
      aspect-ratio: 0.7;
    }

    .page-art {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
    }

    .page-panel-grid {
      width: 100%; height: 100%;
      display: grid; gap: 6px; padding: 12px;
    }
    .page-panel-grid.layout-a {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 2fr 1fr 1.5fr;
    }
    .page-panel-grid.layout-b {
      grid-template-columns: 1fr 1.2fr;
      grid-template-rows: 1.5fr 1fr 2fr;
    }

    .panel-cell {
      border-radius: 3px; position: relative; overflow: hidden;
    }
    .panel-cell::after {
      content: ''; position: absolute; inset: 0;
      border: 2px solid rgba(0,0,0,0.15); border-radius: 3px;
    }

    .page-number {
      position: absolute; bottom: 10px; left: 50%;
      transform: translateX(-50%);
      font-size: 11px; color: rgba(0,0,0,0.35);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Click navigation zones */
    .click-zone { position: absolute; top: 52px; bottom: 64px; z-index: 5; }
    .click-zone-left { left: 0; width: 33.33%; cursor: w-resize; }
    .click-zone-center { left: 33.33%; width: 33.34%; cursor: pointer; }
    .click-zone-right { right: 0; width: 33.33%; cursor: e-resize; }
    .chrome-visible .click-zone { pointer-events: none; }

    /* Page turn animation */
    .page-container.turning-forward {
      animation: turnForward 300ms ease-out;
    }
    .page-container.turning-backward {
      animation: turnBackward 300ms ease-out;
    }
    @keyframes turnForward {
      0% { opacity: 1; transform: translateX(0); }
      40% { opacity: 0; transform: translateX(-40px); }
      41% { opacity: 0; transform: translateX(40px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes turnBackward {
      0% { opacity: 1; transform: translateX(0); }
      40% { opacity: 0; transform: translateX(40px); }
      41% { opacity: 0; transform: translateX(-40px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* ═══════════════════════════════════════
       BOTTOM BAR
       ═══════════════════════════════════════ */
    .reader-bottombar {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 45;
      height: 64px;
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 24px;
      background: rgba(18, 18, 18, 0.88);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.08);
      transform: translateY(100%); opacity: 0;
      transition: transform 300ms ease-out, opacity 300ms ease-out;
    }
    .reader-bottombar.visible { transform: translateY(0); opacity: 1; }

    .bottombar-nav { display: flex; align-items: center; gap: 12px; }

    .page-nav-btn {
      display: flex; align-items: center; gap: 4px;
      padding: 5px 12px; border-radius: 6px; border: none;
      background: transparent; color: rgba(255,255,255,0.50);
      font-size: 13px; font-family: inherit; cursor: pointer;
      white-space: nowrap; transition: all 0.15s;
    }
    .page-nav-btn:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.9); }
    .page-nav-btn:active { transform: scale(0.95); }

    .progress-group {
      flex: 1; display: flex; flex-direction: column; gap: 3px; align-items: center;
    }

    .progress-slider-wrap {
      width: 100%; height: 20px; display: flex; align-items: center;
      cursor: pointer; position: relative;
    }
    .progress-track {
      width: 100%; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.12); position: relative;
      transition: height 0.15s;
    }
    .progress-slider-wrap:hover .progress-track { height: 8px; }
    .progress-fill {
      height: 100%; border-radius: 2px;
      background: var(--reader-chrome-active); transition: width 0.3s;
    }
    .progress-thumb {
      position: absolute; top: 50%; transform: translate(-50%, -50%) scale(0);
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--reader-chrome-active); border: 2px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      transition: transform 0.12s;
    }
    .progress-slider-wrap:hover .progress-thumb { transform: translate(-50%, -50%) scale(1); }

    .progress-info {
      font-size: 11.5px; color: rgba(255,255,255,0.45);
      font-variant-numeric: tabular-nums;
    }

    /* ═══════════════════════════════════════
       DISPLAY MODE TOGGLE (single/spread)
       ═══════════════════════════════════════ */
    .display-toggle {
      display: flex; border-radius: 8px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12); flex-shrink: 0;
    }
    .display-toggle-btn {
      padding: 6px 10px; border: none;
      background: transparent; color: rgba(255,255,255,0.45);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .display-toggle-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
    .display-toggle-btn.active {
      background: rgba(255,255,255,0.12); color: var(--reader-chrome-active);
    }

    /* ═══════════════════════════════════════
       PANELS — identical structure to text reader
       ═══════════════════════════════════════ */
    .panel-overlay {
      position: absolute; inset: 0; z-index: 55;
      background: rgba(0,0,0,0); pointer-events: none;
      transition: background 300ms ease;
    }
    .panel-overlay.visible { background: rgba(0,0,0,0.5); pointer-events: auto; }

    /* TOC Panel */
    .toc-panel {
      position: absolute; top: 0; bottom: 0; left: 0; z-index: 60;
      width: 320px;
      background: #222; border-right: 1px solid rgba(255,255,255,0.08);
      box-shadow: 8px 0 24px rgba(0,0,0,0.30);
      display: flex; flex-direction: column;
      transform: translateX(-100%); opacity: 0;
      transition: transform 300ms ease-out, opacity 300ms ease-out;
    }
    .toc-panel.visible { transform: translateX(0); opacity: 1; }

    .toc-header {
      padding: 16px 20px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-family: 'Lora', 'Noto Serif SC', serif !important;
      font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.85);
    }
    .toc-header i { opacity: 0.5; }

    .toc-tabs {
      display: flex; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .toc-tab {
      flex: 1; padding: 10px; text-align: center; border: none; background: transparent;
      font-size: 12.5px; font-family: inherit; color: rgba(255,255,255,0.45);
      cursor: pointer; transition: all 0.15s;
    }
    .toc-tab:hover { background: rgba(255,255,255,0.04); }
    .toc-tab.active {
      color: var(--reader-chrome-active); font-weight: 600;
      box-shadow: inset 0 -2px 0 var(--reader-chrome-active);
    }

    .toc-list { flex: 1; overflow-y: auto; padding: 8px 0; }

    .toc-chapter-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; cursor: pointer;
      font-size: 13.5px; color: rgba(255,255,255,0.65);
      transition: all 0.12s; position: relative;
    }
    .toc-chapter-item:hover { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.9); }
    .toc-chapter-item.active {
      color: var(--reader-chrome-active); font-weight: 600;
      background: rgba(181, 101, 29, 0.08);
    }
    .toc-chapter-item.active::before {
      content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 20px; background: var(--reader-chrome-active);
      border-radius: 0 3px 3px 0;
    }
    .toc-chapter-item .toc-page { margin-left: auto; font-size: 11px; color: rgba(255,255,255,0.3);
      font-family: 'JetBrains Mono', monospace; }

    /* Thumbnail grid */
    .thumb-grid {
      display: none; flex: 1; overflow-y: auto;
      padding: 12px;
      grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .thumb-grid.visible { display: grid; }

    .thumb-item {
      aspect-ratio: 0.7; border-radius: 4px; overflow: hidden;
      cursor: pointer; position: relative;
      border: 2px solid transparent;
      transition: all 0.15s;
    }
    .thumb-item:hover { border-color: rgba(255,255,255,0.3); }
    .thumb-item.active { border-color: var(--reader-chrome-active); }
    .thumb-inner {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .thumb-page-num {
      position: absolute; bottom: 4px; right: 4px;
      font-size: 10px; color: rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.5); padding: 1px 5px; border-radius: 3px;
      font-family: 'JetBrains Mono', monospace;
    }

    .toc-bottom-tabs {
      display: flex; border-top: 1px solid rgba(255,255,255,0.08);
    }
    .toc-bottom-tab {
      flex: 1; padding: 12px; text-align: center; border: none; background: transparent;
      font-size: 12.5px; font-family: inherit; color: rgba(255,255,255,0.45);
      cursor: pointer; transition: all 0.15s;
    }
    .toc-bottom-tab:hover { background: rgba(255,255,255,0.04); }
    .toc-bottom-tab.active { color: var(--reader-chrome-active); font-weight: 600;
      box-shadow: inset 0 -2px 0 var(--reader-chrome-active);
    }

    /* ═══ Settings Panel ═══ */
    .settings-panel {
      position: absolute; top: 0; bottom: 0; right: 0; z-index: 60;
      width: 300px;
      background: #222; border-left: 1px solid rgba(255,255,255,0.08);
      box-shadow: -8px 0 24px rgba(0,0,0,0.30);
      display: flex; flex-direction: column; overflow-y: auto;
      transform: translateX(100%); opacity: 0;
      transition: transform 300ms ease-out, opacity 300ms ease-out;
    }
    .settings-panel.visible { transform: translateX(0); opacity: 1; }

    .settings-header {
      padding: 16px 20px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-family: 'Lora', 'Noto Serif SC', serif !important;
      font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.85);
    }
    .settings-header i { opacity: 0.5; }

    .settings-section { padding: 16px 20px; }
    .settings-section + .settings-section { border-top: 1px solid rgba(255,255,255,0.08); }
    .settings-section-title {
      font-size: 11.5px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; color: rgba(255,255,255,0.40);
      margin-bottom: 12px;
    }

    .setting-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-label {
      font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.7);
      min-width: 60px;
    }

    .setting-select {
      flex: 1; padding: 7px 12px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8);
      font-size: 13px; font-family: inherit; cursor: pointer; outline: none;
    }
    .setting-select option { background: #333; color: #eee; }

    .setting-slider {
      flex: 1; height: 4px; -webkit-appearance: none; appearance: none;
      background: rgba(255,255,255,0.12); border-radius: 2px;
      outline: none; cursor: pointer;
    }
    .setting-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: var(--reader-chrome-active); border: 2px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3); cursor: pointer;
    }
    .setting-value {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      min-width: 32px; text-align: right; color: rgba(255,255,255,0.45);
    }

    /* ═══════════════════════════════════════
       REDUCED MOTION
       ═══════════════════════════════════════ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.05ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="reader-container" id="reader-container">

    <!-- ═══ Click Zones ═══ -->
    <div class="click-zone click-zone-left" id="zone-left" onclick="prevPage()"></div>
    <div class="click-zone click-zone-center" id="zone-center" onclick="toggleChrome()"></div>
    <div class="click-zone click-zone-right" id="zone-right" onclick="nextPage()"></div>

    <!-- ═══ TOP BAR ═══ -->
    <header class="reader-topbar" id="topbar">
      <button class="topbar-back">
        <span class="back-arrow-icon"><i data-lucide="arrow-left" style="width:16px;height:16px;"></i></span>
        返回
      </button>
      <div class="topbar-title" id="topbar-title">
        进击的巨人 Vol.1<span class="page-sep">·</span><span id="title-page-info">第 12 / 186 页</span>
      </div>
      <div class="topbar-actions">
        <button class="topbar-btn" id="btn-toc" title="目录" onclick="toggleTOC()">
          <i data-lucide="list" style="width:18px;height:18px;"></i>
        </button>
        <button class="topbar-btn" id="btn-bookmark" title="书签" onclick="toggleBookmark()">
          <i data-lucide="bookmark" style="width:18px;height:18px;"></i>
        </button>
        <button class="topbar-btn" id="btn-settings" title="设置" onclick="toggleSettings()">
          <i data-lucide="settings" style="width:18px;height:18px;"></i>
        </button>
        <button class="topbar-btn" id="btn-fullscreen" title="全屏">
          <i data-lucide="maximize" style="width:18px;height:18px;"></i>
        </button>
      </div>
    </header>

    <!-- ═══ COMIC VIEWPORT ═══ -->
    <div class="comic-viewport" id="comic-viewport">
      <div class="page-container" id="page-container">

        <!-- Single page mode (default) -->
        <div class="page-placeholder single" id="page-single">
          <div class="page-panel-grid layout-a">
            <div class="panel-cell" style="background:linear-gradient(135deg,#e8dcc8,#d4c4a8);grid-column:1/3;"></div>
            <div class="panel-cell" style="background:linear-gradient(160deg,#c4a882,#a88a6a);"></div>
            <div class="panel-cell" style="background:linear-gradient(180deg,#ddd2c0,#c4b090);"></div>
            <div class="panel-cell" style="background:linear-gradient(135deg,#b8a080,#9a8060);grid-column:1/3;"></div>
          </div>
          <span class="page-number" id="page-num-display">12</span>
        </div>

      </div>
    </div>

    <!-- ═══ BOTTOM BAR ═══ -->
    <footer class="reader-bottombar" id="bottombar">
      <div class="bottombar-nav">
        <button class="page-nav-btn" onclick="prevPage()">
          <i data-lucide="chevron-left" style="width:14px;height:14px;"></i>
          上一页
        </button>

        <div class="progress-group">
          <div class="progress-slider-wrap" id="progress-wrap">
            <div class="progress-track">
              <div class="progress-fill" id="progress-fill" style="width:6.5%"></div>
            </div>
            <div class="progress-thumb" id="progress-thumb" style="left:6.5%"></div>
          </div>
          <div class="progress-info" id="progress-info">第 12 页 / 共 186 页 · 6%</div>
        </div>

        <button class="page-nav-btn" onclick="nextPage()">
          下一页
          <i data-lucide="chevron-right" style="width:14px;height:14px;"></i>
        </button>

        <div class="display-toggle">
          <button class="display-toggle-btn active" id="mode-single" title="单页" onclick="setDisplayMode('single')">
            <i data-lucide="square" style="width:16px;height:16px;"></i>
          </button>
          <button class="display-toggle-btn" id="mode-spread" title="双页" onclick="setDisplayMode('spread')">
            <i data-lucide="columns-2" style="width:16px;height:16px;"></i>
          </button>
        </div>
      </div>
    </footer>

    <!-- ═══ PANEL OVERLAY ═══ -->
    <div class="panel-overlay" id="panel-overlay" onclick="closeAllPanels()"></div>

    <!-- ═══ TOC PANEL ═══ -->
    <aside class="toc-panel" id="toc-panel">
      <div class="toc-header">
        <i data-lucide="list" style="width:18px;height:18px;"></i>
        目录
      </div>
      <div class="toc-tabs">
        <button class="toc-tab active" onclick="showTocView('chapters')">章节</button>
        <button class="toc-tab" onclick="showTocView('thumbs')">缩略图</button>
      </div>

      <!-- Chapter list -->
      <div class="toc-list" id="toc-chapters">
        <div class="toc-chapter-item">
          <span>第 1 话 致两千年后的你</span>
          <span class="toc-page">P.1</span>
        </div>
        <div class="toc-chapter-item active">
          <span>第 2 话 那一天</span>
          <span class="toc-page">P.7</span>
        </div>
        <div class="toc-chapter-item">
          <span>第 3 话 解散之夜</span>
          <span class="toc-page">P.49</span>
        </div>
        <div class="toc-chapter-item">
          <span>第 4 话 初阵</span>
          <span class="toc-page">P.91</span>
        </div>
        <div class="toc-chapter-item">
          <span>第 5 话 绝望之始</span>
          <span class="toc-page">P.133</span>
        </div>
        <div class="toc-chapter-item">
          <span>番外篇 伊尔泽的笔记</span>
          <span class="toc-page">P.165</span>
        </div>
      </div>

      <!-- Thumbnail grid -->
      <div class="thumb-grid" id="toc-thumbs"></div>

      <div class="toc-bottom-tabs">
        <button class="toc-bottom-tab active">目录</button>
        <button class="toc-bottom-tab">书签 (2)</button>
      </div>
    </aside>

    <!-- ═══ SETTINGS PANEL ═══ -->
    <aside class="settings-panel" id="settings-panel">
      <div class="settings-header">
        <i data-lucide="settings" style="width:18px;height:18px;opacity:0.5;"></i>
        阅读设置
      </div>

      <div class="settings-section">
        <div class="settings-section-title">显示</div>
        <div class="setting-row">
          <span class="setting-label">页面模式</span>
          <select class="setting-select" id="set-display" onchange="setDisplayMode(this.value)">
            <option value="single" selected>单页</option>
            <option value="spread">双页展开</option>
          </select>
        </div>
        <div class="setting-row">
          <span class="setting-label">缩放</span>
          <select class="setting-select">
            <option selected>适应高度</option>
            <option>适应宽度</option>
            <option>原始尺寸</option>
          </select>
        </div>
        <div class="setting-row">
          <span class="setting-label">阅读方向</span>
          <select class="setting-select" id="set-direction">
            <option selected>从左到右</option>
            <option>从右到左 (日漫)</option>
          </select>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section-title">背景</div>
        <div class="setting-row">
          <span class="setting-label">亮度</span>
          <input type="range" class="setting-slider" min="0" max="100" value="100"
                 oninput="setBrightness(this.value)">
          <span class="setting-value" id="brightness-val">100%</span>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section-title">页面间距</div>
        <div class="setting-row">
          <span class="setting-label">间距</span>
          <input type="range" class="setting-slider" min="0" max="48" value="16"
                 oninput="setPageGap(this.value)">
          <span class="setting-value" id="gap-val">16px</span>
        </div>
      </div>
    </aside>

  </div>

  <script>
    lucide.createIcons();

    /* ═══ State ═══ */
    let chromeVisible = false;
    let tocOpen = false;
    let settingsOpen = false;
    let currentPage = 12;
    let totalPages = 186;
    let displayMode = 'single';

    const topbar = document.getElementById('topbar');
    const bottombar = document.getElementById('bottombar');
    const tocPanel = document.getElementById('toc-panel');
    const settingsPanel = document.getElementById('settings-panel');
    const panelOverlay = document.getElementById('panel-overlay');
    const container = document.getElementById('reader-container');
    const pageContainer = document.getElementById('page-container');

    const panelColors = [
      ['#e8dcc8','#d4c4a8'], ['#c4a882','#a88a6a'], ['#ddd2c0','#c4b090'],
      ['#b8a080','#9a8060'], ['#d0c0a0','#b8a888'], ['#c8b898','#a89878'],
    ];

    /* ═══ Chrome show/hide ═══ */
    function showChrome() {
      chromeVisible = true;
      topbar.classList.add('visible');
      bottombar.classList.add('visible');
      container.classList.add('chrome-visible');
    }

    function hideChrome() {
      chromeVisible = false;
      topbar.classList.remove('visible');
      bottombar.classList.remove('visible');
      container.classList.remove('chrome-visible');
      if (tocOpen) toggleTOC();
      if (settingsOpen) toggleSettings();
    }

    function toggleChrome() {
      chromeVisible ? hideChrome() : showChrome();
    }

    /* ═══ Page navigation ═══ */
    function goToPage(p) {
      currentPage = Math.max(1, Math.min(totalPages, p));
      updatePageDisplay();
    }

    function nextPage() {
      const step = displayMode === 'spread' ? 2 : 1;
      if (currentPage < totalPages) {
        pageContainer.classList.add('turning-forward');
        setTimeout(() => {
          goToPage(currentPage + step);
          pageContainer.classList.remove('turning-forward');
        }, 150);
      }
      if (!chromeVisible) showChrome();
    }

    function prevPage() {
      const step = displayMode === 'spread' ? 2 : 1;
      if (currentPage > 1) {
        pageContainer.classList.add('turning-backward');
        setTimeout(() => {
          goToPage(currentPage - step);
          pageContainer.classList.remove('turning-backward');
        }, 150);
      }
      if (!chromeVisible) showChrome();
    }

    function updatePageDisplay() {
      const pct = Math.round((currentPage / totalPages) * 100);
      const fillPct = (currentPage / totalPages * 100).toFixed(1);

      document.getElementById('progress-fill').style.width = fillPct + '%';
      document.getElementById('progress-thumb').style.left = fillPct + '%';

      if (displayMode === 'spread' && currentPage < totalPages) {
        const p2 = currentPage + 1;
        document.getElementById('progress-info').textContent =
          `第 ${currentPage}-${p2} 页 / 共 ${totalPages} 页 · ${pct}%`;
        document.getElementById('title-page-info').textContent =
          `第 ${currentPage}-${p2} / ${totalPages} 页`;
      } else {
        document.getElementById('progress-info').textContent =
          `第 ${currentPage} 页 / 共 ${totalPages} 页 · ${pct}%`;
        document.getElementById('title-page-info').textContent =
          `第 ${currentPage} / ${totalPages} 页`;
      }

      document.getElementById('page-num-display').textContent = currentPage;
      renderPages();
    }

    /* ═══ Display mode ═══ */
    function setDisplayMode(mode) {
      displayMode = mode;
      document.getElementById('mode-single').classList.toggle('active', mode === 'single');
      document.getElementById('mode-spread').classList.toggle('active', mode === 'spread');
      document.getElementById('set-display').value = mode;
      renderPages();
      updatePageDisplay();
    }

    function renderPages() {
      const pc = document.getElementById('page-container');

      if (displayMode === 'single') {
        pc.innerHTML = `
          <div class="page-placeholder single">
            <div class="page-panel-grid layout-a">
              ${randomPanels('a')}
            </div>
            <span class="page-number" id="page-num-display">${currentPage}</span>
          </div>`;
      } else {
        const p2 = Math.min(currentPage + 1, totalPages);
        pc.innerHTML = `
          <div class="page-placeholder spread-left">
            <div class="page-panel-grid layout-a">
              ${randomPanels('a')}
            </div>
            <span class="page-number">${currentPage}</span>
          </div>
          <div class="page-placeholder spread-right">
            <div class="page-panel-grid layout-b">
              ${randomPanels('b')}
            </div>
            <span class="page-number">${p2}</span>
          </div>`;
      }
    }

    function randomPanels(layout) {
      const seed = currentPage * 7;
      const pick = (i) => panelColors[(seed + i) % panelColors.length];
      if (layout === 'a') {
        return `
          <div class="panel-cell" style="background:linear-gradient(135deg,${pick(0)[0]},${pick(0)[1]});grid-column:1/3;"></div>
          <div class="panel-cell" style="background:linear-gradient(160deg,${pick(1)[0]},${pick(1)[1]});"></div>
          <div class="panel-cell" style="background:linear-gradient(180deg,${pick(2)[0]},${pick(2)[1]});"></div>
          <div class="panel-cell" style="background:linear-gradient(135deg,${pick(3)[0]},${pick(3)[1]});grid-column:1/3;"></div>`;
      }
      return `
        <div class="panel-cell" style="background:linear-gradient(135deg,${pick(4)[0]},${pick(4)[1]});"></div>
        <div class="panel-cell" style="background:linear-gradient(160deg,${pick(5)[0]},${pick(5)[1]});grid-column:1/3;"></div>
        <div class="panel-cell" style="background:linear-gradient(180deg,${pick(0)[0]},${pick(0)[1]});grid-column:1/3;"></div>
        <div class="panel-cell" style="background:linear-gradient(135deg,${pick(2)[0]},${pick(2)[1]});"></div>
        <div class="panel-cell" style="background:linear-gradient(160deg,${pick(3)[0]},${pick(3)[1]});"></div>`;
    }

    /* ═══ TOC ═══ */
    function toggleTOC() {
      tocOpen = !tocOpen;
      tocPanel.classList.toggle('visible', tocOpen);
      panelOverlay.classList.toggle('visible', tocOpen || settingsOpen);
      if (tocOpen && settingsOpen) toggleSettings();
    }

    function showTocView(view) {
      const tabs = document.querySelectorAll('.toc-tabs .toc-tab');
      const chapters = document.getElementById('toc-chapters');
      const thumbs = document.getElementById('toc-thumbs');

      tabs[0].classList.toggle('active', view === 'chapters');
      tabs[1].classList.toggle('active', view === 'thumbs');
      chapters.style.display = view === 'chapters' ? 'block' : 'none';
      thumbs.classList.toggle('visible', view === 'thumbs');

      if (view === 'thumbs' && thumbs.children.length === 0) {
        generateThumbnails();
      }
    }

    function generateThumbnails() {
      const grid = document.getElementById('toc-thumbs');
      for (let i = 1; i <= 24; i++) {
        const colors = panelColors[(i * 3) % panelColors.length];
        const isActive = i === currentPage;
        grid.innerHTML += `
          <div class="thumb-item ${isActive ? 'active' : ''}" onclick="goToPage(${i}); toggleTOC();">
            <div class="thumb-inner" style="background:linear-gradient(135deg,${colors[0]},${colors[1]});"></div>
            <span class="thumb-page-num">${i}</span>
          </div>`;
      }
    }

    /* ═══ Settings ═══ */
    function toggleSettings() {
      settingsOpen = !settingsOpen;
      settingsPanel.classList.toggle('visible', settingsOpen);
      panelOverlay.classList.toggle('visible', tocOpen || settingsOpen);
      if (settingsOpen && tocOpen) toggleTOC();
    }

    function closeAllPanels() {
      if (tocOpen) toggleTOC();
      if (settingsOpen) toggleSettings();
    }

    function toggleBookmark() {
      const btn = document.getElementById('btn-bookmark');
      btn.classList.toggle('active');
      btn.style.transform = 'scale(1.15)';
      setTimeout(() => { btn.style.transform = ''; }, 500);
    }

    function setBrightness(val) {
      document.getElementById('comic-viewport').style.filter = `brightness(${val / 100})`;
      document.getElementById('brightness-val').textContent = val + '%';
    }

    function setPageGap(val) {
      document.documentElement.style.setProperty('--viewer-page-gap', val + 'px');
      document.getElementById('gap-val').textContent = val + 'px';
    }

    window.addEventListener('message', (e) => {
      if (e.data?.type === 'theme-change') {
        document.documentElement.setAttribute('data-reader-theme', e.data.dark ? 'dark' : 'paper');
      }
    });

    /* ═══ Keyboard shortcuts ═══ */
    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowLeft': prevPage(); break;
        case 'ArrowRight': nextPage(); break;
        case 'Escape':
          if (tocOpen || settingsOpen) closeAllPanels();
          else hideChrome();
          break;
        case 'f': case 'F':
          document.documentElement.requestFullscreen?.();
          break;
      }
    });

    /* ═══ Init ═══ */
    setTimeout(showChrome, 300);
  </script>
</body>
</html>
