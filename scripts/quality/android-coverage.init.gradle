// Opt in only for coverage runs; normal app builds keep their existing settings.
gradle.beforeProject { project ->
  project.plugins.withId('com.android.library') {
    if (project.name in ['my-reader-readium', 'expo-sharing']) {
      project.android.buildTypes.getByName('debug').enableUnitTestCoverage = true
      if (project.name == 'my-reader-readium') {
        project.android.buildTypes.getByName('debug').enableAndroidTestCoverage = true
      }
      project.android.testOptions.unitTests.all {
        jacoco {
          includeNoLocationClasses = true
          excludes = ['jdk.internal.*']
        }
      }
    }
  }
}
