appId: ${APP_ID}
name: Open Add Library without the tab bar obscuring the row
tags:
  - skip
---
- runFlow:
    when:
      notVisible:
        id: "add-library-create"
    commands:
      - runFlow: reset_settings_scroll.yaml
      - scrollUntilVisible:
          element:
            id: "settings-add-library-row"
          direction: DOWN
          centerElement: true
          timeout: 30000
      - tapOn:
          id: "settings-add-library-row"
          # A long library list can leave the row underneath the sticky header.
          point: "50%,85%"
- extendedWaitUntil:
    visible:
      id: "add-library-create"
    timeout: 15000
