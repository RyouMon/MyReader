appId: ${APP_ID}
tags:
  - settings
  - navigation
---
# 统一启动并注入所有 fixture，后续场景通过 UI 导航与返回串联执行
- runFlow: ../../common/launch_and_prepare.yaml
- runFlow: ../../common/seed_library.yaml
- runFlow: ../../common/seed_webdav.yaml
- runFlow: ../../common/seed_onedrive.yaml
- runFlow: ../../common/open_settings.yaml
- runScript: ../../scripts/selectors.js

# Scenario: 书库详情页面头部按钮
- tapOn: ${output.selectors.fixtures.libraryName}
- runFlow: ../../common/assert_header_back_or_close.yaml
- assertVisible: ${output.selectors.settings.toolbar.libraryDelete}
- runFlow: ../../common/tap_header_back_or_close.yaml

# Scenario: 添加书库页面头部按钮
- tapOn: ${output.selectors.settings.rows.addLibrary}
- assertVisible: ${output.selectors.fixtures.webdavSource}
- assertVisible: ${output.selectors.fixtures.onedriveSource}
- runFlow: ../../common/assert_header_back_or_close.yaml

# Scenario: WebDAV 浏览器页面头部按钮
- tapOn: ${output.selectors.fixtures.webdavSource}
- runFlow: ../../common/assert_header_back_or_close.yaml
- assertVisible: ${output.selectors.settings.toolbar.selectDirectory}

# Scenario: WebDAV 浏览器子目录页面头部按钮
- tapOn: ".*sub"
- runFlow: ../../common/assert_header_back.yaml
- assertVisible: ${output.selectors.settings.toolbar.selectDirectory}
- runFlow: ../../common/tap_header_back.yaml
- runFlow: ../../common/tap_header_back_or_close.yaml

# Scenario: OneDrive 浏览器页面头部按钮
- tapOn: ${output.selectors.fixtures.onedriveSource}
- runFlow: ../../common/assert_header_back_or_close.yaml
- assertVisible: ${output.selectors.settings.toolbar.selectDirectory}

# Scenario: OneDrive 浏览器子目录页面头部按钮
- tapOn: ".*sub"
- runFlow: ../../common/assert_header_back.yaml
- assertVisible: ${output.selectors.settings.toolbar.selectDirectory}
- runFlow: ../../common/tap_header_back.yaml
- runFlow: ../../common/tap_header_back_or_close.yaml
- runFlow: ../../common/tap_header_back_or_close.yaml

# Scenario: WebDAV 源列表页面头部按钮
- tapOn: ${output.selectors.settings.rows.webdav}
- assertVisible: ${output.selectors.fixtures.webdavSource}
- runFlow: ../../common/assert_header_back_or_close.yaml
- assertVisible: ${output.selectors.settings.toolbar.webdavAdd}

# Scenario: 添加 WebDAV 页面头部按钮
- tapOn: ${output.selectors.settings.toolbar.webdavAdd}
- runFlow: ../../common/assert_header_back.yaml
- assertVisible: ${output.selectors.settings.toolbar.addWebdavDone}
- runFlow: ../../common/tap_header_back.yaml

# Scenario: WebDAV 源详情页面头部按钮
- tapOn: ${output.selectors.fixtures.webdavSource}
- runFlow: ../../common/assert_header_back.yaml
- assertVisible: ${output.selectors.settings.toolbar.dataSourceDelete}
- runFlow: ../../common/tap_header_back.yaml
- runFlow: ../../common/tap_header_back_or_close.yaml

# Scenario: OneDrive 源列表页面头部按钮
- tapOn: ${output.selectors.settings.rows.onedrive}
- assertVisible: ${output.selectors.fixtures.onedriveSource}
- runFlow: ../../common/assert_header_back_or_close.yaml
- assertVisible: ${output.selectors.settings.toolbar.onedriveAdd}

# Scenario: OneDrive 源详情页面头部按钮
- tapOn: ${output.selectors.fixtures.onedriveSource}
- runFlow: ../../common/assert_header_back.yaml
- assertVisible: ${output.selectors.settings.toolbar.dataSourceDelete}
- runFlow: ../../common/tap_header_back.yaml

# Scenario: 返回设置主页
- runFlow: ../../common/tap_header_back_or_close.yaml
- assertVisible: ${output.selectors.settings.rows.addLibrary}
