<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
    <title>Progress jump target</title>
    <style>
      body { line-height: 1.65; }
      h1 { margin-block-end: 1.5em; }
      p { margin-block: 1em; }
    </style>
  </head>
  <body>
    <h1>Progress jump target</h1>
    <p>This is the first sentence after a progress jump. Readium must begin here instead of reusing the previous page locator.</p>
    <p>The navigation target remains stable while speech continues. No stale follow request may return to an earlier chapter.</p>
  </body>
</html>
