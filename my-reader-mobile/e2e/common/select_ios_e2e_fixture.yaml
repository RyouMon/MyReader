appId: ${APP_ID}
name: Select a supported book fixture from the prepared iOS E2E folder
---
# Required env: E2E_ROOT_FOLDER, IMPORT_FILE_NAME.
- extendedWaitUntil:
    visible: "Cancel|取消"
    # A fresh CI simulator can take over 30 seconds to start DocumentManager.
    timeout: 60000
# Re-enter the folder for every import. Files restores its previous list, but
# those item IDs become stale if the LocalStorage provider restarts between picks.
- runFlow:
    when:
      visible: "浏览|Browse"
    commands:
      - tapOn: "浏览|Browse"
- repeat:
    times: 8
    while:
      visible:
        id: "BackButton"
        childOf:
          id: "Browse View \\(Picker\\)"
    commands:
      - tapOn:
          id: "BackButton"
          childOf:
            id: "Browse View \\(Picker\\)"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "DOC.sidebar.item.我的iPhone|DOC.sidebar.item.On My iPhone|DOC.sidebar.item.我的iPad|DOC.sidebar.item.On My iPad"
    commands:
      - tapOn:
          id: "DOC.sidebar.item.我的iPhone|DOC.sidebar.item.On My iPhone|DOC.sidebar.item.我的iPad|DOC.sidebar.item.On My iPad"
      - waitForAnimationToEnd
- tapOn:
    id: "MyReader Fixtures, Container"
    point: "50%,25%"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "${E2E_ROOT_FOLDER}, Folder"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "${E2E_ROOT_FOLDER}, Folder"
    point: "50%,25%"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "Fixtures, Folder"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "Fixtures, Folder"
    point: "50%,25%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "${IMPORT_FILE_NAME}, (epub|pdf|cbz|md|fb2|azw3)"
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: "${IMPORT_FILE_NAME}, (epub|pdf|cbz|md|fb2|azw3)"
    point: "50%,25%"
- extendedWaitUntil:
    notVisible:
      id: "Browse View \\(Picker\\)"
    timeout: 15000
