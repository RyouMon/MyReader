packages:
  - "packages/fonts"
  - "packages/i18n"
  - "packages/tools"
  - "my-reader"
  - "my-reader-mobile"
patchedDependencies:
  "@kesha-antonov/react-native-background-downloader@4.5.4": "patches/@kesha-antonov__react-native-background-downloader@4.5.4.patch"
  "@react-native-menu/menu@2.0.0": "patches/@react-native-menu__menu@2.0.0.patch"
  '@react-native/gradle-plugin@0.85.3': patches/@react-native__gradle-plugin@0.85.3.patch
  "@readium/navigator@2.5.4": "patches/@readium__navigator@2.5.4.patch"
  "@readium/speech@0.7.0": "patches/@readium__speech@0.7.0.patch"
  expo-modules-core@56.0.27: patches/expo-modules-core@56.0.27.patch
  expo-sharing@56.0.18: patches/expo-sharing@56.0.18.patch
  query-string@7.1.3: patches/query-string@7.1.3.patch
  "react-native-css@3.0.7": "patches/react-native-css@3.0.7.patch"
  uniffi-bindgen-react-native@0.31.0-3: patches/uniffi-bindgen-react-native@0.31.0-3.patch
allowBuilds:
  '@sentry/cli': true
  edgedriver: true
  esbuild: true
  geckodriver: true
  msgpackr-extract: true
  unrs-resolver: true
overrides:
  esbuild@0.28.0: 0.28.1
  lightningcss: 1.30.1
  # Expo's Xcode project writer only uses uuid.v4; v11 retains CommonJS support.
  xcode@3.0.1>uuid: 11.1.1
  # Pair the patched ESM decoder with query-string's CommonJS interop patch.
  query-string@7.1.3>decode-uri-component: 0.5.0
  # Image colors uses the browser adapter on web and native modules on iOS/Android.
  # No product path uses node-vibrant/node or its Jimp/file-type decoder chain.
  node-vibrant@4.0.4>@vibrant/image-node: '-'
blockExoticSubdeps: false
audit:
  ignore:
    # Accepted while no patched release exists; revisit when updating dependencies.
    - GHSA-86w9-cpqp-85rv # node-forge
    - GHSA-vfj7-8cjw-p6xm # braces
    - GHSA-hp3w-g68c-fv3c # sprintf-js
