    timeout: 10000
- tapOn: "继续朗读|Resume narration"
- extendedWaitUntil:
    visible: "暂停朗读|Pause narration"
    timeout: 30000
- tapOn: "暂停朗读|Pause narration"
- assertVisible: "继续朗读|Resume narration"
- tapOn: "继续朗读|Resume narration"
- extendedWaitUntil:
    visible: "暂停朗读|Pause narration"
    timeout: 10000
- tapOn: "暂停朗读|Pause narration"
- assertVisible: "继续朗读|Resume narration"
- tapOn: "下一句|Next sentence"
- extendedWaitUntil:
    visible: "继续朗读|Resume narration"
    timeout: 10000
- tapOn: "上一句|Previous sentence"
- extendedWaitUntil:
    visible: "继续朗读|Resume narration"
    timeout: 10000
- swipe:
    start: "85%,50%"
    end: "15%,50%"
    duration: 500
- extendedWaitUntil:
    visible: "Manual viewport target"
    timeout: 10000
- extendedWaitUntil:
    visible: "从当前位置播放|Play from here"
    timeout: 10000
- assertVisible: "返回播放位置|Return to narration"
- assertVisible: "继续朗读|Resume narration"
- takeScreenshot: tts-paused-page-turn-stays-detached
- tapOn: "返回播放位置|Return to narration"
- assertNotVisible: "从当前位置播放|Play from here"
- assertNotVisible: "返回播放位置|Return to narration"
- extendedWaitUntil:
    visible: "Playback lifecycle anchor.*"
    timeout: 10000
- assertVisible: "继续朗读|Resume narration"
- assertNotVisible: "返回播放位置|Return to narration"
- swipe:
    start: "85%,50%"
    end: "15%,50%"
    duration: 500
- extendedWaitUntil:
    visible: "Manual viewport target"
    timeout: 10000
- extendedWaitUntil:
    visible: "从当前位置播放|Play from here"
    timeout: 10000
- assertVisible: "继续朗读|Resume narration"
- tapOn: "从当前位置播放|Play from here"
- extendedWaitUntil:
    visible: "暂停朗读|Pause narration"
