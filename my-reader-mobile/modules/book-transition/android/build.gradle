plugins {
  id 'com.android.library'
  id 'kotlin-android'
  id 'expo-module-gradle-plugin'
}

group = 'com.myreader.booktransition'
version = '0.12.0'

android {
  namespace "com.myreader.booktransition"
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName "0.12.0"
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
