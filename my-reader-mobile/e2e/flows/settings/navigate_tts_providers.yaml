appId: ${APP_ID}
name: Provider form returns through the native sheet stack
---
- runFlow: ../../common/launch_and_prepare.yaml
- runFlow: ../../common/open_settings.yaml
- scrollUntilVisible:
    element:
      id: settings-tts-providers-row
    direction: DOWN
- tapOn:
    id: settings-tts-providers-row
- assertVisible: "TTS 供应商|TTS providers"
- scrollUntilVisible:
    element: "添加 TTS 供应商|Add TTS provider"
    direction: DOWN
- tapOn: "添加 TTS 供应商|Add TTS provider"
- tapOn: ".*OpenAI 兼容.*|.*OpenAI-compatible.*"
- assertVisible:
    id: tts-provider-name
- runFlow:
    when:
      platform: iOS
    commands:
      # The iPad modal is inset from the screen edge. Begin inside its native bar.
      - swipe:
          from:
            id: "添加 OpenAI 兼容服务|Add OpenAI-compatible service"
            point: "1%,50%"
          direction: RIGHT
          duration: 600
- runFlow:
    when:
      platform: Android
    commands:
      - back
- assertVisible: ".*OpenAI 兼容.*|.*OpenAI-compatible.*"
- assertNotVisible:
    id: tts-provider-name
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "关闭|Close"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- assertVisible: "添加 TTS 供应商|Add TTS provider"
