appId: ${APP_ID}
name: Configure the local speech fixture through provider settings
---
- runFlow: open_settings.yaml
- scrollUntilVisible:
    element:
      id: settings-tts-providers-row
    direction: DOWN
- tapOn:
    id: settings-tts-providers-row
- scrollUntilVisible:
    element: "添加 TTS 供应商|Add TTS provider"
    direction: DOWN
- tapOn: "添加 TTS 供应商|Add TTS provider"
- tapOn: ".*OpenAI 兼容.*|.*OpenAI-compatible.*"
- tapOn:
    id: tts-provider-name
- eraseText
- inputText: "E2E Speech"
- tapOn:
    id: tts-provider-endpoint
    point: "95%,50%"
- eraseText
- inputText: ${TTS_URL}
- assertVisible: ${TTS_URL}
- tapOn:
    id: tts-provider-credential
- inputText: "fixture-openai-key"
# Accessibility can include fields underneath the software keyboard.
- runFlow: finish_single_line_input.yaml
- scrollUntilVisible:
    element:
      id: tts-voice-id-0
    direction: DOWN
    centerElement: true
- tapOn:
    id: tts-voice-id-0
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: tts-voice-id-0
          focused: true
      - takeScreenshot: tts-voice-field-focused
- inputText: "alloy"
- runFlow: finish_single_line_input.yaml
- assertVisible:
    id: tts-voice-id-0
    text: "alloy"
- tapOn:
    text: "保存|Save"
    enabled: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "TTS 供应商|TTS providers"
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "关闭|Close"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow: open_tts_settings.yaml
- scrollUntilVisible:
    element: "朗读引擎.*|Narration engine.*"
    direction: UP
- tapOn: "朗读引擎.*|Narration engine.*"
- tapOn: "E2E Speech/.*"
- waitForAnimationToEnd
# Reopen the native menu to verify persistence before launching the reader.
- tapOn: "朗读引擎.*|Narration engine.*"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          text: "E2E Speech/.*"
          selected: true
      - tapOn:
          text: "E2E Speech/.*"
          selected: true
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: "android:id/checkbox"
          checked: true
          rightOf: "E2E Speech/.*"
      - tapOn: "E2E Speech/.*"
