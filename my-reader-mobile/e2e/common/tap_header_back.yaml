appId: ${APP_ID}
name: Tap pushed page back button
---
- runScript: ../scripts/selectors.js
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "BackButton"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: ${output.selectors.settings.header.back}
