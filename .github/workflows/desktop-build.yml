name: Windows build candidate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter my-reader tauri build --bundles msi,nsis -- --locked
      - name: Bind both installers to this checkout and run
        shell: bash
        run: |
          set -eu
          mkdir windows
          cp target/release/bundle/msi/*.msi target/release/bundle/nsis/*-setup.exe windows/
          git rev-parse HEAD > windows/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MyReader-Windows-x64
          path: windows/
          overwrite: true
          if-no-files-found: error
          retention-days: 30
