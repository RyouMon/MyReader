appId: ${APP_ID}
name: Import and read EPUB, PDF and CBZ through native navigators
---
- runFlow: ../../common/create_fixture_library.yaml
- runFlow: ../../common/import_epub_fixture.yaml
- runFlow: ../reader/read_book.yaml
- runFlow: ../../common/close_reader.yaml
- runFlow:
    file: ../../common/import_fixed_fixture.yaml
    env:
      IMPORT_FILE_NAME: ${PDF_PICKER_FILE_NAME}
      BOOK_TITLE: ${PDF_BOOK_TITLE}
- runFlow:
    file: ../../common/import_fixed_fixture.yaml
    env:
      IMPORT_FILE_NAME: ${CBZ_IMPORT_FILE_NAME}
      BOOK_TITLE: ${CBZ_BOOK_TITLE}
