appId: ${APP_ID}
name: Search autofocus and one-back navigation survive cross-tab reentry
---
- runFlow: ../../common/launch_preserving_data.yaml
- tapOn: "搜索|Search"
# Typing without tapping the field proves native autofocus, including Android tabs.
- inputText: "MyReader"
- assertVisible: "作者, MyReader|Authors, MyReader"
- tapOn: "作者, MyReader|Authors, MyReader"
- assertVisible: '打开《MyReader TTS E2E》|Open "MyReader TTS E2E"'
- tapOn: "关闭|Close"
- tapOn: "主页|首页|Home"
- assertVisible:
    id: home-screen
- tapOn: "搜索|Search"
- inputText: "TTS"
- assertVisible: '打开《MyReader TTS E2E》|Open "MyReader TTS E2E"'
- tapOn: "关闭|Close"
- runFlow: ../../common/tap_header_back.yaml
- assertVisible:
    id: library-import-book-button
# System picker cancellation is a real native transition, not a dev overlay.
- tapOn:
    id: library-import-book-button
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "取消|Cancel"
          childOf:
            id: "Browse View \\(Picker\\)"
      - extendedWaitUntil:
          notVisible:
            id: "Browse View \\(Picker\\)"
          timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          times: 10
          while:
            visible:
              id: "(com.google.android.documentsui|com.android.documentsui):id/toolbar"
          commands:
            - back
- assertVisible:
    id: library-import-book-button
