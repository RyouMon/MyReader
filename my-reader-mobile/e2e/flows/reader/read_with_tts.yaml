appId: ${APP_ID}
name: Narration preserves its own cursor across manual page turns
---
- runFlow: ../../common/launch_preserving_data.yaml
- tapOn: "Library|书库"
- tapOn:
    id: library-collection-all
- tapOn: '打开《MyReader TTS E2E》|Open "MyReader TTS E2E"'
- extendedWaitUntil:
    visible:
      id: reader-screen
    timeout: 30000
- runFlow:
    when:
      notVisible: "更多操作|More Actions|More actions"
    commands:
      - tapOn:
          point: "50%,50%"
- tapOn: "更多操作|More Actions|More actions"
- tapOn: "目录|Contents"
- tapOn:
    text: "Playback position authority"
    below: "目录|Contents|Table of Contents"
- extendedWaitUntil:
    visible: "Playback position first page.*"
    timeout: 10000
- runFlow:
    when:
      notVisible: "打开听书播放器|Open read-aloud controls"
    commands:
      - tapOn:
          point: "50%,50%"
- tapOn: "打开听书播放器|Open read-aloud controls"
- tapOn: "继续朗读|Resume narration"
- extendedWaitUntil:
    visible: "暂停朗读|Pause narration"
    timeout: 30000
- tapOn: "暂停朗读|Pause narration"
- assertVisible: "继续朗读|Resume narration"
- tapOn: "下一句|Next sentence"
- extendedWaitUntil:
    visible: "Latest narration second page.*"
    timeout: 10000
- swipe:
    start: "85%,50%"
    end: "15%,50%"
    duration: 500
- extendedWaitUntil:
    visible: "返回播放位置|Return to narration"
    timeout: 10000
- assertVisible: "从当前位置播放|Play from here"
- assertVisible: "继续朗读|Resume narration"
- tapOn: "返回播放位置|Return to narration"
- extendedWaitUntil:
    visible: "Latest narration second page.*"
    timeout: 10000
- assertNotVisible: "返回播放位置|Return to narration"
- assertVisible: "继续朗读|Resume narration"
- tapOn: "继续朗读|Resume narration"
- extendedWaitUntil:
    visible: "暂停朗读|Pause narration"
    timeout: 10000
- tapOn: "停止朗读|Stop narration"
- assertNotVisible: "朗读控制|Read-aloud controls"
- runFlow: ../../common/close_reader.yaml
