appId: ${APP_ID}
name: Tap modal root back or close button
tags:
  - skip
---
- runScript: ../scripts/selectors.js
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${output.selectors.settings.header.close}
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: ${output.selectors.settings.header.back}
