[workspace]
resolver = "2"
members = [
    "my-reader-core",
    "my-reader-mobile/modules/my-reader-core/rust",
    "my-reader/src-tauri",
]
[workspace.package]
edition = "2021"

[workspace.dependencies]
automerge = "=0.10.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dunce = "1"
my-reader-core = { path = "my-reader-core" }
my-reader-core-ffi = { path = "my-reader-mobile/modules/my-reader-core/rust" }
opendal = { version = "0.50", default-features = false, features = ["services-webdav", "services-fs", "services-onedrive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "net", "time"] }
uniffi = "=0.31.0"
uuid = { version = "1", features = ["v4"] }
rusqlite = "0.32.1"
sea-orm = { version = "2.0.0-rc.38", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "2.0.0-rc.38", default-features = false }
tracing = "0.1"
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
